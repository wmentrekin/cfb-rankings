name: Manual - Margin Scale Before/After Report

# READ-ONLY. Solves the model twice for every published week (the old margin scale and the
# corrected one) and prints how far they differ. It holds database credentials only: no R2
# secrets, no CFBD key, and scripts/compare_margin_scale.py issues nothing but SELECTs. It does
# not run main.py, so nothing is ingested, rated into a table, or published.

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Only this season (blank = every published season)'
        required: false
        default: ''

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Build the report
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          SEASON: ${{ github.event.inputs.season }}
        run: |
          ARGS="--out margin-scale-report.md"
          if [ -n "$SEASON" ]; then ARGS="$ARGS --season $SEASON"; fi
          uv run python scripts/compare_margin_scale.py $ARGS --dump-json margin-scale-ratings.json > /dev/null
          echo "REPORT_BEGIN"
          cat margin-scale-report.md
          echo "REPORT_END"
          cat margin-scale-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: margin-scale-report
          path: |
            margin-scale-report.md
            margin-scale-ratings.json
