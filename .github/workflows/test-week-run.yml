name: Manual Test - Weekly Rankings Run

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Season year'
        required: true
        default: '2026'
      week:
        description: 'CFB week number'
        required: true
        default: '1'

jobs:
  test_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --extra pipeline

      - name: Run model for inputs
        env:
          API_KEY: ${{secrets.CFBD_API_KEY}}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          echo "Running main.py with year=${{ github.event.inputs.year }}, week=${{ github.event.inputs.week }}"
          uv run python main.py --year ${{ github.event.inputs.year }} --week ${{ github.event.inputs.week }} > output.log 2>&1 || true
      - name: Upload output log
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-log
          path: output.log

      - name: Fail job on manual result override failure
        # Deliberately the LAST step, matching weekly-update.yml: a failed override never
        # halts publishing (K5), it only needs to raise the alarm. This run also writes to
        # the production database without --staging and also ends in `> output.log 2>&1 ||
        # true`, so without this step a manual-run override failure would go green here too.
        run: |
          if grep -q "OVERRIDE_FAILURE" output.log; then
            echo "::error::Manual result override failure(s) found in output.log:"
            grep "OVERRIDE_FAILURE" output.log
            exit 1
          fi
