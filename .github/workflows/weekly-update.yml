name: Weekly Rankings - Auto Update

on:
  schedule:
    # Every Sunday at 07:00 UTC = 03:00 ET
    - cron: '0 7 * * 0'
    # ONE-OFF for 2026 Week 1: Sun/Mon Week 1 games mean the normal Sunday run
    # would fire before Week 1 is complete, so Week 1 is pushed to Tue 2026-09-08
    # 07:00 UTC = 03:00 ET instead. The `gate` job below suppresses the regular
    # Sunday 2026-09-06 firing so it doesn't double-run. This cron entry recurs
    # every Sept 8, so delete this line (and the gate job/step, restoring the
    # single Sunday-only schedule) once the 2026 Week 1 run has shipped.
    - cron: '0 7 8 9 *'
  workflow_dispatch:
    inputs:
      week:
        description: 'Optional week override (leave blank to compute from the date)'
        required: false

concurrency:
  group: weekly-rankings
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check 2026 Week 1 delay window
        id: check
        run: |
          # Only scheduled (cron) triggers are gated; manual workflow_dispatch always runs.
          # Suppresses the regular Sunday cron until Week 1 is deliberately kicked off on
          # 2026-09-08 (see the schedule comment above). Self-disarms after that date.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            today="$(date -u +%Y-%m-%d)"
            if [[ "$today" < "2026-09-08" ]]; then
              echo "Skipping: before 2026-09-08 Week 1 delay cutoff (today=$today)."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  weekly_update:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --frozen --extra pipeline

      - name: Run weekly model (production)
        env:
          API_KEY: ${{secrets.CFBD_API_KEY}}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          WEEK_INPUT: ${{ github.event.inputs.week }}
        run: |
          # Week override, in priority order:
          #   1. An explicit `week` input on a manual workflow_dispatch run.
          #   2. ONE-OFF for 2026 Week 1. main.py derives its week from today's
          #      date, but this run is deliberately delayed to Tue 2026-09-08 so
          #      Monday's Week 1 games are final (see the schedule comment at the
          #      top of this file). By then the date has crossed into Week 2's
          #      window, so an un-overridden run would rate Week 1's slate but
          #      publish it as week-02.json, and 2026 would never get a Week 1
          #      snapshot. CFBD's own week 1 for 2026 spans 2026-08-29 through
          #      2026-09-07 -- Week 0's Saturday through Monday night -- which is
          #      exactly the slate this run should rate. Delete this branch (with
          #      the one-off cron entry and the gate job) once it has shipped.
          # Note this only labels/selects the week; the rating model itself reads
          # CFBD's own `games.week` column, not the date-derived week.
          EXTRA_ARGS=""
          if [ -n "$WEEK_INPUT" ]; then
            EXTRA_ARGS="--week $WEEK_INPUT"
          elif [ "$(date -u +%Y-%m-%d)" = "2026-09-08" ]; then
            EXTRA_ARGS="--week 1"
          fi
          echo "Running: main.py $EXTRA_ARGS"
          uv run python main.py $EXTRA_ARGS > output.log 2>&1 || true
          tail -n 200 output.log || true

      - name: Upload output log artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-log
          path: output.log

      - name: Trigger personal-site rebuild
        env:
          DEPLOY_HOOK_URL: ${{ secrets.PERSONAL_SITE_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$DEPLOY_HOOK_URL" || echo "Deploy hook trigger failed (non-fatal)."

      - name: Fail job on manual result override failure
        # Deliberately the LAST step. The whole point of the override design is that a failed
        # override never halts publishing (K5): the run completes, the artifacts publish, and
        # the site still rebuilds -- an unapplied override just shows the real CFBD result,
        # whereas a blocked rebuild would leave the site stale for a week. This step only
        # raises the alarm. It has to exist as a step at all because the model step above ends
        # in `|| true`, so a nonzero exit from main.py is invisible and the job goes green.
        run: |
          if grep -q "OVERRIDE_FAILURE" output.log; then
            echo "::error::Manual result override failure(s) found in output.log:"
            grep "OVERRIDE_FAILURE" output.log
            exit 1
          fi

