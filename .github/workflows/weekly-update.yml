name: Weekly Rankings - Auto Update

on:
  schedule:
    # Every Sunday at 07:00 UTC = 03:00 ET.
    #
    # If a future season opens with Week 1 games on the Sunday or Monday, this run would fire
    # before Week 1 is complete. The 2026 season needed exactly that treatment and was handled
    # with a one-off extra cron plus a gate job that suppressed the regular Sunday firing; both
    # were removed once the delayed run had shipped. Prefer that shape again -- a dated one-off
    # plus a gate that self-disarms -- over moving this line, and delete both afterwards, since
    # a bare `cron: '0 7 8 9 *'` recurs every year.
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      week:
        description: 'Optional week override (leave blank to compute from the date)'
        required: false

concurrency:
  group: weekly-rankings
  cancel-in-progress: true

jobs:
  weekly_update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --frozen --extra pipeline

      - name: Run weekly model (production)
        env:
          API_KEY: ${{secrets.CFBD_API_KEY}}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          WEEK_INPUT: ${{ github.event.inputs.week }}
        run: |
          # An explicit `week` input on a manual workflow_dispatch run overrides the week;
          # otherwise main.py derives it from today's date.
          #
          # A delayed run needs that override. When the 2026 opener was pushed to a Tuesday so
          # Monday's Week 1 games would be final, the date had already crossed into Week 2's
          # window, so an un-overridden run would have rated Week 1's slate and published it as
          # week-02.json -- leaving that season with no Week 1 snapshot at all. That was handled
          # with a dated branch here, removed once it had shipped. Any future delayed opener
          # needs the same treatment.
          #
          # Note this only labels/selects the week; the rating model itself reads CFBD's own
          # `games.week` column, not the date-derived week.
          EXTRA_ARGS=""
          if [ -n "$WEEK_INPUT" ]; then
            EXTRA_ARGS="--week $WEEK_INPUT"
          fi
          echo "Running: main.py $EXTRA_ARGS"
          uv run python main.py $EXTRA_ARGS > output.log 2>&1 || true
          tail -n 200 output.log || true

      - name: Upload output log artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-log
          path: output.log

      - name: Trigger personal-site rebuild
        env:
          DEPLOY_HOOK_URL: ${{ secrets.PERSONAL_SITE_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$DEPLOY_HOOK_URL" || echo "Deploy hook trigger failed (non-fatal)."

      - name: Fail job on manual result override failure
        # Deliberately the LAST step. The whole point of the override design is that a failed
        # override never halts publishing (K5): the run completes, the artifacts publish, and
        # the site still rebuilds -- an unapplied override just shows the real CFBD result,
        # whereas a blocked rebuild would leave the site stale for a week. This step only
        # raises the alarm. It has to exist as a step at all because the model step above ends
        # in `|| true`, so a nonzero exit from main.py is invisible and the job goes green.
        run: |
          if grep -q "OVERRIDE_FAILURE" output.log; then
            echo "::error::Manual result override failure(s) found in output.log:"
            grep "OVERRIDE_FAILURE" output.log
            exit 1
          fi
          # Separate token, same reasoning: a schema mismatch stops ingest dead, and main.py's
          # own exit code cannot be seen from here because the run step ends in `|| true`.
          if grep -q "INGEST_FAILURE" output.log; then
            echo "::error::Ingest could not run -- database schema does not match the code (unapplied migration?):"
            grep "INGEST_FAILURE" output.log
            exit 1
          fi

