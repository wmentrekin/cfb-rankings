name: Weekly Rankings - Auto Update

on:
  schedule:
    # Every Sunday at 07:00 UTC = 03:00 ET, ALL YEAR. Do not switch this off after the
    # season: the run works out for itself what there is to do (season_end.py). In season it
    # rates and publishes the week. After conference championship week it stops computing
    # rankings and only brings in bowl and playoff results for the Season Grid and the bracket.
    # Once the season's last game is more than a week old it does nothing until next August.
    #
    # If a future season opens with Week 1 games on the Sunday or Monday, this run would fire
    # before Week 1 is complete. The 2026 season needed exactly that treatment and was handled
    # with a one-off extra cron plus a gate job that suppressed the regular Sunday firing; both
    # were removed once the delayed run had shipped. Prefer that shape again -- a dated one-off
    # plus a gate that self-disarms -- over moving this line, and delete both afterwards, since
    # a bare `cron: '0 7 8 9 *'` recurs every year.
    - cron: '0 7 * * 0'
    # DATED ONE-OFFS for the 2026 playoff field (selection day is Sunday Dec 6, 2026; the
    # regular Sunday run above fires before the bracket is announced). These re-run the
    # pipeline on the Monday and Tuesday after, so the postseason ingest picks up the real
    # first-round and quarterfinal games and the playoffs artifact switches from a projection
    # to the actual bracket without waiting a week. Two shots in case CFBD lists the games
    # late; the run is idempotent. A bare dated cron recurs EVERY year, so the `gate` job
    # below only lets these fire in 2026. Delete both lines and the gate's year check once
    # the 2026 bracket has shipped.
    - cron: '0 9 7 12 *'
    - cron: '0 9 8 12 *'
  workflow_dispatch:
    inputs:
      week:
        description: 'Optional week override (leave blank to compute from the date)'
        required: false

concurrency:
  group: weekly-rankings
  cancel-in-progress: true

jobs:
  gate:
    # Decides whether this firing should run at all. The weekly Sunday schedule and manual
    # dispatches always run. A dated one-off schedule (see the cron comments above) runs only
    # in the year it was written for, so it disarms itself instead of recurring annually.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          RUN=true
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" != "0 7 * * 0" ]; then
            if [ "$(date -u +%Y)" != "2026" ]; then
              RUN=false
              echo "Dated one-off schedule '$SCHEDULE' is expired (not 2026); skipping."
            fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  weekly_update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --frozen --extra pipeline

      - name: Run weekly model (production)
        env:
          API_KEY: ${{secrets.CFBD_API_KEY}}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          WEEK_INPUT: ${{ github.event.inputs.week }}
        run: |
          # An explicit `week` input on a manual workflow_dispatch run overrides the week;
          # otherwise main.py derives it from today's date.
          #
          # A delayed run needs that override. When the 2026 opener was pushed to a Tuesday so
          # Monday's Week 1 games would be final, the date had already crossed into Week 2's
          # window, so an un-overridden run would have rated Week 1's slate and published it as
          # week-02.json -- leaving that season with no Week 1 snapshot at all. That was handled
          # with a dated branch here, removed once it had shipped. Any future delayed opener
          # needs the same treatment.
          #
          # Note this only labels/selects the week; the rating model itself reads CFBD's own
          # `games.week` column, not the date-derived week.
          EXTRA_ARGS=""
          if [ -n "$WEEK_INPUT" ]; then
            EXTRA_ARGS="--week $WEEK_INPUT"
          fi
          echo "Running: main.py $EXTRA_ARGS"
          uv run python main.py $EXTRA_ARGS > output.log 2>&1 || true
          tail -n 200 output.log || true

      - name: Upload output log artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-log
          path: output.log

      - name: Trigger personal-site rebuild
        env:
          DEPLOY_HOOK_URL: ${{ secrets.PERSONAL_SITE_DEPLOY_HOOK_URL }}
        # A failed hook must not stop the job here (the checks below still have to run), but it
        # must not pass unnoticed either: when the hook started returning 400 the artifacts
        # published, the site stayed a week behind, and this job was green. So: retry transient
        # failures, leave a marker on a final failure, and let the last step turn the job red.
        run: |
          # Out of season the run publishes nothing (season_end.py: the season is over, or the
          # next one has not started), so there is nothing for the site to rebuild for.
          if grep -q "NOTHING_TO_PUBLISH" output.log; then
            echo "Nothing was published, so the site is not rebuilt."
            exit 0
          fi
          if curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 60 -o /dev/null -X POST "$DEPLOY_HOOK_URL"; then
            echo "Deploy hook accepted."
          else
            echo "::warning::Deploy hook trigger failed; the site was not asked to rebuild."
            touch deploy-hook-failed
          fi

      - name: Fail job on manual result override failure
        # Deliberately the LAST step. The whole point of the override design is that a failed
        # override never halts publishing (K5): the run completes, the artifacts publish, and
        # the site still rebuilds -- an unapplied override just shows the real CFBD result,
        # whereas a blocked rebuild would leave the site stale for a week. This step only
        # raises the alarm. It has to exist as a step at all because the model step above ends
        # in `|| true`, so a nonzero exit from main.py is invisible and the job goes green.
        run: |
          # Every check runs before the job exits, so one failure cannot hide another.
          failed=0
          if grep -q "OVERRIDE_FAILURE" output.log; then
            echo "::error::Manual result override failure(s) found in output.log:"
            grep "OVERRIDE_FAILURE" output.log
            failed=1
          fi
          # Separate token, same reasoning: a failed ingest -- a schema mismatch, or CFBD
          # unavailable after the fetch retries -- stops the run (or, for the postseason slate,
          # is flagged), and main.py's own exit code cannot be seen from here because the run
          # step ends in `|| true`.
          if grep -q "INGEST_FAILURE" output.log; then
            echo "::error::Ingest failed -- unapplied migration, CFBD unavailable after retries, or no games returned for the week (the run stopped before publishing):"
            grep "INGEST_FAILURE" output.log
            failed=1
          fi
          # From December on, a run that cannot tell whether the rankings are finished stops
          # rather than risk publishing a week after they have ended, and so does a postseason
          # update that crashes (season_end.py).
          if grep -q "SEASON_END_CHECK_FAILED" output.log; then
            echo "::error::Could not tell whether the season's rankings are finished, so the run stopped before doing anything:"
            grep "SEASON_END_CHECK_FAILED" output.log
            failed=1
          fi
          # The artifacts are in R2 at this point; only the site rebuild is missing. Re-running
          # the job fires the hook again, or the site can be redeployed from the Cloudflare
          # dashboard.
          if [ -f deploy-hook-failed ]; then
            echo "::error::The personal-site deploy hook failed, so the site is still showing the previous build. Check that the hook URL secret is current and that Cloudflare Pages is still connected to the site repository."
            failed=1
          fi
          exit $failed

