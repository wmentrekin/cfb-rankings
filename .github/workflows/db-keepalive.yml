name: Supabase Keepalive

on:
  schedule:
    # Daily at 12:00 UTC. Supabase's own docs say a few requests "each day"
    # over the week is what keeps a free-tier project from being flagged for
    # pausing -- a ping every 3 days left gaps that still triggered the
    # inactivity warning, so this runs daily instead.
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: db-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --frozen --extra pipeline

      - name: Ping Supabase
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          uv run python -m database.keepalive
