          `teams` table is untouched.
        assigned_domain: "reviewer + tester"
        task_profile: "review"
        uncertainty: "high"
        consequence: "high"
        requested_model_tier: "frontier"
        requested_reasoning: "high"
        requested_provider_model: "claude-opus-5"
        escalation_condition: "none -- already frontier"
        owned_scope: []
        forbidden_scope: ["Merging"]
        dependencies: ["T8"]
        parallelizable: false
        expected_validation: ["review_summary and test_summary genuinely populated; findings posted to the PR"]

