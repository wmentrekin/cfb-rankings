ordering_notes:
  - "T1, T2 and T7 are independent and can run in parallel; T3 gates T4, T5 and T6."
  - "T4 is the highest-risk task in the pass and is routed frontier. It must not begin before T3 lands, since it depends on division reaching the payload."
  - "A PIPELINE RUN must land between B1's merge and T15's verification -- rank, division, the two new conferences' statuses and the flex-week cells are all invisible until the artifact is republished."
  - "Within B2, only T15 depends on B1. T10-T14 can be built and verified immediately against the current artifact."
  - "T12 and T14 both touch index.astro heavily and should not run as parallel agents against it."
  - "Each PR ends with its verification task before handoff. Not optional."

risks:
  - risk: "The Sun Belt championship format rests on search snippets, and the tiebreaker page carries a 2018 slug that may be superseded. A wrong format produces confidently wrong Clinched/Eliminated labels for real teams."
    mitigation: "T4 is routed frontier with an explicit instruction to stop and report rather than guess. Its validation requires demonstrating that division standing follows overall conference record via a test where a division-only record would give a different answer. If confidence is not reached, the fallback is to leave the Sun Belt emitting blank cells as today -- strictly better than a wrong assertion."
  - risk: "CFBD may not actually populate logos for FCS teams; this could not be verified without an API key."
    mitigation: "T7's validation requires REPORTING the resolved count rather than assuming success. If CFBD does not populate them, the task reports a no-op and T11's fixed column width still delivers uniform columns via the name fallback."
  - risk: "Adding FCS rows to `teams` would corrupt the rating model in four places. Two of this week's three worst bugs came from exactly this class of change."
    mitigation: "T7's forbidden_scope names the four consumers explicitly, its validation asserts teams still returns exactly 138 for 2026, and its escalation condition is to stop if the approach would require touching any of them."
  - risk: "The rankings column reorder fails silently -- three nth-child rules misalign columns with nothing erroring."
    mitigation: "T12 names the exact rules and line numbers; its validation requires per-column alignment verification rather than a visual glance. T17's reviewer re-checks it independently."
  - risk: "The two 1:1 client mirrors drift, so cells change appearance when the user switches season."
    mitigation: "T12 and T15 name both copies in owned_scope. T17's reviewer re-runs the server-vs-client markup comparison that caught the last drift."
  - risk: "The orchestrator relayed a subagent's incorrect negative finding once already this pass (the standings bug 'not reproducing')."
    mitigation: "Reviewer findings that contradict a user report get re-tested directly against real code before being relayed, as was done here."

open_questions:
  - "Should a 0-0 conference record sort level with a played .500 record, or does the sort need a games-played tertiary term? Deliberately excluded from T1 as a bylaws judgement rather than a defect."
  - "Should a week-1 delta of 0 render as the yellow dash like a genuinely unchanged team? Distinguishing them requires a pipeline change; not currently scoped."
  - "FCS logo storage: separate table (planned, recommended) or ingest all D-I into `teams` with classification guards on four consumers?"

