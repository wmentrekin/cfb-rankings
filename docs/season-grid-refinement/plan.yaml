# Contract: durable execution plan created by $work

artifact: plan
feature: "season-grid-refinement"
mode: "large-initiative"
status: draft
owner_skill: work
based_on: "docs/season-grid-refinement/requirements.yaml"

objective: >
  Deliver 15 items of feedback as two sequential PRs: a cfb-rankings PR fixing the standings
  sort and adding rank, divisions, Pac-12/Sun Belt championship handling, the Pac-12 flex week
  and FCS logos; then a personal-site PR for backgrounds, column widths, scrollbars, the
  rankings reorder and delta glyphs, titles, copy, and a grouped conference filter.

approach:
  summary: >
    Backend first, because five frontend items render artifact fields that do not exist yet
    (rank, division, championship status for two more conferences, flex-week TBD cells, FCS
    opponent logos). A pipeline run must land between the two merges. The frontend PR is then
    split so the eight items that depend on nothing can be verified immediately, and the five
    that depend on the artifact are verified against real regenerated data.
  key_decisions:
    - >
      STANDINGS FIX is a two-character change with a disproportionate blast radius: the -1.0
      sentinel at schedule.py:667 and :670 becomes 0.5. Verified against the user's exact case.
      The open question of whether an unplayed record should also be separated from a played
      .500 record by a games-played term is deliberately NOT bundled in -- it is a bylaws
      judgement, the module already disclaims its sort as an approximation, and conflating a
      verified defect with a judgement call is how a small fix becomes an unreviewable one.
    - >
      PAC-12 is a dict entry, not algorithm work. Verified 8-team round robin, no divisions,
      top 2 by conference record. This is the cheapest item in the pass with the highest
      visible payoff, and it is independent of the Sun Belt work.
    - >
      SUN BELT is the genuinely hard item and is scoped as its own task. Two thirds is
      parameterization (grouping key, top_n 2->1); one third is new logic (conditional_opponent
      must look across divisions, where today it assumes one clinched team per conference).
      Division winners are ranked by OVERALL conference record with divisional record only as a
      tiebreaker -- the finding most likely to have been got wrong by assumption.
    - >
      ARCHITECTURE: schedule.py owns division grouping and calls the standings functions per
      division, rather than schedule_standings.py growing DB awareness. This preserves that
      module's documented no-I/O, schedule_grid-only boundary. Division reaches the artifact as
      a per-team field, which is purely additive.
    - >
      RANK uses a new season-scoped latest-week helper so publish_schedule_artifact keeps its
      documented no-week-argument contract and stays runnable standalone for backfills.
      compute_rank_and_delta is reused with previous_df=None rather than reimplementing ranking.
    - >
      FCS LOGOS go in a separate table, leaving `teams` as exactly the FBS universe. The
      alternative -- ingesting all D-I into `teams` and guarding four consumers with
      classification='fbs' -- puts a filter-or-corrupt condition on the model's core input in
      four places. Two of this week's three worst bugs came from exactly that class of change.
      This is a recommendation carried to the checkpoint, not a decision already taken.
    - >
      CONFERENCE FILTER matches on the artifact's emitted display strings (BIG 12, BIG 10,
      CUSA, MWC, PAC 12, SBC, FBS Independent) while showing the user's preferred labels.
      Matching English names would silently fail for 7 of 11 conferences.
    - >
      WEEK-COLUMN WIDTH depends on FCS logos landing first: the current variance is driven by
      name fallbacks for logo-less opponents. A fixed width is set regardless, so the layout is
      correct even where a logo is still missing.

contracts:
  interfaces:
    - "Artifact gains two additive per-team fields: `rank` (int or null) and `division` (str or null). Existing fields and array shapes unchanged."
    - "Championship status values are unchanged; the Pac-12 and Sun Belt simply begin emitting them where they previously emitted nothing."
    - "Pac-12 flex-week cells emit the existing `tbd` status rather than a new one."
    - "Frontend (status, slot_id) display map gains 'In the Hunt' in place of 'Still in the Hunt'."
  schemas:
    - "New table for non-FBS logos, keyed (season, school), written by a new ingest. `teams` is unchanged."
  config_changes:
    - "QUALIFYING_CHAMPIONSHIP_CONFERENCES gains a Pac-12 entry; a new divisional-conference structure covers the Sun Belt."
    - "A season/conference-scoped flex-week rule, self-clearing once real games appear, carrying a re-verify-each-offseason note."

branching:
  strategy: "branch-per-repo, same name in each"
  branch_name: "work/season-grid-refinement"
  worktrees: []

execution_batches:
  - id: "B1"
    goal: "cfb-rankings: standings correctness, rank, divisions, championship coverage, FCS logos"
    tasks:
      - id: "T1"
        repo: "wmentrekin/cfb-rankings"
        title: "Fix the empty-record sentinel in the conference sort"
        objective: >
          Change the -1.0 sentinel at artifacts/schedule.py:667 and :670 to 0.5 so an unplayed
          record ranks between a win and a loss. Add a regression test using the user's exact
          reported case (NC State 0-1/conf 0-1 vs Duke 1-0/conf 0-0). Do NOT add a games-played
          term -- that is a separate open question.
        assigned_domain: "data-engineer"
        task_profile: "implementation"
        uncertainty: "low"
        consequence: "medium"
        scope_size: "narrow"
        determinism: "deterministic"
        requested_model_tier: "fast"
        requested_reasoning: "medium"
        requested_provider_model: "claude-haiku-4-5-20251001"
        escalation_condition: "Escalate to balanced if the sort's head-to-head tiebreak interacts with the change in a way the test cannot express."
        owned_scope: ["artifacts/schedule.py (_sort_conference_teams only)", "tests/"]
        forbidden_scope: ["artifacts/schedule_standings.py", "the sort's head-to-head logic"]
        dependencies: []
        parallelizable: true
        expected_validation:
          - "The user's exact case sorts Duke above NC State"
          - "A full conference of real 2026 data still sorts sensibly -- no team with a winning conference record falls below one with a losing record"
      - id: "T2"
        repo: "wmentrekin/cfb-rankings"
        title: "Add the Pac-12 to the qualifying championship conferences"
        objective: >
          Add a Pac-12 entry to QUALIFYING_CHAMPIONSHIP_CONFERENCES with a value documenting the
          verified 2026 format (8-team round robin, no divisions, top 2 by conference record) and
          the date verified. No algorithm change. Record in the comment that this was verified
          from search snippets rather than a direct read of pac-12.com, per the egress limitation.
        assigned_domain: "data-engineer"
        task_profile: "implementation"
        uncertainty: "low"
        consequence: "medium"
        scope_size: "narrow"
        determinism: "deterministic"
        requested_model_tier: "fast"
        requested_reasoning: "low"
        requested_provider_model: "claude-haiku-4-5-20251001"
        escalation_condition: "Escalate if MIN_QUALIFYING_MEMBERS or any other gate excludes an 8-team conference."
        owned_scope: ["artifacts/schedule_standings.py (the dict and its comment block)"]
        forbidden_scope: ["the clinch/eliminate algorithm itself"]
        dependencies: []
        parallelizable: true
        expected_validation:
          - "All 8 Pac-12 teams emit a championship status instead of null, against real 2026 data"
          - "No other conference's statuses change"
      - id: "T3"
        repo: "wmentrekin/cfb-rankings"
        title: "Carry division through to the artifact and group Sun Belt teams by it"
        objective: >
          Add `division` to _fetch_teams_meta's query and to teams_meta; emit a per-team
          `division` field (null for every non-divisional conference); sort teams within division
          rather than across the whole conference when a conference has divisions. Keep the
          conferences[] array shape unchanged -- division is additive, not a nesting level.
        assigned_domain: "data-engineer"
        task_profile: "implementation"
        uncertainty: "medium"
        consequence: "medium"
        scope_size: "bounded"
        determinism: "interpretive"
        requested_model_tier: "balanced"
        requested_reasoning: "medium"
        requested_provider_model: "claude-sonnet-5"
        escalation_condition: "Escalate to frontier if grouping by division forces a change to the conferences[] array shape."
        owned_scope: ["artifacts/schedule.py (_fetch_teams_meta, build_schedule_payload, _sort_conference_teams call sites)"]
        forbidden_scope: ["artifacts/schedule_standings.py's no-I/O boundary"]
        dependencies: ["T1"]
        parallelizable: false
        expected_validation:
          - "Sun Belt emits East for 7 teams and West for 7; every other conference emits null"
          - "Teams sort within their division; non-divisional conferences sort exactly as before"
      - id: "T4"
        repo: "wmentrekin/cfb-rankings"
        title: "Division-aware conference championship status for the Sun Belt"
        objective: >
          Extend the clinch/eliminate computation to divisional conferences. Parameterize the
          grouping key and top_n (2 for undivided, 1 per division). Write NEW logic for
          conditional_opponent: a team in one division needs the clinched team from the OTHER
          division, where today the code assumes at most one clinched team per conference and
          blanks the field otherwise. CRITICAL: division winners rank by winning percentage
          across ALL conference games, divisional and non-divisional -- NOT by a division-only
          record. Division record is a tiebreaker only. schedule.py does the division grouping
          and calls the standings functions per division; schedule_standings.py keeps its
          documented no-I/O, schedule_grid-only boundary.
        assigned_domain: "data-engineer"
        task_profile: "implementation"
        uncertainty: "high"
        consequence: "high"
        scope_size: "cross_cutting"
        determinism: "interpretive"
        requested_model_tier: "frontier"
        requested_reasoning: "high"
        requested_provider_model: "claude-opus-5"
        escalation_condition: "Already frontier. If the division format itself proves wrong, STOP and report rather than guessing -- a wrong format produces confidently wrong Clinched/Eliminated labels."
        owned_scope: ["artifacts/schedule_standings.py", "artifacts/schedule.py (division grouping call sites)", "tests/"]
        forbidden_scope: ["identify_conference_championship_games -- it works off week-bucket shape and needs no division awareness"]
        dependencies: ["T3"]
        parallelizable: false
        expected_validation:
          - "Sun Belt teams emit a status; East and West are computed independently"
          - "The conservative property holds: no team is asserted clinched or eliminated when the outcome is not yet determined"
          - "Every other conference's statuses are byte-identical to before the change"
          - "A team's division standing is driven by overall conference record, demonstrated by a test where division-only record would give a different answer"
      - id: "T4b"
        repo: "wmentrekin/cfb-rankings"
        title: "Divert real championship games for every conference that has one"
        objective: >
          identify_conference_championship_games gates on QUALIFYING_CHAMPIONSHIP_CONFERENCES,
          which exists to gate the flat-pool CLINCH math -- a different question from which
          conferences HAVE a title game. T4 gave the Sun Belt statuses but left its real title
          game undiverted, so from December it would show a computed status in the championship
          column AND its actual game in a week column, plus the near-empty week column that
          creates. Default the gate to the UNION of the flat-format and divisional-format lists.
          Deliberately narrower than the "every conference in the data" widening tried and
          reverted in the previous pass, which admitted FCS conferences and widened the
          make-up-game false-positive surface. Do NOT add a neutral_site discriminator: the Sun
          Belt, Mountain West and Conference USA host title games at campus sites, so it would
          break the conferences this fixes.
        assigned_domain: "data-engineer"
        task_profile: "implementation"
        uncertainty: "low"
        consequence: "medium"
        scope_size: "narrow"
        determinism: "deterministic"
        requested_model_tier: "balanced"
        requested_reasoning: "medium"
        requested_provider_model: "claude-sonnet-5"
        escalation_condition: "Escalate if the union cannot be built without hardcoding a third list that would drift from the two sources."
        owned_scope: ["artifacts/schedule.py", "artifacts/schedule_standings.py (union helper only)", "tests/"]
        forbidden_scope: ["the clinch/eliminate math", "_sort_conference_teams", "the identification rule itself"]
        dependencies: ["T4"]
        parallelizable: false
        expected_validation:
          - "Sun Belt and Pac-12 title games are identified where they previously were not"
          - "A conference in neither list is still not identified"
          - "2026 still identifies nothing for every conference -- the in-progress property must not regress"
          - "A diverted Sun Belt title game leaves no near-empty week column behind"
        provenance: >
          Added mid-execution, not present at the checkpoint. Surfaced by T4's own report as a
          consequence of making the Sun Belt non-blank. The user chose this narrow form over
          deferring it or redoing the full widening.

      - id: "T5"
        repo: "wmentrekin/cfb-rankings"
        title: "Add each team's current rank to the artifact"
        objective: >
          New season-scoped helper fetching the latest week's ratings for the season, reusing
          compute_rank_and_delta with previous_df=None to derive rank. Emit a per-team `rank`
          field. publish_schedule_artifact keeps its no-week-argument contract. A season with no
          ratings rows emits rank null for every team rather than failing.
        assigned_domain: "data-engineer"
        task_profile: "implementation"
        uncertainty: "low"
        consequence: "medium"
        scope_size: "bounded"
        determinism: "deterministic"
        requested_model_tier: "balanced"
        requested_reasoning: "medium"
        requested_provider_model: "claude-sonnet-5"
        escalation_condition: "Escalate if the latest-week query cannot be made season-scoped without threading week through from main.py."
        owned_scope: ["artifacts/schedule.py (new fetch helper, build_schedule_payload signature, publish_schedule_artifact)"]
        forbidden_scope: ["publish_schedule_artifact's signature -- it must not gain a week argument", "artifacts/rankings.py"]
        dependencies: ["T3"]
        parallelizable: false
        expected_validation:
          - "Against real 2026 data every FBS team carries a rank 1..138 with no duplicates or gaps"
          - "A season with no ratings emits rank null throughout and does not raise"
      - id: "T6"
        repo: "wmentrekin/cfb-rankings"
        title: "Pac-12 flex-week TBD cells"
        objective: >
          Add a season/conference-scoped flex-week rule so Pac-12 teams emit the existing `tbd`
          status for week 13 instead of a bye. Must self-clear once real games appear in that
          bucket. Document it as configuration requiring re-verification each offseason, next to
          the qualifying-conferences list which carries the same warning.
        assigned_domain: "data-engineer"
        task_profile: "implementation"
        uncertainty: "medium"
        consequence: "low"
        scope_size: "narrow"
        determinism: "interpretive"
        requested_model_tier: "balanced"
        requested_reasoning: "medium"
        requested_provider_model: "claude-sonnet-5"
        escalation_condition: "Escalate if distinguishing a flex week from a bye cannot be done without hardcoding a team list."
        owned_scope: ["artifacts/schedule.py (cell assembly and a new config constant)"]
        forbidden_scope: ["the status enum -- reuse tbd, do not add a value"]
        dependencies: ["T3"]
        parallelizable: true
        expected_validation:
          - "All 8 Pac-12 teams show tbd in week 13 against real 2026 data"
          - "No other conference gains a tbd cell"
          - "Simulating an announced flex game in that bucket replaces the tbd cell with a real one"
      - id: "T7"
        repo: "wmentrekin/cfb-rankings"
        title: "Source FCS opponent logos without touching the FBS universe"
        objective: >
          Ingest logos for non-FBS D-I teams from CFBD's GET /teams (which takes year but has no
