          it actually resolved.
        assigned_domain: "data-engineer"
        task_profile: "implementation"
        uncertainty: "high"
        consequence: "high"
        scope_size: "cross_cutting"
        determinism: "interpretive"
        requested_model_tier: "frontier"
        requested_reasoning: "high"
        requested_provider_model: "claude-opus-5"
        escalation_condition: "If the chosen storage approach would require changing any of the four `teams` consumers, STOP and escalate -- that is the corruption risk this task exists to avoid."
        owned_scope: ["database/ (new ingest + migration)", "artifacts/schedule.py (opponent logo lookup)"]
        forbidden_scope:
