        requested_model_tier: "fast"
        requested_reasoning: "medium"
        requested_provider_model: "claude-haiku-4-5-20251001"
        escalation_condition: "none"
        owned_scope: []
        forbidden_scope: []
        dependencies: ["T1", "T2", "T3", "T4", "T5", "T6", "T7"]
        parallelizable: false
        expected_validation: ["PR opened; each change traced to its feedback item"]
      - id: "T9"
