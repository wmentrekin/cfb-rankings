# Contract: durable task-definition handoff created by $work

artifact: requirements
feature: "season-grid-refinement"
mode: "large-initiative"
status: draft
owner_skill: work

summary:
  problem: >
    The Season Grid and Rankings views work and are close to their goal, but 15 items of
    live-use feedback remain. Most are presentation -- translucent cells letting the page's
    grid background bleed through, week columns of uneven width, a rank delta rendered as
    bare text, a rankings column order that gives Conference more visual weight than Rating
    or Delta, no scrollbar treatment so the horizontal bar covers the last team row, and
    copy/title wording. Three are correctness or capability gaps in the artifact: a standings
    sort that ranks an unplayed conference record below a conference loss, no current ranking
    shown per team, and no championship language at all for the two conferences whose formats
    the algorithm does not model.
  motivation: >
    The stated goal for the Season Grid is a single view that combines conference standings,
    up-to-date game results, current rankings, and the full future schedule for every FBS team.
    Two of those four -- standings correctness and current rankings -- are not yet true. The
    presentation items matter because the grid is meant to be read at a glance across a whole
    conference, and uneven columns plus background bleed-through work directly against that.
  requested_outcome: >
    Two sequential PRs -- backend artifact/algorithm first, then frontend -- so the frontend
    renders against corrected real data rather than a stale artifact, each independently
    reviewed before handoff.

goals:
  - "Fix the standings sort so an unplayed conference record ranks between a conference win and a conference loss (1-0 > 0-0 > 0-1)"
  - "Give every FBS team a current ranking in the Season Grid, so the view answers rankings as well as standings, results and schedule"
  - "Give the Pac-12 and Sun Belt real conference-championship language instead of blank cells"
  - "Group Sun Belt teams under their East and West divisions, since its championship matchup is decided by division"
  - "Show FCS opponents as logos rather than names, which is also what makes uniform week-column widths achievable"
  - "Make cells read clearly against the page's grid background, with uniform week columns and a scrollbar that does not obscure content"
  - "Rebalance the Rankings table around Rank, Team, Record, Rating and Delta, with Conference as auxiliary information"
  - "Render the rank delta as direction plus magnitude rather than a bare signed number"
  - "Add a grouped conference filter to the Season Grid"

non_goals:
  - "Backfilling or regenerating the 2025 Season Grid artifact -- still deferred to its own pass; schedule/2025/latest.json in R2 remains unverified and is excluded from the frontend selector"
  - "Reworking the rating model itself -- no change to how ratings are computed"
  - "Real conference tiebreaker bylaws -- the within-conference sort remains a documented approximation"
  - "Mobile-specific layout for the Rankings table -- it still has no responsive breakpoints; out of scope here"
  - "Resolving why pushes to personal-site main do not trigger Cloudflare production builds -- tracked separately, needs dashboard access"

constraints:
  technical:
    - >
      VERIFIED: the standings defect is a -1.0 sentinel, not a .000 win percentage.
      artifacts/schedule.py:667,670 assign -1.0 when a record has zero games, which is worse
      than any real percentage including a loss. Reproduced against the real code with the
      user's exact case: NC State (overall 0-1, conf 0-1) sorts above Duke (overall 1-0, conf
      0-0). Changing the sentinel to 0.5 produces the requested order.
    - >
      The clinch/eliminate algorithm hardcodes "top 2 of one flat pool" in three places
      (schedule_standings.py: grouping at L292-296, ELIMINATED's sorted()[1] at L317-324,
      CLINCHED's <=1 threshold at L326-327). Grouping and thresholds are parameterizable;
      conditional_opponent is NOT -- it assumes at most one clinched team per conference,
      whereas with divisions one clinched team per division is the normal case, and a team in
      one division needs the clinched team from the OTHER division. That is new logic.
    - >
      ARCHITECTURE DECISION REQUIRED: schedule_standings.py documents a hard boundary that it
      does no DB I/O and consumes only schedule_grid rows. Division exists only in the `teams`
      table (schedule_grid has no division column), which only schedule.py queries. Either
      schedule_standings accepts division as an injected input, or schedule.py groups by
      division and calls the standings functions once per division.
    - >
      Rank: `ratings` has no rank column (team, rating, wins, losses, ties, season, week).
      rankings.py's compute_rank_and_delta(current_df, previous_df=None) already derives rank by
      sorting rating desc and is reusable as-is. publish_schedule_artifact(year) deliberately
      takes NO week argument (season-scoped key layout); a season-scoped "latest week" helper
      preserves that contract, whereas threading week through from main.py would break it.
      main.py inserts ratings (L274) before publishing the schedule artifact (L294), so a
      same-season rank query sees the current run's data.
    - >
      The rank delta's sign convention is positive = rise (rankings.py:88-90,
      delta = previous_rank - current_rank). Delta is NEVER null: a team with no previous week
      emits 0, indistinguishable from a genuinely unchanged team. In week 1 every team emits 0.
    - >
      Three nth-child rules in RankingsTable.astro:76-88 are column-order dependent (center 1/4/6,
      right-align 5). Moving Conference to position 6 would silently misalign Rating, Delta and
      Conference unless all three are updated. table { min-width: 31rem } at L65 is the only
      width constraint; narrowing requires lowering it.
    - >
      RankingsTable.astro and ScheduleGrid.astro each have a 1:1 client-side mirror in
      index.astro's inline script, required because client-rebuilt nodes never carry Astro's
      scoped data-astro-cid-* attribute. Every rendering change must be made in both copies.
      For the rankings work the pairs are: formatDelta (L83-85 / L676-679), the row-array
      literal (L169-176 / L704-711), and cell-DOM building (RankingsTable.astro:24-43 /
      index.astro:712-737).
    - >
      Cell backgrounds: .sg-team-col is rgba(16, 23, 32, 0.98) -- the canonical match target.
      .sg-cell--win / --loss are translucent tints (rgba(21,128,61,0.18) / rgba(153,27,27,0.18))
      currently compositing over the page's grid pattern; raising alpha to 1 would change how
      they read. They must be composited onto the solid base to preserve current intensity.
      The sticky z-index tiers (team-col 1, th 2, corner 4) must not be disturbed.
    - >
      No scrollbar CSS exists anywhere in personal-site. Both .schedule-grid-shell and
      .rankings-shell need styling plus bottom spacing from scratch.
    - >
      .hero-text { max-width: 34rem } at index.astro:333 is what makes the description wrap
      about halfway across the card.
    - >
      `teams` IS the model's FBS universe, read by four consumers (model/process_data.py:143,
      database/get_games.py:135, artifacts/schedule.py:796, main.py:31). FCS rows must not
      enter it unguarded, or the model would rate FCS teams and treat FBS-vs-FCS games as
      FBS-vs-FBS.
    - >
      CFBD's GET /teams (no /fbs) accepts year but exposes NO classification query parameter --
      filtering is client-side on each record's classification field. It returns all D-I,
      roughly 265 teams for 2026 (138 FBS + 127 FCS).
  product:
    - "Season Grid title stays 'Season Grid'; the Rankings title becomes just 'Rankings'."
    - "'Still in the Hunt' becomes 'In the Hunt'."
    - "Delta: green upward triangle plus magnitude for a rise, red downward triangle plus magnitude for a fall, yellow dash for no change."
    - "Rankings column order: Rank, Team, Record, Rating, Delta, Conference."
    - "Season Grid conference filter groups: All; Power 4 (ACC, Big 12, Big 10, SEC); Independents; Group of 6 (American, Conference USA, MAC, Mountain West, Pac-12, Sun Belt). Group headings are non-selectable. Default is All."
    - "Week columns all share one width, sized to the longest possible content: 'vs {logo} W 99-99'."
    - "Team rank appears on the team-name line, right-aligned within the team cell."
    - "Pac-12 week 13 shows 'vs TBD' until the flex games are announced."
  process:
    - "Never commit to main in either repo; all changes via the feature branch and a PR."
    - "Every PR gets an independent reviewer pass before handoff, with findings posted to the PR."
    - "Commits authored as wmentrekin <wmentrekin@gmail.com>, retaining the Co-Authored-By trailer."
    - "Delete docs/season-grid-refinement/ before merge; also remove the stale docs/season-grid-touchups/ that landed in cfb-rankings main last pass."

assumptions:
  - >
    The conference filter matches on the artifact's emitted display strings (BIG 12, BIG 10,
    CUSA, MWC, PAC 12, SBC, FBS Independent) while showing the user's preferred labels in the
    dropdown. Matching on the English names would silently fail to bucket 7 of 11 conferences.
  - >
    A week-1 team's delta of 0 renders as the yellow dash, same as a genuinely unchanged team.
    Distinguishing "new" from "stable" would need a pipeline change; flagged, not assumed.
  - >
    Division is emitted as a per-team field (division: "East" | "West" | null) rather than a
    nesting level under conferences[]. Purely additive -- non-divisional conferences emit null
    and the existing array shape is unchanged, so a frontend ignoring the field still works.
  - >
    The Pac-12 flex-week rule is season- and conference-scoped configuration, self-clearing once
    real games appear in that bucket, and carrying the same re-verify-each-offseason discipline
    as QUALIFYING_CHAMPIONSHIP_CONFERENCES.

