research:
  repo_findings:
    - >
      RESOLVED (repo-researcher-standings, then re-verified directly by the orchestrator): the
      user's reported case reproduces exactly. The researcher initially reported it did NOT
      reproduce, but its synthetic test modelled 1-0/0-0/0-1 as CONFERENCE records, whereas the
      reported case is a 1-0 OVERALL record with an 0-0 conference record. Run against the real
      _sort_conference_teams, NC State (0-1, conf 0-1) sorts above Duke (1-0, conf 0-0);
      with the sentinel changed to 0.5, Duke sorts first. Recorded because a researcher's
      negative finding was wrong and was caught only by re-testing it.
    - >
      Division support decomposes into: grouping key (parameterizable, but compute_team_records
      carries no division so it must be injected), top_n 2->1 (clean parameterization), and
      conditional_opponent cross-division lookup (genuinely new logic).
    - >
      compute_rank_and_delta is reusable for the grid's rank with previous_df=None. A
      season-scoped latest-week helper preserves publish_schedule_artifact's no-week-argument
      contract.
    - >
      CONFERENCE_DISPLAY_NAMES emits abbreviated strings; 7 of the 11 conferences do not match
      the English names in the requested filter groups.
    - >
      RankingsTable.astro has zero media queries, confirming the roadmap's claim.
  platform_findings:
    - >
      Pac-12 2026: 8 teams, 7-game round robin, no divisions, top 2 by conference record,
      championship game Dec 4 2026 at the top seed's stadium. Exactly the shape the existing
      algorithm models -- a dict entry, no algorithm change. Its own announcement also confirms
      the round robin ends Week 12 and Week 13 games are flex games that do not count toward
      standings, independently corroborating the user's report and the database's empty bucket 13.
    - >
      Sun Belt 2026: retains East/West, reportedly the only FBS conference still divisional.
      Championship game is East champion vs West champion. CRITICAL: division champions are
      decided by winning percentage across ALL conference games, divisional and non-divisional --
      NOT by a division-only record. Divisional record enters only as a tiebreaker.
    - >
      CFBD: GET /teams exists separately from /teams/fbs, takes year, exposes no classification
      parameter, and the Team model carries both classification and logos. Returns all D-I.
  caveats:
    - >
      Egress policy blocked direct fetches of pac-12.com, sunbeltsports.org, Wikipedia, ESPN and
      the CFBD API. The Pac-12 and Sun Belt findings rest on search snippets quoting those
      sources. Format claims are corroborated across independent results; the fine-grained
      tiebreaker ordering is less so, and the Sun Belt tiebreaker page carries a 2018 slug that
      may have been superseded.
    - >
      It could NOT be confirmed that FCS records carry populated logos arrays -- no CFBD API key
      exists in this sandbox. The FCS logo work must be written defensively and verified on its
      first real run rather than assumed to work.

acceptance_criteria:
  - "In a conference table, a team with a 1-0 overall / 0-0 conference record sorts above a team with 0-1 / 0-1"
  - "Every FBS team's current rank appears in its Season Grid team cell, right-aligned on the team-name line"
  - "Pac-12 and Sun Belt teams show championship language rather than blank cells, and Sun Belt division winners are computed from overall conference record, not division-only record"
  - "Sun Belt teams appear grouped under East and West sub-headings; every other conference renders exactly as it does today"
  - "Pac-12 teams show 'vs TBD' in week 13, and that resolves to real cells once flex games are announced"
  - "FCS opponents render as logos; the `teams` table still contains exactly the FBS universe and the model's inputs are unchanged"
  - "Every week column is the same width, sized to 'vs {logo} W 99-99'"
  - "Season Grid and Rankings cells sit on a solid background matching the sticky team column, with win/loss tints preserving their current intensity"
  - "Both scroll shells have a dark translucent scrollbar and bottom spacing so the horizontal bar never covers the last row"
  - "Rankings columns read Rank, Team, Record, Rating, Delta, Conference, correctly aligned, with the table narrower than today"
  - "A rising team shows a green up-triangle with magnitude, a falling team a red down-triangle, an unchanged team a yellow dash"
  - "The Rankings title reads 'Rankings'; the championship status reads 'In the Hunt'"
  - "The hero description uses the full width of the title card and mentions the Season Grid"
  - "The Season Grid conference filter offers All / Power 4 / Independents / Group of 6 with non-selectable group headings, defaults to All, and correctly filters all 11 conferences"

open_questions:
  - "Should a 0-0 conference record sort level with a played .500 record, or does the sort need a games-played tertiary term to separate them? The module already documents this sort as an approximation rather than real bylaws."
  - "Should a week-1 delta of 0 render as the yellow dash like a genuinely unchanged team, or should 'no previous data' be visually distinct? Distinguishing them requires a pipeline change."
  - "Does schedule_standings.py accept division as an injected input (breaking its documented no-I/O, schedule_grid-only boundary), or does schedule.py group by division and call it per division?"
  - "FCS logo storage: a separate table leaving `teams` untouched, or ingest all D-I into `teams` and guard all four consumers with classification='fbs'?"

ready_for_planning: true
planning_blockers: []
