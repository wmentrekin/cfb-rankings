review_summary:
  status: complete
  reviewer: "delegated subagent, frontier tier, independent of implementation"
  posted_to_pr: true
  key_findings:
    - severity: should-fix
      finding: >
        teams.division NULL becomes float('nan') under pandas 3.x (2.x gives None). nan
        breaks both `is None` and `==`, so the division grouping matched nothing and EVERY
        non-divisional conference published with an empty teams list -- no exception, no log.
        uv.lock pins 2.3.3 so production was never exposed; latent until a pandas upgrade.
        All 50 tests passed because every one built teams_meta from synthetic dicts with real
        None, never touching the DataFrame path.
      resolution: "FIXED. Normalised at the _fetch_teams_meta boundary, as _resolve_logo already does for logos. Reproduced (ACC teams=0) before and after."
    - severity: should-fix
      finding: >
        The 0.5 sentinel silently disabled the head-to-head tiebreak: an unplayed record ties
        at .500 with every 1-1/2-2/3-3 team, and the tiebreak only fires on a group of exactly
        two, so one 0-0 team joining two tied teams cancelled their swap and displayed the
        head-to-head loser above the winner.
      resolution: >
        FIXED. Unplayed teams are excluded from both the sort tie and the group scan. Fixing
        only the sort key was insufficient -- the scan walked on percentage alone and had to
        be fixed too, which the first attempt missed and re-testing caught.
    - severity: should-fix
      finding: "The overall-record sentinel had zero coverage -- reverting 0.5 to -1.0 left all 50 tests green while changing output. One of ten mutations escaped."
      resolution: "FIXED. New test pins it via Independents, who sort purely on overall percentage. The test is itself mutation-checked."
    - severity: should-fix
      finding: "A docstring claimed division is populated only for the Sun Belt. False for 2014-2023, where eight conferences carry divisions."
      resolution: "FIXED in both places that repeated the claim."
    - severity: nit
      finding: "A null classification passes the != 'fbs' filter in the non-FBS ingest."
      resolution: "ACCEPTED, not fixed. The logo lookup reads `teams` first and only falls back, so a stray row cannot shadow a real FBS logo."
    - severity: nit
      finding: "Win counts stand in for win percentage; the 2026 ACC and Mountain West have uneven conference game counts."
      resolution: "ACCEPTED. Pre-existing and already documented as a condition to re-check."
  verified_by_reviewer_not_relayed:
    - "top_n=1 conservatism sound -- brute-forced 4000 four-team pools with full outcome enumeration: 0 false eliminations, 0 false clinches"
    - "Two teams provably cannot both clinch a top_n=1 pool, so every cross-division conditional_opponent case resolves"
    - "The division race genuinely ranks by overall conference record; mutating it is caught"
    - "The 2025 Pac-12 fabrication is real and the member gate fixes it, suppressing nothing legitimate"
    - "Flex week is not masking a real bye -- all 8 Pac-12 teams need a 12th game"
    - "`teams` untouched; the four consumers unaffected"

