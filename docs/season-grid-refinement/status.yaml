research_caveats:
  - >
    This session's egress policy blocked direct fetches of pac-12.com, sunbeltsports.org,
    Wikipedia, ESPN and the CFBD API. The Pac-12 and Sun Belt format findings rest on search
    snippets quoting those primary sources rather than direct reads. Format claims are
    corroborated across several independent results; the fine-grained tiebreaker ordering is
    less so, and the Sun Belt tiebreaker page carries a 2018 slug that may have been superseded
    by recent realignment. Recorded rather than presented as fully verified.
  - >
    CFBD's Team model declares both `classification` and `logos`, and unfiltered GET /teams
    returns all D-I (~265 teams for 2026: 138 FBS + 127 FCS). But `/teams` exposes NO
    classification query parameter, so filtering is client-side, and it could NOT be confirmed
    that FCS records actually carry populated logos arrays -- no CFBD API key exists in this
    sandbox. Any FCS-logo task must therefore be written defensively and verified on its first
    real run, not assumed to work.

decisions:
  - question: "Can the Pac-12 simply be added to QUALIFYING_CHAMPIONSHIP_CONFERENCES?"
    answer: >
      YES. Verified: the 2026 Pac-12 is an 8-team round robin with no divisions, top 2 by
      conference record, championship game Dec 4 2026 at the top seed's stadium. That is exactly
      the shape the existing clinch/eliminate algorithm models -- a dict entry, no algorithm
      change. The game buckets to week 14, so it lands in the championship column.
  - question: "How are Sun Belt division winners determined?"
    answer: >
      By highest winning percentage across ALL conference games, divisional AND non-divisional --
      NOT by a division-only record. Division record enters only as a tiebreaker (head-to-head
      first, then divisional pct, then cascading vs next-highest, then common non-divisional
      opponents). This contradicts the natural assumption and is the single most important
      finding of discovery: assuming division-only record would produce wrong Clinched/Eliminated
      labels for the one conference this work exists to support.
  - question: "Pre-execution checkpoint"
    answer: "User answered proceed. Execution began with B1 wave 1."
  - question: "T7 model tier"
    answer: >
      DOWNGRADED frontier -> balanced, recorded rather than silent. The plan routed the FCS
      logo work frontier because choosing the wrong storage approach corrupts the model's team
      universe. That risk lived in the design decision, which is now made (separate table,
      `teams` untouched) and enforced by scope. Splitting it into T7a (ingest + migration,
      database/ only) and T7b (the schedule.py lookup) makes each half bounded and
      deterministic. The routing policy explicitly permits downgrading after decomposition
      narrows a task.
  - question: "Does the reported standings symptom reproduce?"
    answer: >
      YES, verified directly against _sort_conference_teams. repo-researcher-standings reported
      it did NOT reproduce, but its synthetic test modelled 1-0/0-0/0-1 as CONFERENCE records
      while the reported case is a 1-0 OVERALL record with an 0-0 conference record. Re-tested
      with the user's exact inputs: NC State (0-1, conf 0-1) sorts above Duke (1-0, conf 0-0).
      Recorded because a subagent's negative finding was wrong and was caught only by re-testing
      rather than relaying it.
  - question: "Mode classification"
    answer: "large-initiative -- 15 items, two repos, multiple task batches, and genuinely new algorithmic work (division-winner championship modelling), well past bounded-feature."
  - question: "One integration PR or one per repo?"
    answer: "One per repo, backend first. Continues the previous pass's structure: the frontend renders whatever the artifact says, so artifact-dependent items are unverifiable until the backend merges and a pipeline run republishes."

