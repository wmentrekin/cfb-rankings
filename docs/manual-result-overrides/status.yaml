decisions:
  - id: "D4"
    decision: >-
      No overridden-game marker in the artifacts or on the site for now (user decision at the
      checkpoint). The reason lives in the checked-in override file and the README.
  - id: "D3"
    decision: >-
      Score confirmed by the user: Western Michigan 12, Michigan 7. Michigan is the home team,
      so home_score=7, away_score=12, margin=5, winner='Western Michigan', alpha=1.2.
  - id: "D2"
    decision: >-
      A failed override no longer halts the run (reversed after review). It is recorded, the run
      completes, and weekly-update.yml fails the job on an OVERRIDE_FAILURE marker in output.log,
      because `main.py ... || true` means a nonzero exit alone is invisible.
  - id: "D1"
    decision: >-
      Continue the branch convention already in use and merged across this project
      (work/<feature-slug>) rather than the harness-suggested claude/* branch, so the PR
      history stays consistent with PRs #11, #12, #21, #22.

