objective: >-
  Add a durable manual game-result override mechanism to the cfb-rankings pipeline so an
  operator-declared result replaces the CollegeFootballData-ingested one and survives every
  future ingest run. First use: 2025 week 1 Michigan vs Western Michigan recorded as a
  Western Michigan win, 12-7. Then re-run the pipeline and rebuild personal-site so the
  corrected result reaches the published rankings and season grid.

