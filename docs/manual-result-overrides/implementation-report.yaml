open_issues:
  - id: "O1"
    issue: >-
      The workflow's OVERRIDE_FAILURE check was originally placed before the deploy-hook step,
      so a failed override would have blocked the site rebuild -- a partial publishing halt,
      contrary to K5. Moved to be the final step. This was an error in my T3 wording ("after the
      log upload"), not in the implementation.
    status: fixed
  - id: "O2"
    issue: >-
      main.py's outer except logged without the OVERRIDE_FAILURE token, so an unexpected
      exception in the override step would have left the job green -- the exact blind spot the
      check exists to close. Token added to that message.
    status: fixed

