# Contract: durable execution plan created by $work when the selected mode needs explicit planning

artifact: plan
feature: "manual-result-overrides"
mode: "bounded-feature"
status: draft
owner_skill: work
based_on: "docs/manual-result-overrides/requirements.yaml"

objective: >-
  Add a version-controlled game-result override mechanism that re-applies itself on every pipeline
  run, seed it with 2026 week 1 Michigan vs Western Michigan as Western Michigan 12 - Michigan 7,
  then re-run production and rebuild the site.

approach:
  summary: >-
    Overrides live in a checked-in JSON file, not in the database, so they are reviewable in the
    PR and cannot be lost to a database restore. A new module reads that file, and main.py calls
    it after both ingest calls and before the model runs. Because it runs after ingest on every
    invocation, a re-ingest cannot win: the last writer before the model reads is always the
    override. The score-derived fields are extracted out of the ingest transform into a shared
    pure-function helper that both the ingest path and the override path call, so the two can
    never drift apart.
  key_decisions:
    - id: "K1"
      decision: "Overrides are a checked-in JSON file, not a database table."
      rationale: >-
        The repo is the source of truth for pipeline behavior (AGENTS.md); the database is
        operational. A file is diffable, reviewable in the PR, survives a database restore, and
        needs no migration. A table would be invisible to anyone reading the repo.
    - id: "K2"
      decision: "Key overrides on the CFBD game id, but require matching identity fields."
      rationale: >-
        `id` is the only key `games` actually enforces (games_pkey). But keying on an opaque
        integer alone means a typo silently rewrites an unrelated game, so each entry also
        declares season, week, home_team and away_team and the applier refuses on mismatch.
    - id: "K3"
      decision: "Apply after ingest rather than intercepting the ingest DataFrame."
      rationale: >-
        Intercepting inside get_games_by_year_week only corrects games that happen to be inside
        the current fetch window. Applying afterwards, keyed by season, re-asserts every override
        for the season on every run regardless of what was fetched -- including rows ingested
        before the override existed.
    - id: "K4"
      decision: "Extract winner/margin/alpha derivation into a shared helper used by both paths."
      rationale: >-
        AC4. These are ingest-time Python computations with a non-obvious 0-0 guard and an alpha
        rule that depends on `winner`. Duplicating them in the override path is the single most
        likely way this feature silently produces an inconsistent row.
    - id: "K5"
      decision: >-
        A mismatched, missing or unloadable override is recorded as a failure and the run
        CONTINUES; it never halts the pipeline. main.py logs each failure at ERROR with the
        stable marker token OVERRIDE_FAILURE, and weekly-update.yml gains a step that fails the
        job when that token appears in output.log.
      rationale: >-
        REVISED after plan review. The first draft aborted the run. That was wrong on two counts.
        First, blast radius: apply_game_result_overrides runs for the whole season on every
        weekly invocation, so one override that stops matching would halt get_ratings, the
        ratings insert, and BOTH artifact publishes on every subsequent Sunday -- an
        indefinite season-wide publishing outage caused by one stale row. Second, the abort
        would not even be loud: weekly-update.yml line 103 runs `main.py ... || true`, so the
        job goes green regardless. tests/test_entry_point_resolves.py exists because that exact
        pattern once let a NameError publish nothing while the workflow reported success and
        still fired the deploy hook. Weigh the two failure modes: an unapplied override means
        the site shows the real CFBD result, which is merely the status quo; a halt means no
        rankings at all, silently. Continue-and-alarm dominates. The marker step is what makes
        it actually loud, and is the narrowest possible fix -- it does not touch the `|| true`
        behavior for anything else.
    - id: "K6"
      decision: >-
        Considered and rejected: a `game_overrides` table plus an AFTER INSERT OR UPDATE trigger
        on `games`, shipped as a migration.
      rationale: >-
        Recorded because K1's stated advantages do not actually distinguish the options -- a
        checked-in migration is exactly as diffable and PR-reviewable as a JSON file. The real
        distinction is enforcement: a trigger corrects `games` no matter which code path writes
        it, whereas this design depends on application-level discipline (every future writer must
        run before the override step, or the override reasserts on the next invocation).
        Rejected for now because exactly one automated writer exists -- load_games_to_db, called
        twice from main.py, verified by review -- and a trigger is materially harder to reason
        about, test without a live database, and undo. The accepted residual: a human UPDATE or a
        future one-off script that writes `games` outside a main.py invocation is corrected only
        on the next pipeline run, not immediately.
    - id: "K7"
      decision: "The override path reads `neutral_site` from the stored games row, never from the override entry."
      rationale: >-
        compute_alpha needs neutral_site, but it is not a score and the operator is not declaring
        it. Taking it from the row keeps the override entry to exactly what is being overridden.
        Note this cannot be caught by the seeded entry: 401858428 is not a neutral-site game, so a
        hardcoded False would coincidentally produce the correct alpha=1.2. T4 carries a
        neutral-site fixture specifically to close that hole.

contracts:
  interfaces:
    - "database/game_derivations.py: compute_margin(home_score, away_score) -> int"
    - "database/game_derivations.py: compute_winner(home_team, away_team, home_score, away_score) -> str | None"
    - "database/game_derivations.py: compute_alpha(home_team, winner, neutral_site) -> float"
    - "database/game_overrides.py: load_overrides(path=None) -> list[dict]"
    - "database/game_overrides.py: overrides_for_season(overrides, season) -> list[dict]"
    - >-
      database/game_overrides.py: apply_game_result_overrides(year, engine=None) ->
      {"applied": [game_id, ...], "skipped_other_season": n, "failures": [{game_id, reason}, ...]}
      -- never raises for a per-entry problem; failures are returned, not thrown.
    - >-
      All database access uses parameterized sqlalchemy text() through engine.begin(), following
      scripts/repair_unplayed_game_winners.py:110 -- NOT get_games.py's Table(autoload_with=engine)
      reflection, which needs a live connection to reflect and so cannot be exercised in CI.
  schemas:
    - >-
      database/game_result_overrides.json: {"version": 1, "overrides": [{game_id, season, week,
      season_type, home_team, away_team, home_score, away_score, reason, declared_on}]}.
      neutral_site is deliberately absent -- it is read from the stored row (K7). The five
      identity fields verified before any write are season, week, season_type, home_team and
      away_team; season_type is included because a regular/postseason collision on one numeric id
      is exactly the case K2 exists to prevent.
  config_changes:
    - "None. No new environment variables, secrets, or workflow inputs."

branching:
  strategy: "single-branch"
  branch_name: "work/manual-result-overrides"
  worktrees: []

execution_batches:
  - id: "B1"
    goal: "Implement the override mechanism, seed the first entry, and cover it with tests."
    tasks:
      - id: "T1"
        title: "Extract the score-derivation helpers from the ingest transform"
        objective: >-
          Move the margin, winner and alpha computations out of get_games_by_year_week into
          database/game_derivations.py as pure functions, and have get_games.py call them. Behavior
          must be byte-identical, including the 0-0 'not yet played' guard and the pandas Int64
          dtypes flowing through the DataFrame.
        assigned_domain: "data-engineer"
        model_routing:
          task_profile: "implementation"
          uncertainty: "medium"
          consequence: "high"
          scope_size: "bounded"
          determinism: "interpretive"
          requested_tier: "balanced"
          requested_reasoning: "medium"
          provider_model: "Claude Sonnet 5"
          routing_enforced: true
          escalation_tier: "frontier"
          escalation_condition: "Preserving exact pandas dtype/NA semantics through the extraction is not provably safe."
        owned_scope:
          - "database/game_derivations.py (new)"
          - "database/get_games.py (derivation block only)"
        forbidden_scope:
          - "The CFBD request, the column selection, the rename map, or the upsert."
          - "model/, artifacts/, database/migrations/"
        dependencies: []
        parallelizable: false
        expected_validation:
          - >-
            A parity test asserting the extracted helpers reproduce the ingest DataFrame's
            winner/margin/alpha for a fixture of real 2026 week 1 rows, using
            pandas.testing.assert_series_equal (dtype-checking), NOT .tolist() value equality.
            margin moves from vectorized column arithmetic to the same .apply(axis=1) shape as
            winner and alpha; the existing .astype("Int64") recast at get_games.py:112 stays, and
            the dtype-checked assertion is what proves the move is inert.
          - "The fixture includes a neutral-site row and an unplayed 0-0 row, the two cases the seeded override cannot exercise."
          - "python -m pytest tests/ -q stays green."
      - id: "T2"
        title: "Add the override declaration file and the applier"
        objective: >-
          Create database/game_result_overrides.json with the single Michigan / Western Michigan
          entry, and database/game_overrides.py implementing load/filter/apply per the contracts
          above. apply_game_result_overrides re-derives winner/margin/alpha via T1's helpers,
          verifies all five identity fields (season, week, season_type, home_team, away_team)
          against the stored row, reads neutral_site from that row, and UPDATEs home_score,
          away_score, winner, margin, alpha. It returns the summary dict from the contracts
          section and never raises for a per-entry problem -- a mismatch, an absent row, or an
          unloadable/malformed override file all become entries in `failures`. Overrides for
          other seasons are filtered out before the check, so they are a no-op, not a failure.
          Use parameterized text() SQL via engine.begin(), matching
          scripts/repair_unplayed_game_winners.py.
        assigned_domain: "data-engineer"
        model_routing:
          task_profile: "implementation"
          uncertainty: "medium"
          consequence: "high"
          scope_size: "bounded"
          determinism: "interpretive"
          requested_tier: "balanced"
          requested_reasoning: "medium"
          provider_model: "Claude Sonnet 5"
          routing_enforced: true
          escalation_tier: "frontier"
          escalation_condition: "The safe failure semantics conflict with the pipeline's continue-on-error style in a way the plan does not settle."
        owned_scope:
          - "database/game_overrides.py (new)"
          - "database/game_result_overrides.json (new)"
        forbidden_scope:
          - "Executing anything against the live database."
          - "database/get_games.py beyond importing the shared helpers."
        dependencies: ["T1"]
        parallelizable: false
        expected_validation:
          - "Unit tests over load/filter/identity-verification/derivation against a fake engine, which the text() shape makes possible with no live database."
      - id: "T3"
        title: "Wire the override step into main.py and document it"
        objective: >-
          Call apply_game_result_overrides(args.year) in main.py immediately after the postseason
          load_games_to_db call and before get_ratings, wrapped in try/except that
          logger.exception()s and CONTINUES (an unexpected exception must not cost the season its
          rankings -- K5). Log one line per applied override at INFO, and one line per entry in
          the returned `failures` at ERROR containing the literal token OVERRIDE_FAILURE. Then add
          a step to .github/workflows/weekly-update.yml, after the log upload, that greps
          output.log for OVERRIDE_FAILURE and exits nonzero if found -- without this the job goes
          green regardless, because line 103 ends in `|| true`. Add a short subsection to
          README.md's Architecture Summary explaining the mechanism and how to add an entry.
        assigned_domain: "data-engineer"
        model_routing:
          task_profile: "implementation"
          uncertainty: "low"
          consequence: "high"
          scope_size: "narrow"
          determinism: "deterministic"
          requested_tier: "balanced"
          requested_reasoning: "medium"
          provider_model: "Claude Sonnet 5"
          routing_enforced: true
          escalation_tier: "frontier"
          escalation_condition: "n/a"
        owned_scope:
          - "main.py (one new step plus its imports)"
          - ".github/workflows/weekly-update.yml (one new marker-check step only)"
          - "README.md (Architecture Summary subsection)"
        dependencies: ["T2"]
        parallelizable: false
        expected_validation:
          - "tests/test_entry_point_resolves.py still passes (it statically resolves every name main.py calls, so it covers the new import)."
          - "A test asserts the override step is ordered after both load_games_to_db calls and before get_ratings."
          - "The workflow YAML parses and the new step's grep is asserted to match the exact token main.py emits."
      - id: "T4"
        title: "Tests for the override mechanism"
        objective: >-
          Add tests/test_game_result_overrides.py in the repo's established pure-function fixture
          style: derivation parity between the two paths; the seeded entry yields winner='Western
          Michigan', margin=5, alpha=1.2; an identity mismatch on each of the five fields
          independently is recorded as a failure and writes nothing; wrong-season entries are
          filtered to a silent no-op; a malformed or missing override file yields a failure rather
          than a crash or a silent empty list; applying twice is idempotent (the second run
          derives from the override's declared scores, not from the already-corrected row);
          neutral_site comes from the stored row, proven by a neutral-site fixture where a
          hardcoded False would give the wrong alpha; the shipped JSON file parses and validates.
          Mutation-check each test (inject the defect, confirm the test fails) and report it.
        assigned_domain: "data-engineer"
        model_routing:
          task_profile: "test_design"
          uncertainty: "medium"
          consequence: "medium"
          scope_size: "bounded"
          determinism: "interpretive"
          requested_tier: "balanced"
          requested_reasoning: "medium"
          provider_model: "Claude Sonnet 5"
          routing_enforced: true
          escalation_tier: "frontier"
          escalation_condition: "A test cannot be made to discriminate without a live database."
        owned_scope:
          - "tests/test_game_result_overrides.py (new)"
        dependencies: ["T3"]
        parallelizable: false
        expected_validation:
          - "python -m pytest tests/ -q green; new test count reported; mutation results reported per test."

  - id: "B2"
    goal: "Production rollout, after the user merges the PR."
    tasks:
      - id: "T5"
        title: "Run weekly-update.yml for 2026 week 1 and confirm the rollout"
        objective: >-
          Dispatch .github/workflows/weekly-update.yml with week=1, watch it to completion, then
          verify: the games row, the ratings rows for season=2026 week=1, the R2 rankings and
          schedule artifacts, and the live site after the Cloudflare Pages rebuild that the
          workflow's deploy-hook step triggers.
        assigned_domain: "platform-engineer"
        model_routing:
          task_profile: "orchestration"
          uncertainty: "medium"
          consequence: "high"
          scope_size: "bounded"
          determinism: "interpretive"
          requested_tier: "frontier"
          requested_reasoning: "high"
          provider_model: "Claude Opus 5"
          routing_enforced: true
          escalation_tier: "frontier"
          escalation_condition: "n/a -- orchestrator-run, not delegated."
        owned_scope:
          - "GitHub Actions dispatch; read-only verification queries against Supabase and the live site."
        forbidden_scope:
          - "Any direct write to the database. The pipeline must produce the change, or the mechanism is not proven."
        dependencies: ["T4", "user merge"]
        parallelizable: false
        expected_validation:
          - "AC8 and AC9."

ordering_notes:
  - "T1 through T4 are strictly sequential on one branch; no worktrees are warranted."
  - "B2 runs only after the user merges. weekly-update.yml checks out the default branch, so the override file must be on main before the run."
  - >-
    Deliberate ordering detail: the override step goes after BOTH load_games_to_db calls. Putting
    it between them would let the postseason load re-upsert an overridden postseason game.

risks:
  - id: "R1"
    risk: "Extracting the derivation helpers changes ingest behavior for some edge case (NA handling, Int64 vs int comparison)."
    mitigation: "T1's parity test runs the fixture through both the old inline expressions and the new helpers and asserts equality; whole suite must stay green."
  - id: "R2"
    risk: "The override raises mid-run and blocks the weekly publish entirely."
    mitigation: >-
      RETIRED by the K5 revision. The override step no longer halts anything; a failure is
      recorded, the run completes, and the workflow's OVERRIDE_FAILURE check turns the job red so
      the operator finds out the same day. The residual risk is inverted and much smaller: one
      week could publish with the override unapplied, i.e. showing the real result.
  - id: "R3"
    risk: "CFBD reassigns or retires game id 401858428, so the override stops matching."
    mitigation: >-
      The identity check catches it and the OVERRIDE_FAILURE marker surfaces it in CI rather than
      letting it silently revert; the entry's five identity fields say exactly what to search for
      when relocating the game.
  - id: "R4"
    risk: "The re-run recomputes every 2026 week 1 rating, not just the two teams', shifting other teams' ratings."
    mitigation: >-
      Expected and correct -- the model is a global optimization, so changing one result moves the
      solution. Baseline captured before the run (Michigan #22 20.156 1-0, Western Michigan #87
      0.197 0-1, Indiana #1 61.363) so the diff can be inspected rather than guessed at.
  - id: "R6"
    risk: "A future one-off script or a hand-run UPDATE writes `games` outside a main.py invocation, bypassing the override."
    mitigation: >-
      Accepted residual of K6. Self-healing rather than permanent: the next pipeline run
      reasserts every override for the season. Named here so it is a known property, not a
      surprise.
  - id: "R5"
    risk: "The published site presents an operator-altered result as the official one."
    mitigation: "Flagged to the user as open question Q1; the override file records the reason regardless."

model_routing_notes:
  - "Discovery used balanced (Sonnet 5) for the data-path trace and fast (Haiku 4.5) for the ops/workflow scan; both returned usable results with no escalation."
  - "Orchestration and the production rollout stay frontier (Opus 5) because a bad production run is expensive to undo."

open_questions:
  - id: "Q1"
    question: "Mark overridden games in the published artifacts so the site can footnote them?"
    blocking: false
  - id: "Q2"
    question: "Confirm the score reading: Western Michigan 12, Michigan 7."
    blocking: false

review:
  status: "revised after cycle 1"
  loop_count: 1
  notes:
    - "Reviewer decision: request changes. Five required changes, all plan-text; the data-path claims verified independently in code."
    - "K5 reversed outright -- the abort-on-failure design would have re-created the exact silent-green failure tests/test_entry_point_resolves.py exists to prevent."
    - "K7 added: neutral_site source was unspecified and the seeded entry cannot catch it."
    - "T2 pinned to text() SQL; get_games.py's reflected-Table pattern would have made AC4/AC5 untestable in CI, since no existing test touches a database."
    - "season_type added to the identity check; idempotency, malformed-file, and dtype-checked parity gaps closed in T1/T4."
    - "K6 records the rejected DB-trigger alternative and the real tradeoff (enforcement vs. application discipline), which K1 had left one-sided."

checkpoint:
  required_before_execution: true
  status: pending
