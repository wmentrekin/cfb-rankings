artifact: task_handoff
feature: "schedule-grid"
mode: "large-initiative"
execution_batch_id: "B1"
task_id: "T1"
assigned_domain: "data-engineer"
branch: "claude/georgia-tech-schedule-viz-aqy1ay"
repo: "wmentrekin/cfb-rankings"
owner_skill: work

objective: >
  Create a checked-in Supabase migration for a new view, `rankings_games`
  (WHERE season_type='regular' -- a plain, single-predicate filter, identical
  in scope to today's ingestion; conference championship games are already
  included under 'regular' today, NOT a separate category needing detection
  logic). Point model/process_data.py's games query at this view instead of
  querying `games` directly. Audit for any other place `games` is read
  without the same guard.

why_this_matters: >
  This is the FIRST task in a larger feature (a new "Season Grid" schedule
  view) that will, in a later task (T2), backfill postseason games into the
  shared `games` table for the first time ever. model/process_data.py's
  current games query has NO season_type filter at all -- it reads every row
  for season/week<=N regardless of season_type. Postseason week numbers are
  expected to collide with regular-season week numbers, so once T2 adds
  postseason rows, an unguarded query would silently corrupt the live
  rankings model's output. This task (T1) is the guard that must land and be
  validated BEFORE T2 runs, or the corruption risk is real, not theoretical
  -- this exact bug was caught by a plan review pass before any code was
  written.

inputs:
  requirements: "docs/schedule-grid/requirements.yaml"
  plan: "docs/schedule-grid/plan.yaml"
  implementation_report: "docs/schedule-grid/implementation-report.yaml (create if it does not exist yet -- you are the first execution task)"
  relevant_paths:
    - "model/process_data.py (the games query to repoint)"
    - "database/get_games.py (for context on how the pipeline already queries games -- do not modify)"
    - "database/migrations/ (does not exist yet -- create it; this is the repo's first checked-in migration)"

scope:
  owned:
    - "database/migrations/0001_rankings_games_view.sql (new)"
    - "Supabase schema -- create the rankings_games view via the Supabase MCP tool (apply_migration), project id oyqgmbgwohlnrxodvilt"
    - "model/process_data.py (point the games query at rankings_games instead of games -- this one query only)"
  forbidden:
    - "Any other model logic, weighting, or rating computation in model/"
    - "database/get_games.py, main.py, or anything else outside the three items above -- those belong to later tasks (T2+) in this same feature"

implementation_notes:
  - "Apply the migration directly to the live production Supabase project via apply_migration -- this is a pre-authorized decision already made and confirmed with the user during planning (see plan.yaml ordering_notes: 'T1/T2/T3 ... apply directly to the live Supabase project, not a database branch'). Do not treat this as a fresh escalation-worthy production question -- it is a plain CREATE VIEW, non-destructive by construction, already approved."
  - "The view is a single predicate: SELECT * FROM games WHERE season_type = 'regular'. Do not build any special detection logic for conference championship games -- they are already included under 'regular' today (confirmed via prior repo research, see plan.yaml key_decisions)."
  - "This is the repo's first checked-in migration file -- there is no existing database/migrations/ directory or numbering convention to follow beyond what plan.yaml specifies (0001 for this task)."
  - "model/process_data.py's games query today reads directly from the `games` table with no season_type filter -- find that exact query and change only its FROM/table reference to rankings_games. Do not change its WHERE clause, joins, or any other logic."

success_criteria:
  - "database/migrations/0001_rankings_games_view.sql exists, is committed, and matches what was actually applied to Supabase"
  - "rankings_games view exists in the live Supabase project and returns exactly the same rows as a plain SELECT * FROM games WHERE season_type='regular' would today"
  - "model/process_data.py's games query reads from rankings_games, not games, directly -- confirmed by reading the changed line(s), not just by the diff summary"
  - "Rankings output for a known past week (e.g. season=2025, week=10) is byte-for-byte unchanged before this change vs. after it -- run the actual ranking computation (or the relevant model function) both ways and diff the output. This is the load-bearing validation for this entire task; do not skip it or approximate it."

validation_expected:
  - "Confirm rankings_games returns only season_type='regular' rows, exactly matching today's games table scope (row count comparison is sufficient plus a spot check)"
  - "Confirm model/process_data.py's import/query path now references rankings_games, not games"
  - "Byte-for-byte diff of rankings output for a known past week/season, before and after this change (see success_criteria) -- report the actual command/method used and the actual diff result, not just 'looks the same'"

output_format:
  sections:
    - Changes
    - Local Validation
    - Blockers
    - Notes

escalate_if:
  - missing_context
  - conflicting_artifacts
  - product_or_architecture_guess_required
  - scope_expansion_required
  - "the rankings output diff in success_criteria does NOT come back byte-for-byte identical -- stop and report exactly what differs, do not attempt to silently reconcile it"
