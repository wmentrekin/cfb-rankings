artifact: task_handoff
feature: "schedule-grid"
mode: "large-initiative"
execution_batch_id: "B1"
task_id: "T4a"
assigned_domain: "data-engineer"
branch: "claude/georgia-tech-schedule-viz-aqy1ay"
repo: "wmentrekin/cfb-rankings"
owner_skill: work

objective: >
  Add a standalone, pure-function module `artifacts/schedule_standings.py`
  that takes `schedule_grid` rows as input (no DB/R2 I/O of its own) and
  computes, for a given season: (1) each team's overall record and
  conference record; (2) current-season conference-championship status
  (possible/eliminated/clinched) for qualifying conferences only; (3)
  current-season bowl-eligibility status (possible/eligible/ineligible).
  This is the "brains" module T4b will call and shape into the JSON
  artifact -- T4a itself returns plain Python data structures only.

why_this_matters: >
  This is the single most algorithmically load-bearing task in the whole
  feature -- the conference-championship clinch/elimination logic is a
  genuinely non-trivial combinatorial-adjacent problem that went through
  multiple plan-review passes to get right. Getting it wrong either
  produces a visibly incorrect status on the live page (bad) or, worse,
  silently asserts a false 'eliminated'/'clinched' for a real team (much
  worse -- this is sports data people will notice and care about). The
  algorithm below is DERIVED to be conservative-by-construction: implement
  it exactly as specified, do not "improve" it into a fuller simulation --
  the conservative property is the point, not a limitation to fix.

inputs:
  requirements: "docs/schedule-grid/requirements.yaml"
  plan: "docs/schedule-grid/plan.yaml (key_decisions bullets on the clinch/eliminate algorithm and bowl eligibility; T4a task block ~line 220)"
  implementation_report: "docs/schedule-grid/implementation-report.yaml (update it with T4a's results when done)"
  relevant_paths:
    - "database/migrations/0003_schedule_grid_view.sql (exact schedule_grid columns available: game_id, season, week, season_type, team, opponent, conference, home_away, team_score, opp_score, status, neutral_site, conference_game, start_date, notes, playoff_round_name, playoff_round_order, playoff_bracket_slot, playoff_bowl_name)"
    - "artifacts/rankings.py (existing sibling artifact module -- follow its general code style/conventions, though T4a itself does NOT do R2 publishing, unlike rankings.py)"

scope:
  owned:
    - "artifacts/schedule_standings.py (new)"
  forbidden:
    - "model/ and rankings_games -- HARD boundary, no import, no shared code path with the rating model. This module is display-only computation over schedule_grid."
    - "R2 publish, JSON shaping, logo resolution, conference grouping/sort, postseason column bucketing, bye-week synthesis, Week 0/1 disambiguation -- all T4b's job. T4a returns Python data structures (records/statuses), nothing else."
    - "database/migrations/, schedule_grid view definition -- read-only input to this task"

implementation_notes:
  - "RECORD COMPUTATION: for a given (season, team), tally schedule_grid rows where status IN ('win','loss') for overall record; restrict to rows where conference_game=true for conference record. conf_record is null (not '0-0') for Independents -- there is no conference to tally against. Do not count 'bye'/'upcoming'/'tbd' rows toward either record."
  - "CONFERENCE-CHAMPIONSHIP ALGORITHM (implement exactly as specified -- this is the load-bearing part): applies ONLY to conferences confirmed to use a top-2-by-conference-win-total championship format with >= 4 members. Maintain this as a small versioned constant/config dict in this module (not scattered inline logic), with a comment flagging that conference membership/format changes with realignment and should be re-verified each offseason. Any conference not in this confirmed list (including Independents) gets NO possible/eliminated/clinched entry for its teams -- this is a deliberate blank fallback, never guess a status for an unmodeled format."
  - "For a qualifying conference, per team T: W_T = T's current banked conference wins (from the conf_record computation above). R_T = count of T's remaining scheduled conference games (schedule_grid rows where conference_game=true AND status='upcoming'). B_T (best case) = W_T + R_T. L_T (worst case) = W_T."
  - "ELIMINATED: T is eliminated if B_T < the 2nd-highest W_i among every OTHER team i in the conference (i.e. at least two other teams have ALREADY banked more wins than T could possibly ever reach, using only already-secured facts, never projecting other teams' remaining games). This sidesteps the classic joint-infeasibility problem entirely. It may leave a team 'possible' longer than a fully rigorous analysis would -- that's fine and expected. It must NEVER assert 'eliminated' incorrectly."
  - "CLINCHED: T has clinched if the COUNT of other teams i where B_i >= L_T is <= 1 (each team i's own best case checked independently against T's worst case -- no joint-feasibility assumption). This means at most one other team could possibly finish at or above T's guaranteed floor, so T is guaranteed no worse than 2nd place. May under-report an early clinch; must never over-report one."
  - "Both tests are O(N log N) per conference (a sort, not combinatorial/brute-force enumeration) -- do not implement a simulation or exhaustive search."
  - "The standings-sort's own head-to-head tiebreak (T4b's job, for cosmetic within-conference ORDER of 'possible' teams) is NOT used by this algorithm at all. Clinch/eliminate are computed independently per team via the counting rules above -- do not try to resolve 3+-way ties here."
  - "CONDITIONAL_OPPONENT: once a team clinches, every other still-'possible' team in that conference gets conditional_opponent set to name the clinched team (this is a field this module should populate/return, since T4b's contract needs it -- see contracts.interfaces in plan.yaml). The clinching team's own entry is status='clinched', its own opponent-equivalent field is null/not applicable (T4b maps this into the final JSON's opponent=null)."
  - "BOWL ELIGIBILITY: applies per team, current season only, independent of conference-championship status (every FBS team gets a bowl-eligibility status, including Independents and non-qualifying conferences). Default 'possible'. 'eligible' once overall wins >= 6. 'ineligible' once overall losses >= 7 (7 losses in a ~12-13 game season makes 6 wins mathematically impossible -- this is the correct reading; the user's original phrasing said 'eligible' for the losses case, confirmed in a prior planning pass to be a wording slip, not a real requirement -- implement 'ineligible' at 7+ losses)."
  - "Bowl eligibility is NOT itself an 'only for qualifying conferences' computation like the championship one -- every team gets a bowl-eligibility status regardless of conference."
  - "Design the module's public function signature(s) to take schedule_grid rows (as e.g. a list of dicts or a DataFrame -- your choice, but document it clearly) plus season, and return plain Python data structures (e.g. a dict keyed by team name) that T4b can consume without T4a knowing anything about JSON shape, logos, or R2. Do not do any DB/HTTP I/O inside this module -- schedule_grid rows are passed in by the caller (T4b will be the one querying Supabase)."

success_criteria:
  - "artifacts/schedule_standings.py exists, is committed, has no import of model/ or any rating-model code path"
  - "A SYNTHETIC test (see validation_expected) proves the algorithm correct by hand for a small fake conference, including at least one case where two OTHER teams play each other -- this is the real regression test, since live September 2026 data cannot exercise eliminated/clinched at all this early in the season"
  - "Record/conf_record computation spot-checked against known 2025 final standings for at least a couple of real teams"
  - "A conference NOT in the qualifying top-2-format list gets no possible/eliminated/clinched entries -- verified, not just asserted"

validation_expected:
  - "SYNTHETIC scenario required: hand-build a small fake conference (4-5 teams, a fixed fully-specified remaining schedule, known-by-hand-correct possible/eliminated/clinched outcomes for each team) and confirm the function's output matches by hand, including at least one case where two OTHER (non-focal) teams play each other -- this is exactly the scenario the conservative algorithm is designed to handle correctly without needing joint-feasibility reasoning."
  - "Confirm the eliminated test never false-positives against the synthetic scenario: brute-force-check by hand (feasible at this small synthetic scale) that any team marked eliminated truly cannot reach top-2 under ANY remaining-game outcome."
  - "Confirm the clinched test never false-positives against the synthetic scenario: brute-force-check by hand that any team marked clinched truly cannot finish outside top-2 under ANY remaining-game outcome."
  - "Confirm a conference not in the qualifying-format list (or with too few members) gets no possible/eliminated/clinched entries for its teams at all, not a guessed status."
  - "Spot-check computed record/conf_record for at least 2-3 known real teams against known 2025 final standings (query schedule_grid directly via Supabase MCP for real 2025 rows, run this module's record function against them, compare to known real final records)."

output_format:
  sections:
    - Changes
    - Local Validation
    - Blockers
    - Notes

escalate_if:
  - missing_context
  - conflicting_artifacts
  - product_or_architecture_guess_required
  - scope_expansion_required
  - "you cannot find or confirm which real conferences use a top-2-by-conference-win-total format with >= 4 members -- do not guess a list; report what you found and what's uncertain, a conservative empty/partial list is safe, an incorrect list is not"
