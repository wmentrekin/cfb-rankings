artifact: task_handoff
feature: "schedule-grid"
mode: "large-initiative"
execution_batch_id: "B1"
task_id: "T4b"
assigned_domain: "data-engineer"
branch: "claude/georgia-tech-schedule-viz-aqy1ay"
repo: "wmentrekin/cfb-rankings"
owner_skill: work

objective: >
  Add artifacts/schedule.py (new module) that queries schedule_grid + teams,
  calls artifacts/schedule_standings.py's compute_standings() for
  record/conf_record and championship/bowl status, assembles the full
  Season Grid JSON artifact per the contract below, and publishes it to R2.
  Wire the new publish call into main.py's pipeline. This is the largest
  remaining task in B1 -- it is where every other B1 task's output actually
  gets assembled into the thing the frontend will render.

why_this_matters: >
  Everything before this task (T1-T4a) built inputs; nothing has actually
  produced the artifact yet. This task also resolves several genuinely
  tricky data-shaping problems (Week 0/1 disambiguation, bye-week
  synthesis, postseason column bucketing, conference-championship-game
  identification) that prior plan-review passes flagged but could not
  fully resolve without either live CFBD access or deeper investigation --
  this handoff resolves the remaining open one (conference-championship
  game identification) with a concrete, empirically-grounded design; treat
  it as instructions, not a suggestion to re-derive from scratch.

inputs:
  requirements: "docs/schedule-grid/requirements.yaml"
  plan: "docs/schedule-grid/plan.yaml (T4b task block ~line 266; contracts.interfaces ~line 55 has the exact JSON shape; key_decisions lines 32-52 cover conference order/sort/logos/Week-0-1/bye-week mechanics)"
  implementation_report: "docs/schedule-grid/implementation-report.yaml (update it with T4b's results when done)"
  relevant_paths:
    - "database/migrations/0003_schedule_grid_view.sql (exact schedule_grid columns: game_id, season, week, season_type, team, opponent, conference, home_away, team_score, opp_score, status, neutral_site, conference_game, start_date, notes, playoff_round_name, playoff_round_order, playoff_bracket_slot, playoff_bowl_name)"
    - "artifacts/schedule_standings.py (T4a, already committed -- call compute_standings(rows, season) or its sub-functions; read its module docstring for the exact input row shape and output dict shape; do NOT reimplement any of its logic here)"
    - "artifacts/rankings.py (reuse _resolve_logo() and the CONFERENCE_DISPLAY_NAMES dict pattern AS-IS by importing them -- do not re-derive a different logo size/variant or a second conference-name mapping)"
    - "artifacts/r2.py (reuse get_r2_client()/upload_json() as-is by importing them; follow its exact never-raise, log-and-continue exception discipline for every new function you write in schedule.py; build a parallel build_index()/refresh-equivalent for the schedule artifact's own key layout -- do not try to literally reuse r2.py's _WEEK_KEY_RE/build_index, which are rankings' per-week scheme, not this artifact's season-scoped one)"
    - "utils.py's get_cfb_week(today: date, season_start_override: date) -- both params positional/required (no default on season_start_override despite the name suggesting optional), call it as get_cfb_week(game_start_date, None) per game row. Do not modify utils.py."
    - "main.py (the 'PUBLISH RANKINGS ARTIFACT' section near the end, inside `if not args.staging:` -- add the new schedule-artifact publish call alongside it, same guard, same try/except pattern)"

scope:
  owned:
    - "artifacts/schedule.py (new)"
    - "main.py (add the new publish call only)"
  forbidden:
    - "artifacts/rankings.py, artifacts/r2.py (import/reuse; do not rewrite)"
    - "artifacts/schedule_standings.py's internal logic (consume compute_standings()'s output; do not reimplement or duplicate record/status computation here)"
    - "utils.py (call get_cfb_week() as-is; do not change its signature/behavior)"
    - "database/migrations/, schedule_grid view definition (read-only input)"

implementation_notes:
  - "QUERY STRATEGY: query schedule_grid for the target season (all season_types -- this view already has no filter), and teams for that season (school, conference, logos) to resolve logo URLs. schedule_grid's own `conference` column (the team's own conference per that row, already correct per T3) is sufficient for grouping/sorting -- you likely only need `teams` for `logos` (and as a fallback conference source for a team with zero schedule_grid rows, if that's even possible for an FBS team, which it should not be)."
  - "STANDINGS: call schedule_standings.compute_standings(rows, season) once for the whole season's schedule_grid rows (as a list of dicts, matching that module's documented input shape) to get every team's record/conf_record/championship_status/conditional_opponent/bowl_status in one pass. Do not call it per-team in a loop if it's not needed -- it already operates over the full row set."
  - "CONFERENCE GROUP ORDER (fixed list, per key_decisions -- implement as a small ordered constant, not inferred): ACC, Big 12, Big Ten, SEC (power 4, alphabetical), then Independents (raw value 'FBS Independents', see rankings.py's CONFERENCE_DISPLAY_NAMES for the exact raw string), then the remaining 6 conferences alphabetically: American Athletic, Conference USA, Mid-American, Mountain West, Pac-12, Sun Belt. A conference with zero FBS teams in a given season's data simply produces an empty/absent entry -- don't hardcode an assumption that all 11 always have members every season."
  - "WITHIN-CONFERENCE SORT (approximation, documented limitation per key_decisions, not real tiebreaker bylaws): conference win% (conf_wins/(conf_wins+conf_losses), from T4a's record output) descending; tiebreak by head-to-head result ONLY if exactly two teams are tied and played each other this season (look this up from schedule_grid rows directly -- conference_game=true, team/opponent matching both tied teams, status in win/loss); then overall win% descending; then team name ascending. For Independents (no conf_record), sort by overall win% descending then name -- there's no conference grouping tiebreak question for them since they're not compared within a 'conference' group in the same standings sense, just listed under the Independents bucket."
  - "LOGO RESOLUTION: import and call rankings.py's _resolve_logo(logos) for both the team's own logo_url and every week's opponent_logo_url. Do not reinvent this -- using a different size/variant would visibly mismatch the Rankings tab on the same page for the same teams."
  - "CANONICAL COLUMN LIST (build in Python from the data, not hardcoded, per key_decisions' bye-week mechanism fix): for the target season, find every DISTINCT regular-season display-week-slot by calling get_cfb_week(row['start_date'], None) for every schedule_grid row where season_type='regular', producing a sorted set of integers (typically 0..15ish, but derive it, don't assume a fixed range). This is per-row, NOT per raw `week` value -- T3 confirmed raw `week` collides across true-Week-0-vs-Week-1 (129 real examples) and is not safe to bucket on directly. Follow this with, in order: the Conference Championship slot, the Army-Navy Game Week slot, then the four fixed CFP slots (CFP 1st Round + Other Bowls, CFP Quarterfinals, CFP Semifinals, CFP National Championship). Every team gets the SAME canonical column list -- do not vary it per team."
  - "CONFERENCE CHAMPIONSHIP GAME IDENTIFICATION -- resolved during this handoff's preparation, not left for you to guess (see below for why this was a real, previously-unresolved gap): CFBD has NO distinct season_type or round marker for a conference-championship game -- it's season_type='regular' identically to every other regular-season game (confirmed: T1 already established this is why rankings_games doesn't need special detection logic). The originally-planned signal (CFBD's `notes` field) is CURRENTLY EMPTY for all 24,873 existing rows in this sandbox's DB (verified live: `SELECT count(*) FILTER (WHERE notes IS NOT NULL AND notes != '') FROM games` = 0) -- these rows predate T2's widened ingestion, so this cannot be tested live right now, though real going-forward ingestion should start populating it for newly-fetched weeks (CFBD's own real convention often does carry a value like '<Conference> Championship' in notes for these games -- untested here, do not hardcode an exact string match against it without evidence). USE THIS HEURISTIC INSTEAD, which was verified against real 2024 data during this handoff's preparation: within a season, for each conference in schedule_standings.QUALIFYING_CHAMPIONSHIP_CONFERENCES (T4a's config -- import and reuse this constant, don't duplicate the list), the conference-championship game is the SINGLE schedule_grid game (season_type='regular', conference_game=true, both teams sharing that conference) with the LATEST start_date among all of that conference's conference_game=true games that season. Verified live for 2024 week 15: this correctly isolates exactly one real, correct game per qualifying conference simultaneously -- e.g. Texas vs Georgia (SEC), Oregon vs Penn State (Big Ten), Arizona State vs Iowa State (Big 12), SMU vs Clemson (ACC), Boise State vs UNLV (Mountain West), Jacksonville State vs Western Kentucky (Conference USA), Miami (OH) vs Ohio (Mid-American) -- all genuinely each conference's real 2024 championship game, all on the same date, all distinctly later than the rest of that conference's regular slate. ALSO RE-VERIFIED for 2025 during this handoff's preparation (same query, season=2025): again exactly one game per qualifying conference, all clustered on the first weekend of December 2025 (Ohio State vs Indiana, Alabama vs Georgia, Texas Tech vs BYU, Virginia vs Duke, Tulane vs North Texas, Jacksonville State vs Kennesaw State, Western Michigan vs Miami (OH), Boise State vs UNLV) -- holds cleanly across both available real seasons. Still re-run this check yourself as part of your own validation (do not just trust this note blindly), and flag it in open_issues as a documented approximation like the standings-sort tiebreak, not a certified rule -- matching how key_decisions already treats the standings-sort as an explicit non-goal-to-perfect."
  - "For a team in a qualifying conference: once the actual conference-championship schedule_grid row exists (identified above), it overrides T4a's computed placeholder for that team's Conference Championship cell (real data always wins). Until it exists, use T4a's computed championship_status/conditional_opponent for that cell. For a team NOT in a qualifying conference (T4a's compute_standings returns championship_status=None for them), the Conference Championship column simply falls through to the generic bye-fill default below (status='bye') -- there is no special-case needed, this happens automatically as long as you treat 'no real row AND no T4a status' as the trigger for bye-fill."
  - "ARMY-NAVY GAME WEEK: identify by direct team-pairing match -- a schedule_grid game where {home_team, away_team} == {'Army', 'Navy'} (confirm this is the actual exact team-name string used in this DB via a quick query, e.g. SELECT DISTINCT team FROM schedule_grid WHERE team ILIKE '%army%' OR team ILIKE '%navy%' -- do not assume 'Army' and 'Navy' are the exact spellings without checking, teams.school naming can vary, e.g. 'Army West Point'). Only Army's and Navy's own two rows for that game go in this column; every other team gets status='bye' here via the generic bye-fill. Per key_decisions' Army-Navy carve-out: the calendar week-slot that game would have occupied in Army's/Navy's own REGULAR week column (per their get_cfb_week()-derived slot) must show status='bye' there instead -- i.e. when building each team's per-week cells, Army's and Navy's own game-against-each-other row must be excluded from their regular week-column placement and used ONLY for the Army-Navy Game Week column."
  - "CFP-ROUND BUCKETING: for season_type='postseason' rows that are NOT the Army-Navy game, bucket using playoff_round_name (case-insensitive substring match: contains 'quarterfinal' -> CFP Quarterfinals; contains 'semifinal' -> CFP Semifinals; contains 'national championship' or (contains 'championship' and NOT contains 'conference') -> CFP National Championship; anything else, including null/empty round_name, non-CFP bowls, and a real 'first round' match -> CFP 1st Round + Other Bowls, the intentional catch-all name for this slot). NOTE: T2's actual implementation only widened the plain /games endpoint's nested playoff object (round_name/round_order/bracket_slot/bowl_name) -- it did NOT call CFBD's separate /playoffs/cfp/games endpoint that plan.yaml's original T2 objective mentioned (a deliberate scope-narrowing made when T2's handoff was written, not an oversight to fix now, but flag it in your own report so the user is aware CFP-round identity relies solely on the plain endpoint's nested object, whose exact field shape/values were never live-verified -- code the keyword matching defensively, and treat playoff_round_order as a secondary/tie-breaking signal only if round_name matching is ambiguous, not the primary signal, since its exact numeric convention is unconfirmed). game_name for any determined postseason game = playoff_bowl_name if present, else notes if present, else null (a null game_name with a real win/loss/upcoming status is acceptable per the contract -- game_name is only required to be non-null for a DETERMINED game with a real name available)."
  - "BOWL ELIGIBILITY (CFP 1st Round + Other Bowls slot only): every team gets EITHER a real determined postseason schedule_grid row bucketed here (per the rule above) OR, if none exists yet, T4a's computed bowl_status (possible/eligible/ineligible) -- compute_standings() returns bowl_status unconditionally for every team, so this column never falls through to plain 'bye' for anyone, unlike Conference Championship/Army-Navy/the other 3 CFP columns which do fall through to 'bye' for teams with no applicable real or computed entry."
  - "BYE-WEEK / FULL-GRID-ALIGNMENT FILL: after building the canonical column list, for each team iterate every column; if a schedule_grid row matches (team, slot) use it (mapping status/opponent/scores/etc. straight through, with Week-0/1 regular slots matched via each row's own get_cfb_week() result, not raw week); else if a T4a-computed placeholder applies for that specific slot (Conference Championship for qualifying-conference teams; CFP 1st Round + Other Bowls for every team, via bowl_status) use that; else emit status='bye' with opponent=null, game_name=null, team_score=null, opp_score=null. This produces exactly one cell per team per canonical column, no gaps, per the acceptance criteria."
  - "CONDITIONAL_OPPONENT: only ever non-null for a Conference Championship cell with status='possible' (from T4a's output, passed through as-is). Null everywhere else, including every other slot type."
  - "R2 PUBLISH: season-scoped keys, NOT rankings' per-week scheme -- schedule/{season}/latest.json (the full payload) and schedule/index.json (a self-healing index built by LISTING the bucket's actual schedule/{season}/latest.json keys via client.get_paginator, same self-healing-via-listing philosophy as r2.py's build_index(), but your own regex/parsing for this key shape -- do not try to literally reuse r2.py's _WEEK_KEY_RE). Reuse get_r2_client()/upload_json() from r2.py directly (import them) rather than reimplementing R2 client construction. Every public function in schedule.py must follow r2.py's exact never-raise discipline: catch broad Exception, log a warning, return cleanly -- a schedule-artifact publish failure must never break the rest of the pipeline run (model training, DB insert, rankings publish all already happened by the time this runs)."
  - "MAIN.PY WIRING: add exactly one new call inside the existing `if not args.staging:` block, alongside (not replacing) the existing publish_rankings_artifact(args.year, args.week) call, wrapped in its own try/except-and-log pattern so a schedule-publish failure doesn't affect the rankings publish or vice versa. The schedule artifact needs no `week` argument (it's season-scoped) -- call it as e.g. publish_schedule_artifact(args.year)."

success_criteria:
  - "artifacts/schedule.py exists, is committed, contains no reimplementation of schedule_standings.py's algorithm and no reimplementation of rankings.py's _resolve_logo/r2.py's get_r2_client/upload_json"
  - "The JSON contract (below) is produced correctly for 2025 real data: correct conference grouping/order/sort, correct records, correct per-cell status including at least one real win/loss/upcoming cell and the computed possible/eligible/ineligible bowl placeholder (since 2026 in-season data exists) for a sample of teams"
  - "The conference-championship-game identification heuristic is verified against BOTH 2024 and 2025 real data (not just 2024, which this handoff already checked) and the result reported clearly either way"
  - "Every team has exactly one cell for every canonical column, verified by a programmatic check (count of weeks-array entries == canonical column count, for every team), including at least one confirmed real bye week and the Army-Navy carve-out (Army's and Navy's own regular-week column shows 'bye' for the slot their game against each other actually occupies, not a gap or a duplicate)"
  - "A known real 2024/2025 Week-0 game (if one of its teams is in FBS scope -- check for a Dublin-Ireland-style opener) lands in the Week 0 column, not Week 1"
  - "Publish function(s) never raise -- verified by forcing a failure path (e.g. temporarily breaking R2 credentials or mocking a failure) and confirming clean return + warning log, not an unhandled exception"

validation_expected:
  - "Run schedule.py's assembly logic (not necessarily the R2 publish step, which requires real R2 credentials this sandbox may or may not have -- check for R2_* env vars first and report what you found) against real 2025 schedule_grid + teams data via Supabase MCP queries, and inspect the resulting JSON structure directly for conference grouping/order, sort, and per-cell status"
  - "Confirm logo_url/opponent_logo_url resolve to real URLs for a sample of teams, matching what rankings.py's _resolve_logo already produces for the same teams (spot check byte-identical URLs for a shared team)"
  - "Confirm neutral_site is correct for at least one known 2025 neutral-site game (T3's validation already confirmed Iowa State/Kansas State as one such game -- reuse it)"
  - "Confirm the conference-championship heuristic against 2024 AND 2025 real data as described above"
  - "Confirm the bye-fill/canonical-column-count check across a sample of at least 5 teams from different conferences, including at least one Independent"
  - "Confirm a real postseason row, once T2's backfill eventually runs, would override a computed placeholder -- since 0 postseason rows exist in this sandbox right now, this specific check cannot be run against real data; instead construct a small synthetic/mocked schedule_grid row set (a fake determined postseason game for a real team) and confirm your assembly logic picks the real row over T4a's placeholder for that cell. Document this as a synthetic check, not a live one, matching T3/T4a's precedent for genuinely-blocked-on-real-data checks."

output_format:
  sections:
    - Changes
    - Local Validation
    - Blockers
    - Notes

