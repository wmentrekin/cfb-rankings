  - conflicting_artifacts
  - product_or_architecture_guess_required
  - scope_expansion_required
  - "the conference-championship-game heuristic does NOT hold for 2025 the way it was verified to hold for 2024 -- report exactly what differs rather than silently forcing a fit or picking a different unverified heuristic"
  - "R2 credentials are unavailable in this sandbox (likely, matching T2's finding for DB/CFBD credentials) -- this is expected, not a blocker to escalate: build and validate the assembly/JSON-shaping logic fully, write the publish functions to the same never-raise discipline as r2.py, and report clearly that the actual R2 upload step could not be exercised live here, same pattern as T2's CFBD/DB gap"
