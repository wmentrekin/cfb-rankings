artifact: task_handoff
feature: "schedule-grid"
mode: "large-initiative"
execution_batch_id: "B2"
task_id: "T6"
assigned_domain: "frontend-engineer"
branch: "claude/georgia-tech-schedule-viz-aqy1ay"
repo: "wmentrekin/personal-site"
owner_skill: work

objective: >
  Extend the build-time R2 fetch so the Season Grid feature's schedule
  artifact (published by B1, now live in R2) gets pulled into
  public/data/cfb/schedule/ alongside the existing rankings data, following
  the exact same pattern already in scripts/fetch-rankings-data.mjs.

why_this_matters: >
  This site is fully static -- no server adapter, no API routes. Every
  page's data must be baked into public/data/cfb/ before `astro build`
  runs. T9 (the actual Season Grid tab component) will read
  public/data/cfb/schedule/index.json and
  public/data/cfb/schedule/{season}/latest.json the same way index.astro
  already reads public/data/cfb/index.json today -- this task is what
  makes those files exist locally at build time.

inputs:
  requirements: "docs/schedule-grid/requirements.yaml"
  plan: "docs/schedule-grid/plan.yaml (T6 task block, contracts.interfaces for the schedule artifact's JSON shape)"
  implementation_report: "docs/schedule-grid/implementation-report.yaml (in cfb-rankings -- update it with T6's results when done, even though the code change is in this repo)"
  relevant_paths:
    - "scripts/fetch-rankings-data.mjs (the exact pattern to extend/mirror -- read it in full before writing anything)"
    - "package.json (has the existing `\"prebuild\": \"node scripts/fetch-rankings-data.mjs\"` npm script)"

scope:
  owned:
    - "scripts/fetch-rankings-data.mjs (extend in place -- preferred, since it's one prebuild step already wired up) OR a new sibling script (e.g. scripts/fetch-schedule-data.mjs) if you judge that cleaner -- your call, but if you add a new file it MUST be wired into package.json's prebuild step so it actually runs (see forbidden_scope)"
    - "package.json (ONLY the prebuild script line, only if you add a new sibling script file)"
  forbidden:
    - "Any page/component code (src/pages/, src/components/) -- T9's job, not this task's"
    - "Direct Supabase or live R2 access from page/component code -- build-time script only, exactly like the existing rankings fetch"
    - "package.json outside the prebuild script line (no dependency changes -- @aws-sdk/client-s3 is already a dependency, used by fetch-rankings-data.mjs today)"

implementation_notes:
  - "R2 KEY LAYOUT (per B1's T4b, already live): schedule/index.json is {generated_at_utc, latest_season, seasons: [int, ...]} (note: NOT the same shape as rankings/index.json's `seasons: [{season, weeks}]` -- schedule/index.json's `seasons` is a flat array of season ints, since the schedule artifact is season-scoped with no week dimension). schedule/{season}/latest.json is the full Season Grid payload for that season (conferences/teams/weeks -- see plan.yaml contracts.interfaces for the full shape, you don't need to parse or validate its internals in this task, just fetch and write it byte-for-byte like the existing script does for rankings)."
  - "CREDENTIALS: this repo's existing fetch-rankings-data.mjs uses R2_ACCOUNT_ID, R2_ACCESS_KEY_ID_READONLY, R2_SECRET_ACCESS_KEY_READONLY, R2_BUCKET_NAME (note the _READONLY suffix -- a distinct, narrower credential set from the cfb-rankings backend's own R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY used for publishing). Reuse these exact same env var names -- do not invent new ones, the schedule artifact lives in the same bucket."
  - "OUTPUT PATH: write to public/data/cfb/schedule/index.json and public/data/cfb/schedule/{season}/latest.json -- parallel to the existing public/data/cfb/index.json and public/data/cfb/{season}/week-{NN}.json layout, just under a schedule/ subdirectory so the two artifacts never collide."
  - "MISSING-CREDENTIALS BEHAVIOR: exactly match the existing script's contract -- if credentials aren't configured, warn and return/exit 0 (must never break `npm run dev` or a build with no secrets configured, e.g. a fresh checkout or a PR preview before secrets exist). If credentials ARE configured but a fetch fails, exit non-zero so a Cloudflare Pages build fails loudly rather than shipping stale/missing schedule data -- same reasoning as the existing script's own header comment."
  - "Fetch ALL seasons listed in schedule/index.json's `seasons` array (not just latest_season) -- mirrors the existing script's behavior of fetching every week for every season, not just the latest, so a user selecting an older season on the (page-level, per key_decisions) season selector has real local data to read at build time, not just the current one."
  - "If you extend fetch-rankings-data.mjs in place rather than adding a sibling script: keep it as one coherent async function per artifact type (existing rankings fetch untouched/unchanged in behavior, new schedule fetch added alongside it in the same file, both invoked from the same main()). Do not restructure or refactor the existing rankings-fetching code while you're in this file -- this task is additive only."

success_criteria:
  - "public/data/cfb/schedule/index.json and public/data/cfb/schedule/{season}/latest.json (for every season schedule/index.json lists) exist after running the prebuild step with real credentials"
  - "The existing rankings fetch behavior is completely unchanged -- same files written, same content, same missing-credentials/fetch-failure behavior"
  - "Missing-credentials and fetch-failure behavior for the NEW schedule fetch exactly matches the existing rankings fetch's contract (warn+continue vs. exit non-zero)"

validation_expected:
  - "Run `npm run prebuild` (or `node scripts/fetch-rankings-data.mjs` directly) locally against the REAL published B1 artifact -- real R2 credentials are required for this; if you don't have them in your environment, say so clearly in your report rather than skipping validation silently, and validate what you can (script logic/syntax, a mocked fetch) instead"
  - "Confirm public/data/cfb/schedule/ is populated with real (non-empty, valid JSON) content matching what's actually live in R2 (the user already confirmed schedule/2026/latest.json and schedule/index.json are live and correct, per B1's T5b)"
  - "Confirm the existing public/data/cfb/index.json and public/data/cfb/{season}/week-*.json files are unaffected (same content as before this change)"
  - "If credentials are unset, confirm the script warns and exits 0 without touching public/data/cfb/schedule/ at all (not even creating an empty directory)"

output_format:
  sections:
    - Changes
    - Local Validation
    - Blockers
    - Notes

escalate_if:
  - missing_context
  - conflicting_artifacts
  - product_or_architecture_guess_required
  - scope_expansion_required
  - "you don't have real R2 credentials available to validate against the live artifact -- report this clearly as a Blocker/Note rather than silently skipping validation or fabricating a result"
