    - "T3: known future/unplayed 2026 game (Washington vs. Washington State, start_date 2026-09-06, 0-0 in raw games) -- both schedule_grid rows show status='upcoming', NOT a false win/loss from the 0-0 read"
    - "T3: global check -- 0 rows anywhere in schedule_grid have start_date > now() AND status IN ('win','loss'); full status distribution is win=23,946 / loss=23,946 (symmetric, as expected for a home/away reshape) / upcoming=1,854, summing exactly to 49,746"
    - "T3: tie/stale-score defensive branch -- found 268 real rows (134 games) with start_date <= now() and team_score = opp_score, all of them 2026-09-06 games whose kickoff time has passed but whose score is still 0-0 (i.e. in-progress/not-yet-synced by CFBD in this static dataset, not a real tie); all correctly land on status='upcoming' rather than a false win/loss, confirming the documented fallback behaves as intended"
    - "T3: grain check -- (season, team, season_type, week) is NOT always unique using the raw `week` column: 129 (season, team, season_type, week) combinations have 2 rows (e.g. UNC 2022 week 1 played both Florida A&M 8/28 and App State 9/3, both tagged week=1 by CFBD; New Mexico State 2026 week 1 plays both Florida State 8/29 and Mercyhurst 9/6, both tagged week=1). Investigated: this is a genuine, pre-existing CFBD raw-week-numbering characteristic (not a view bug or duplicate-row issue -- each pair has a distinct game_id, start_date, and opponent), and matches plan.yaml's already-documented Week 0 vs. Week 1 disambiguation issue, explicitly scoped to T4b (which resolves it via per-game utils.get_cfb_week(start_date), not raw `week`). schedule_grid exposes start_date per row precisely so T4b can do this; no T3 change needed or made."
    - "T3: 'tbd' status edge case investigated per the handoff -- (a) 0 postseason rows exist in this sandbox yet (T2's backfill has not been run), so there is no live data to exhibit the pattern either way; (b) the handoff's own suggested detection signal (opponent name absent from teams.school) was tested against the existing 24,873 regular-season rows and found unreliable -- real, legitimate games routinely have a non-FBS opponent absent from teams.school (e.g. Cincinnati vs. UT Martin, Eastern Illinois vs. Western Illinois), which the signal would misclassify as 'tbd'. Given no evidence either way and the one concrete signal disproven, schedule_grid does not emit 'tbd' and defaults all future rows to 'upcoming', per the handoff's explicit fallback. See open_issues -- revisit once the real postseason backfill runs and actual CFP-bracket rows exist to inspect."
    - "T3: get_advisors (security) run post-migration -- schedule_grid is flagged SECURITY DEFINER, identically to T1's already-landed rankings_games (same pre-existing view-creation convention in this project, not a new issue introduced here); get_advisors (performance) shows only pre-existing table-level RLS warnings on teams/games/ratings/ratings_test, none new or related to schedule_grid"
