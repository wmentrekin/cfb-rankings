    - "T4a: SYNTHETIC test (the real regression test for this algorithm, per the handoff) -- hand-built a 5-team fake conference (P/Q/R/S/T) with a full round-robin conference schedule (4 games/team, 6 played + 4 upcoming), including two upcoming games that are each between two OTHER (non-focal) teams (Q vs R; S vs T). By-hand brute-force of all 4 remaining-game outcome combinations confirmed: P is genuinely un-catchable (clinched, true positive -- ceiling of every other team is 3, below P's locked-in 4), S and T are genuinely unreachable for top-2 (eliminated, true positives -- Q and R's already-banked 2 wins each are locked in and exceed S/T's maximum possible 1 win), and Q/R are genuinely NOT guaranteed either way (possible, true negatives for both the eliminated and clinched tests -- verified a real remaining-game outcome where each makes top-2 and another where each does not). conditional_opponent correctly named P for both still-possible teams (Q, R) and was null for P/S/T. Script (not committed, scratchpad only): validate_schedule_standings.py, run via `python3` -- all assertions passed on first run."
    - "T4a: confirmed a conference not in the qualifying-format dict (synthetic 'Unlisted Conference' with data otherwise identical to the passing synthetic scenario) returns zero possible/eliminated/clinched entries -- not a guessed status. Also confirmed a conference that IS in the qualifying dict but has only 3 teams in the data (below min_members=4) also returns zero entries, and confirmed the module's own default QUALIFYING_CHAMPIONSHIP_CONFERENCES constant does not contain Sun Belt, Pac-12, or FBS Independents."
    - "T4a: confirmed Independent-team handling -- a synthetic FBS Independents team's conf_record is None (not '0-0'), and it gets no championship_status/conditional_opponent entry (both None), while its overall record/bowl_status are still computed normally."
    - "T4a: confirmed bowl-eligibility boundaries -- 6 wins -> eligible (checked before the losses test, so a team that reaches 6 wins stays eligible even after a later 7th loss); 7+ losses with < 6 wins -> ineligible; otherwise -> possible."
