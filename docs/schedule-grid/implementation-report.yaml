ek correctly show 'bye' for everyone (0 real 2025 postseason rows and no 2025 Army-Navy row exist yet in this sandbox); full payload round-trips through json.dumps/json.loads cleanly (921,833 bytes for the 2025 season) with no numpy-serialization errors and no leftover internal sort-scratch keys in the output."
