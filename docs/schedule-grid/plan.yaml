artifact: plan
feature: "schedule-grid"
mode: "large-initiative"
status: draft
owner_skill: work
based_on: "docs/schedule-grid/requirements.yaml"

objective: >
  Publish a general, team-agnostic season schedule grid (all FBS teams x weeks,
  color-coded by outcome, grouped by conference) for the 2025 and 2026 seasons,
  replicating a stylized version of the user's manual Google Sheet. Data flows
  cfb-rankings (Supabase -> new grid-shaped view -> R2 artifact, weekly cron)
  into personal-site (build-time fetch -> a switchable tab on the existing
  rankings page), matching the existing rankings artifact pattern exactly.

approach:
  summary: >
    Two sequential batches, one per repo, each ending in its own PR. B1
    (cfb-rankings) must fully MERGE before any B2 (personal-site) code work
    starts -- the user explicitly chose to wait for real merged/published
    data rather than build against a staging artifact, to lock build/UI
    questions before making changes. The one exception is a visual design
    mockup (not code), which has no data dependency and can happen any time,
    including in parallel with B1 -- see T8 and ordering_notes.
  key_decisions:
    - "CRITICAL GUARD (added after plan review): model/process_data.py's games query (the one actually consumed by the ranking model) has NO season_type filter at all -- it reads ALL rows for season/week<=N regardless of season_type. This has been safe only because postseason rows have never existed in `games` before. Before any postseason backfill happens, this query (and any other unguarded reads of `games`) must be explicitly filtered to season_type='regular' (+ conference championship, matching the existing confirmed rankings scope), or the backfill will silently corrupt the ratings model -- directly reversing a previously confirmed non-goal (docs/2026-season-readiness/requirements.yaml). This is now its own task (T1), ordered strictly before ingestion widening."
    - "Recurring postseason ingestion, not just a one-time backfill: 2026 postseason games play out through Jan 2027, so a weekly re-fetch of season_type='postseason' must be wired into the existing main.py pipeline run (load_games_to_db is already idempotent via ON CONFLICT DO UPDATE), not just a one-off backfill invocation. Otherwise 2026 Bowl/CFP columns go stale immediately after the backfill."
    - "schedule_grid view grain must be (season, team_id, season_type, week) or an explicit named 'slot' -- NOT (season, team_id, week) alone, because postseason week-numbering may collide with regular-season week numbers (e.g. both starting at week=1). This must be confirmed against real CFBD postseason data during T2/T3, not assumed."
    - "Postseason column model (added per user request, replaces the earlier flat 'Bowl / CFP-QF / CFP-SF / CFP-Final' scheme): after the last regular-season/conference-championship column comes a standalone 'Army-Navy Game Week' column (populated only for Army's and Navy's rows, vs. each other; blank for every other team -- identified by home/away team pairing, not by a new ingestion path, since Army-Navy is an ordinary already-ingested game), then 'CFP 1st Round + Other Bowls' (all non-playoff bowl games + CFP first round), 'CFP Quarterfinals', 'CFP Semifinals', 'CFP National Championship'."
    - "CFBD postseason data research (platform-researcher pass, confirmed via CFBD's official client-library docs, not live-tested -- no API key/network access available in this environment): CFBD's existing /games endpoint (already called by get_games.py) returns far more than the fixed column subset get_games.py currently selects -- notably a free-text `notes` field and a nested `playoff` object (`GamePlayoff`: competition, format, round, round_name, bracket_slot, home_seed/away_seed, and a confirmed `bowl_name` string field) for CFP-affiliated games. CFBD also has a wholly separate, richer `/playoffs/cfp/games` endpoint (`PlayoffMatchup`) carrying `bowl_name`, `round_name`, `round_order`, `bracket_slot`, `start_date`, seed/slot info, and `advances_to` bracket progression. This means CFP-round column bucketing (CFP 1st Round + Other Bowls / Quarterfinals / Semifinals / National Championship) can and should use CFBD's own structured round_name/round_order/bracket_slot data directly, NOT date-based inference as originally planned -- a strictly better, more reliable source that fell out of this research. Real bowl names for CFP games come from `playoff.bowl_name`; for non-CFP bowls, `Game.notes` is the plausible carrier (existence of the field is confirmed from docs; whether it's reliably populated with real bowl names is NOT yet empirically confirmed -- T2 must verify this against live 2025 data before relying on it, and fall back to a generic label if `notes` proves unreliable). This closes T2's original open question -- ingest real bowl names/round identity in THIS pass via a widened /games column selection + the /playoffs/cfp/games endpoint, not a deferred future phase."
    - "Bowl/sponsor logos are NOT a deferred-for-now item -- confirmed via the same research that CFBD's schema has no bowl or sponsor logo field anywhere (team logos, already used via teams.logos, are the only logo asset CFBD exposes at all). A future enhancement here would need an entirely different data source (a logo API, or manual curation), not just 'wait for CFBD to have it once bowls are announced.' Documented as a genuine data-source gap, not a timing gap."
    - "Conference championship column, current season, per team: FOUR states -- 'possible', 'eliminated', 'clinched' (the clinching team's own cell), and (implicitly) a real game once one exists. 'clinched' is its own status value in the contract (see contracts.interfaces) -- NOT reused from 'tbd', because 'tbd' means a real, already-scheduled game with an undetermined opponent (e.g. a real CFP bracket slot), while 'clinched' means a computed projection (the championship game doesn't formally exist as a schedule_grid row yet). Both render as muted 'vs TBD' text but are semantically distinct so T4a/T9 never have to guess which one a given cell is."
    - "Conference championship clinch/elimination ALGORITHM (added after plan review flagged the original description as asserted-not-specified): applies only within a conference confirmed (during T4a implementation) to use a top-2-by-conference-win-total championship format with at least 4 members -- any conference not confirmed to fit this (fewer members, a different/divisional format, or simply not verified) gets NO entry in this column for its teams, same blank treatment as Independents. This is a deliberate, explicit fallback (never guess a status for an unmodeled format), not an implicit 'known limitation.' For a qualifying conference, per team T: let W_T = T's current (already-banked) conference wins (reuses the existing conf_record computation), R_T = T's remaining scheduled conference games (schedule_grid rows where conference_game=true and status='upcoming'). Best case B_T = W_T + R_T (T wins out). Worst case L_T = W_T (T loses out). -- ELIMINATED: T is eliminated if B_T is less than the 2nd-highest W_i among every OTHER team i in the conference (i.e. at least two other teams have ALREADY banked more wins than T could possibly ever reach). This is a safe/conservative test: it only relies on wins other teams have already secured as fact, never on projecting how their remaining games play out, so it sidesteps the classic 'other teams also play each other' joint-infeasibility problem entirely -- it may occasionally leave a team 'possible' a little longer than a fully rigorous analysis would, but it will NEVER incorrectly assert 'eliminated.' -- CLINCHED: T has clinched if the COUNT of other teams i where B_i >= L_T (i.e. team i's own best case could still reach or exceed T's guaranteed floor, each checked independently) is <= 1 -- meaning at most one other team could possibly finish at or above T's worst case, so T is guaranteed no worse than 2nd place. Also a safe/conservative test (independent per-team best-case checks, no joint-feasibility assumption required), may under-report an early clinch, never over-reports one. -- Both tests are O(N log N) per conference (a sort, not combinatorial enumeration), so there's no tractability concern at FBS conference sizes, run weekly. -- The standings-sort's own head-to-head tiebreak (key_decisions below) is NOT used by this algorithm at all -- clinch/eliminate are computed independently per team via the counting rules above, sidestepping any need to resolve 3+-way ties for elimination purposes; ties only ever matter for the separate, cosmetic within-conference display ORDER of 'possible' teams. -- Once a team clinches, every other still-'possible' team's cell updates conditional_opponent to name it (per the existing conditional_opponent contract field); the clinching team's own cell is status='clinched', opponent=null."
    - "Bowl eligibility, current season, per team (added per user request), applies ONLY to the 'CFP 1st Round + Other Bowls' slot (the single generic postseason-destination placeholder -- CFP Quarterfinals/Semifinals/National Championship stay blank/upcoming for every team until real CFP-bracket postseason data appears for them, since predicting CFP qualification is out of scope, arguably the rankings model's whole job): (1) 'possible' (default, before either threshold below). (2) 'bowl eligible' once wins >= 6. (3) 'bowl ineligible' once losses >= 7 (7 losses in a ~12-13 game season makes 6 wins mathematically impossible -- flagging this explicitly since the user's phrasing said 'eligible' for the losses case, which reads as a typo; confirm/correct at implementation kickoff if this reading is wrong). Once a real bowl game is announced and ingested (via T2's existing recurring postseason fetch), it simply replaces the computed possible/eligible/ineligible placeholder for that team's CFP 1st Round + Other Bowls cell -- real data always wins over the computed placeholder, no special-case logic needed for the transition. Actual bowl tie-in/matchup assignment logic is explicitly out of scope for this pass -- a future-enhancement note, not a task here."
    - "Past-season (already-determined) postseason cells display the real game/bowl name (e.g. 'Pop-Tarts Bowl'), not a generic 'Bowl' label -- sourced from playoff.bowl_name (CFP games) or notes (non-CFP bowls, pending T2's empirical reliability check -- see the CFBD postseason data research key_decision). Bowl logos are a genuine data-source gap (CFBD has none), not an MVP-scope deferral -- cells with a real game_name but no logo simply show text only, no placeholder badge (unlike team logos, which always have a placeholder fallback)."
    - "Data model: a new Supabase view (preferred over a table) named schedule_grid, computing one row per (season, team_id, season_type/slot, week) with: conference, week_label, opponent (nullable/TBD for undetermined future playoff matchups), home_away, status (win/loss/bye/upcoming/tbd), team_score, opp_score. A view stays always in sync with games/teams with no separate population/write step. Fall back to a materialized table only if query performance requires it."
    - "'Played' vs 'upcoming' vs 'TBD' must be derived from start_date / an explicit completed-indicator, never from score nullness -- confirmed finding: unplayed 2026 games are stored as home_score=0/away_score=0, not NULL. This applies equally to postseason rows, which additionally may have no opponent determined yet (playoff slots) -- that is a distinct status from 'upcoming with a known opponent' and must be handled explicitly, not just inferred from a missing score."
    - "Conference group order: ACC, Big 12, Big Ten, SEC (power 4, alphabetical), then Independents, then the remaining 6 conferences alphabetically (American, Conference USA, MAC, Mountain West, Pac-12, Sun Belt). This exact ordering is a small ordered list/lookup in the artifact-builder, not inferred at query time, so it's easy for the user to reorder later."
    - "Within-conference sort: by conference standings, approximated as conference-game win% (from games where conference_game=true and both teams share a conference) descending, tiebroken by head-to-head result if exactly two tied teams played each other this season, then by overall win% descending, then by team name. This is an explicit approximation, not an implementation of any conference's real, often multi-step tiebreaker bylaws (head-to-head sweeps, common-opponent records, division rules, etc. vary by conference and are not stored anywhere canonically -- there is no CFBD or other ingested source for computed/tiebroken standings). Flagged to the user as a known MVP limitation; implementing real per-conference tiebreaker rules is an explicit non-goal for this pass, revisit only if the approximation visibly misorders standings in practice."
    - "Team/opponent logos: teams.logos (Supabase, ARRAY type) is the source -- the artifact builder (T4b) resolves one URL per team (own row logo) and reuses the same lookup for each week's opponent logo. The array's exact structure (multiple sizes/variants) is not yet confirmed from live data -- T4b must inspect a real teams.logos value during implementation to decide which array element to use, not guess. Not a new ingestion need: teams.logos already exists from the season's teams load."
    - "Conference record and overall record are NOT stored anywhere as of-a-date aggregates -- they must be computed by T4a from schedule_grid rows (already has per-game results) at artifact-build time: overall win/loss = tally all played rows for the team/season; conference win/loss = tally only rows where conference_game=true. This requires schedule_grid (T3) to expose conference_game and neutral_site per row, which the original T3 scope did not list -- added below."
    - "New view is added via a versioned SQL migration file committed to the repo (e.g. database/migrations/0001_schedule_grid_view.sql) and applied with the Supabase MCP tool -- the repo's first checked-in schema artifact."
    - "R2 key layout for the schedule artifact is season-scoped (schedule/{season}/latest.json + schedule/index.json), NOT the rankings artifact's per-week snapshot scheme -- correct given the grid is a cumulative-per-season view, not a discrete weekly snapshot. The index-builder in artifacts/schedule.py is new, parallel logic (same self-healing-via-bucket-listing philosophy as artifacts/r2.py) -- it cannot literally import/reuse rankings' per-week regex indexer."
    - "personal-site placement (per user, still tentative pending the mockup): NOT a new standalone route. The existing /projects/cfb-rankings page gains a switchable tab at the top (defaults to 'Rankings', toggle to 'Schedule'), both views living on the same page/URL. Home page and projects-index links continue to point at the single rankings page."
    - "Per the user: lock UI questions before writing personal-site code. A visual design mockup (conference grouping, tab toggle, win/loss/upcoming coloring, sticky header/first-column corner-cell handling) is produced and shown to the user for reaction BEFORE T9 (the real component) is implemented -- see T8."
    - "Lightweight bronze/silver/gold, by user request, NOT full medallion: the user asked whether to introduce a layered bronze/silver/gold table structure. Adopted a cheap version -- name the split as two SQL VIEWS, not physical materialized tables. Bronze = the existing `games` table (raw-ish CFBD ingest, all season_types once T2 widens it). Silver = two named, disjoint-predicate views over that one bronze table: `rankings_games` (season_type='regular' + conference championship -- T1) and `schedule_grid` (all games, reshaped per-team-per-week -- T3). Gold = the two R2 JSON artifacts (rankings, schedule). This directly answers 'how do you separate the games in one vs. the other': two named views with explicit predicates, not overlapping ad hoc logic in Python and SQL. Explicitly rejected: materialized silver tables with their own refresh/upsert jobs -- that adds a staleness/idempotency surface that works against the 'renders identically every time' goal, and is disproportionate to this repo's scale (a few thousand games/season, two consumers)."

contracts:
  interfaces:
    - "New artifact schema (JSON): { season, generated_at_utc, conferences: [{ name, teams: [{ team, logo_url, record: {wins, losses}, conf_record: {wins, losses}, weeks: [{ slot_id, label, season_type, opponent, opponent_logo_url, opponent_tbd, conditional_opponent, game_name, home_away, neutral_site, status, team_score, opp_score }] }] }] } -- exact shape finalized in B1's artifact-builder task (T4b), then treated as a fixed contract for B2 to consume. slot_id/label carries regular weeks (0..N), the standalone Army-Navy Game Week slot, and CFP 1st Round + Other Bowls, CFP Quarterfinals, CFP Semifinals, CFP National Championship (see key_decisions) so the frontend never has to re-derive column identity from a possibly-colliding raw week number. status enum: win/loss/bye/upcoming/tbd (already-scheduled real games) plus possible/eliminated/clinched/eligible/ineligible (computed conference-championship and bowl-eligibility placeholders, current season only -- 'clinched' fixed after plan review: it is its OWN status value, distinct from 'tbd', because 'tbd' means a real scheduled game with an undetermined opponent while 'clinched' means a computed projection with no real schedule_grid row yet -- both render as muted 'vs TBD' text, but T4a/T9 must never conflate them). conditional_opponent is non-null only for status='possible' once another team has clinched/reached a threshold that names part of the matchup; null otherwise -- distinct from opponent, which is only set for a real, confirmed game. game_name is non-null only for a real, determined postseason game -- e.g. 'Pop-Tarts Bowl' -- sourced from CFBD's `notes` field (non-CFP bowls) or `playoff.bowl_name` (CFP games, confirmed to exist in CFBD's schema per T2's research, see key_decisions). record/conf_record/logo_url/opponent_logo_url/neutral_site/conditional_opponent/game_name were all added after mockup/planning review surfaced UI needs the original contract didn't carry -- see key_decisions."
    - "personal-site's fetch-rankings-data.mjs pattern extended (new function or sibling script) to pull schedule/index.json and schedule/{season}/latest.json into public/data/cfb/schedule/, following the exact same prebuild/readFileSync consumption model as rankings -- no direct Supabase or live R2 access from the rendered page."
  schemas:
    - "New Supabase view rankings_games (T1): season_type='regular' + conference championship rows only, from the bronze `games` table. model/process_data.py queries this view instead of `games` directly -- a real schema object, not an inline Python filter."
    - "New Supabase view schedule_grid (T3): all games (regular + postseason) from the bronze `games` table, reshaped one row per (season, team_id, season_type/slot, week), documented in a checked-in migration file."
    - "Both views are the repo's 'silver' layer (see key_decisions) -- disjoint predicates over one shared bronze table, no materialized tables or refresh jobs."
  config_changes:
    - "weekly-update.yml: no new workflow, but main.py gains two new steps -- (1) a recurring postseason games fetch alongside the existing regular-season fetch, (2) the new schedule artifact publish -- both in the same job/run as today's pipeline"
    - "personal-site scripts/fetch-rankings-data.mjs (or a new prebuild script) gains the new R2 keys to fetch"

branching:
  strategy: "single-branch"
  branch_name: "claude/georgia-tech-schedule-viz-aqy1ay"
  worktrees: []

execution_batches:
  - id: "B1"
    goal: "cfb-rankings: guard the model, widen+backfill postseason ingestion, new grid view, artifact builder, weekly publish, PR"
    tasks:
      - id: "T1"
        title: "Create rankings_games silver view and point the model at it (replaces an inline filter)"
        objective: >
          Add a checked-in migration creating a `rankings_games` Supabase
          view: season_type='regular' + conference championship rows only,
          selected from the bronze `games` table (matching the model's
          existing documented scope). Point model/process_data.py's games
          query at this view instead of `games` directly, and audit for any
          other place `games` is read without the same guard. This must land
          and be validated BEFORE T2's postseason backfill runs, since
          postseason week numbers are expected to collide with regular-season
          week numbers (see T3), which would otherwise cause postseason rows
          to satisfy a raw `week <= N` filter for essentially every ranking
          week. Naming/placing this as a named view (not an inline WHERE
          clause) is deliberate -- see key_decisions' bronze/silver/gold note
          -- so the boundary between "games the model sees" and "games the
          schedule grid sees" is one auditable schema object per consumer,
          not logic scattered across Python and SQL.
        assigned_domain: "data-engineer"
        owned_scope:
          - "database/migrations/0001_rankings_games_view.sql (new)"
          - "Supabase schema (via apply_migration, for rankings_games only)"
          - "model/process_data.py (point the games query at rankings_games instead of games)"
        forbidden_scope:
          - "Any other model logic, weighting, or rating computation"
        dependencies: []
        parallelizable: false
        expected_validation:
          - "Confirm rankings_games returns only season_type='regular' + conference championship rows"
          - "Confirm model/process_data.py now reads from rankings_games, not games, directly"
          - "Confirm rankings output for a known past week (e.g. 2025 week 10) is byte-for-byte unchanged before/after this change, since no postseason rows exist yet at this point"

      - id: "T2"
        title: "Add postseason columns to games, widen ingestion, backfill 2025+2026, wire recurring weekly postseason refresh"
        objective: >
          Extend get_games_by_year_week/load_games_to_db to also ingest
          season_type='postseason' games from CFBD, AND widen the column
          selection get_games_by_year_week currently applies to the /games
          response (it silently drops fields today) to keep `notes` and the
          nested `playoff` object (round, round_name, bracket_slot,
          home_seed/away_seed, bowl_name) -- both confirmed to exist in
          CFBD's schema per key_decisions' CFBD postseason data research.
          Also call CFBD's separate /playoffs/cfp/games endpoint
          (PlayoffMatchup: bowl_name, round_name, round_order, bracket_slot,
          start_date, advances_to) as the authoritative source for CFP-round
          identity -- use round_name/round_order/bracket_slot for the CFP
          1st Round + Other Bowls / Quarterfinals / Semifinals / National
          Championship column bucketing, NOT date inference. Empirically
          verify against real 2025 data (the research pass could not, given
          no API key/network access in that environment): whether `notes`
          reliably carries real bowl names for non-CFP bowls (fall back to a
          generic label per team/game if not), and whether `/playoffs/cfp`
          data covers the 2025 season cleanly. Also confirm Army-Navy's
          real CFBD week/date so T4a can identify it reliably (currently
          planned as team-pairing-based, not week-based, but confirm no
          better signal exists). Run a one-time backfill for season=2025
          (complete) and season=2026 (partially TBD). Wire a recurring call
          into main.py's weekly run so 2026 postseason rows keep updating as
          matchups are determined and games are played (load_games_to_db is
          already idempotent).
        assigned_domain: "data-engineer"
        owned_scope:
          - "database/get_games.py"
          - "database/migrations/0002_games_postseason_columns.sql (new -- ALTER TABLE games to add nullable notes, playoff_round_name, playoff_round_order, playoff_bracket_slot, playoff_bowl_name columns; this is the bronze table's first schema change, additive/nullable, safe for existing rows)"
          - "main.py (add the recurring postseason fetch call)"
          - "one-off backfill invocation (script or documented manual command)"
        forbidden_scope:
          - "model/ (T1 already lands the guard; do not touch rating logic here)"
        dependencies: ["T1"]
        parallelizable: false
        expected_validation:
          - "Query Supabase directly to confirm postseason rows exist for 2025 with real final scores and for 2026 (scheduled, TBD opponent/0-0 where undetermined) after backfill"
          - "Confirm existing regular-season row counts (2025: 887, 2026: 888 as of investigation) are unchanged"
          - "Re-run T1's known-week rankings check and confirm output is STILL unchanged now that postseason rows exist -- this is the real regression test T1 alone couldn't provide"
          - "Confirm the new recurring call is safe to run weekly without duplicating or corrupting rows (upsert behavior verified)"
          - "Confirm notes and playoff.bowl_name/round_name/round_order/bracket_slot populate for a known real 2025 postseason game (both a CFP game and a non-CFP bowl) -- if notes doesn't reliably carry a real bowl name for non-CFP bowls, document that finding and fall back to a generic label rather than silently shipping garbage text"

      - id: "T3"
        title: "Create schedule_grid silver view via checked-in migration"
        objective: >
          Design and apply a second silver-layer Supabase view (or table,
          only if the view proves insufficient), schedule_grid, producing one
          row per (season, team_id, season_type, week/slot) with conference,
          opponent (nullable/TBD-aware for undetermined playoff matchups),
          home/away, status (win/loss/bye/upcoming/tbd), scores,
          conference_game (bool, for T4a's conference-record tally and
          within-conference sort), neutral_site (bool, for the UI's
          neutral-site marker), start_date, notes, and the playoff round
          fields (round_name, round_order, bracket_slot, bowl_name) T2 adds
          to the bronze `games` table (for T4b's CFP-round column bucketing
          and past-season bowl-name display) -- selected from the same
          bronze `games` table
          as T1's rankings_games, but with a disjoint predicate (all games,
          not just regular season). Explicitly key by season_type + week (or
          a named slot) to avoid collisions between regular-season and
          postseason week numbers. Derive played vs. upcoming vs. TBD from
          start_date/a completed-indicator, never from score nullness.
          Commit the migration SQL to the repo alongside T1's.
        assigned_domain: "data-engineer"
        owned_scope:
          - "database/migrations/0003_schedule_grid_view.sql (new)"
          - "Supabase schema (via apply_migration, for schedule_grid only)"
        forbidden_scope:
          - "games/teams table structure (read-only source data, no column changes)"
        dependencies: ["T2"]
        parallelizable: false
        expected_validation:
          - "Query the view for a known team/week and manually verify status/opponent/home-away against known 2025 results, for both regular and postseason rows"
          - "Confirm regular-season and postseason rows for the same team never collide/overwrite under the chosen key"
          - "Confirm bye weeks, upcoming (unplayed) weeks, and TBD-opponent postseason slots each render as distinct, correctly-derived statuses -- not as false 0-0 losses/ties"
          - "Confirm conference_game and neutral_site match known 2025 games (e.g. a known rivalry/conference game reads conference_game=true; a known neutral-site game reads neutral_site=true)"

      - id: "T4a"
        title: "Compute team records and conference-championship/bowl-eligibility status (isolated, unit-testable)"
        objective: >
          Add a standalone module (e.g. artifacts/schedule_standings.py) with
          pure functions, no R2/DB-write concerns, taking schedule_grid rows
          as input and producing: (1) each team's overall record and
          conference record (tallying win/loss statuses, conference record
          restricted to conference_game=true rows); (2) for the current
          season, each team's conference-championship status
          (possible/eliminated/clinched) via the exact algorithm specified
          in key_decisions (the W_T/R_T/B_T/L_T counting method -- NOT a
          brute-force simulation), applied only to conferences confirmed to
          use a top-2-by-conference-win-total format with >= 4 members
          (blank/no-entry for every other conference, same as
          Independents); (3) each team's bowl-eligibility status
          (possible/eligible at 6+ wins/ineligible at 7+ losses) for the
          CFP 1st Round + Other Bowls slot. GUARDRAIL: this module must
          never be imported by or feed data into model/ or rankings_games
          -- it is a display-only computation over schedule_grid, entirely
          separate from T1's rating-model guard.
        assigned_domain: "data-engineer"
        owned_scope:
          - "artifacts/schedule_standings.py (new)"
        forbidden_scope:
          - "model/, rankings_games (no import, no shared code path -- this is a hard boundary, not just an unlikely one)"
          - "R2 publish, JSON shaping (T4b's job -- this module only returns Python data structures)"
        dependencies: ["T3"]
        parallelizable: false
        expected_validation:
          - "SYNTHETIC test required, not just live-data spot checks: hand-build a small fake conference (e.g. 4-5 teams with a fixed, fully-specified remaining schedule and known-by-hand correct possible/eliminated/clinched outcomes, including at least one case where two OTHER teams play each other) and confirm the function's output matches by hand. This is the real regression test for this algorithm -- live 2026 data in September cannot exercise the eliminated/clinched branches at all (nobody is out or in yet this early), so a live-only check would pass trivially even if the algorithm were broken."
          - "Confirm the eliminated test never fires a false positive against the synthetic scenario (a team it marks eliminated truly cannot reach top-2 under ANY remaining-game outcome, checked by hand/brute-force for the small synthetic case only, where brute-force is actually feasible at that scale)"
          - "Confirm the clinched test never fires a false positive against the synthetic scenario (a team it marks clinched truly cannot finish outside top-2 under ANY remaining-game outcome)"
          - "Confirm a conference not confirmed to use a top-2 format (or with too few members) gets no possible/eliminated/clinched entries at all for its teams, not a guessed status"
          - "Spot-check computed record/conf_record against known 2025 final standings"

      - id: "T4b"
        title: "Build and publish the schedule R2 artifact"
        objective: >
          Add artifacts/schedule.py (new module, following the same
          exception-safe/never-raise discipline as artifacts/r2.py, but with
          its own season-scoped key layout and index-builder -- not a
          literal reuse of rankings' per-week regex indexer) that queries
          schedule_grid, calls T4a's schedule_standings module for
          record/conf_record and the postseason status computations, and:
          (1) resolves each team's and each week's opponent's logo URL from
          teams.logos;
          (2) groups by the fixed conference order and sorts within
