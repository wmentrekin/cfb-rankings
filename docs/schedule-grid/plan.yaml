ordering_notes:
  - "Within B1: T1 (model guard) strictly before T2 (widen+backfill+recurring+games schema) strictly before T3 (view) strictly before T4a (standings/status computation) strictly before T4b (artifact assembly+publish) strictly before T5 (PR) strictly before T5b (confirm merge + trigger pipeline + verify artifact). T1 exists specifically because T2's backfill would otherwise corrupt the rankings model -- do not skip or reorder T1 after T2. T4a before T4b because T4b consumes T4a's output directly."
  - "T1/T2/T3 (migration + backfill) apply directly to the live Supabase project, not a database branch -- confirmed with the user: T1 is a read-path guard validated by before/after output comparison, and T2's backfill is additive-only with idempotent upserts, so the extra branch/merge overhead isn't warranted at this project's scale. Note DB changes are NOT gated by the git branch/PR the way code is -- running the migration/backfill during implementation takes effect on production immediately, independent of when the PR merges."
  - "STRUCTURALLY ENCODED after full-plan review (this was previously prose-only, a real gap): T5b sits between T5 and B2, and T6/T7 (and transitively T9/T10) now depend on T5b directly -- so the 'B1 must fully merge before B2 starts' rule and the 'manually trigger the pipeline post-merge' step are both real dependency-graph edges, not just ordering_notes prose an implementer could miss."
  - "Expect the 2026 postseason backfill (within T2) to return few or zero rows at first -- bowl/CFP matchups aren't determined by CFBD until conference championship week in December. This is expected, not a bug; the recurring weekly fetch (also T2) picks them up automatically once CFBD publishes them, and the frontend's neutral/blank cell styling already covers 'no data yet' for those columns."
  - "T8 (design mockup) has no code/data dependency and can start immediately (in parallel with B1 execution) -- the user asked to lock UI questions before making changes, and a mockup is the fastest way to do that without writing real code. (T8 is already complete as of this plan revision.)"
  - "T7 depends on T8 AND T5b (tokens should match the locked mockup's colors, not be guessed ahead of it, and personal-site code work waits for B1 merge like everything else in B2)."
  - "T9 depends on T6, T7, AND T8 -- fetch script, tokens, and the locked design must all be in place first (T5b is satisfied transitively via T6/T7)."

risks:
  - risk: "Without T1, widening postseason ingestion would silently corrupt the rankings model via model/process_data.py's season_type-blind query -- confirmed via plan review, not hypothetical."
    mitigation: "T1 is now a standalone, ordered-first task with its own before/after validation; T2's validation re-runs the same check after the backfill lands."
  - risk: "Postseason and regular-season week numbers may collide under a naive (season, team_id, week) key, corrupting the grid view."
    mitigation: "T3 explicitly keys by season_type/slot in addition to week, and validates no collisions occur."
  - risk: "The conference-standings sort heuristic (conference win% from games) won't match official/division-aware standings in all cases (e.g. head-to-head tiebreakers, divisional structures)."
    mitigation: "Documented as an explicit approximation in key_decisions; flagged to the user as a known limitation post-implementation, not silently presented as authoritative."
  - risk: "A single wide table for ~130 teams x ~18-20 columns, now also combining sticky header AND sticky first column (no precedent in this codebase), may have real rendering/perf/CSS issues, especially the sticky corner cell."
    mitigation: "The T8 mockup surfaces this before real implementation; T9's validation includes an explicit sticky-corner-cell check. If perf is bad at full scale, that's a finding for a follow-up pass, per the user's choice not to build collapse/expand for MVP."
  - risk: "CFBD's exact season_type/week labeling for conference championships vs. bowls vs. CFP rounds is not yet confirmed from the repo (only inferred from prior docs)."
    mitigation: "T2 explicitly calls out confirming this against the live CFBD API response before writing backfill logic; T3's grain design depends on getting this right."
  - risk: "2026 postseason matchups are mostly undetermined (playoff slots, bowl tie-ins depending on final standings) -- backfilling now will produce many TBD-opponent rows, not just TBD-score rows."
    mitigation: "T3's status model explicitly includes a 'tbd' status distinct from 'upcoming' (known opponent, not yet played), validated against real 2026 backfilled data."
  - risk: "Conference-championship clinch/elimination getting it wrong could show a team as 'eliminated' while still mathematically alive, or vice versa -- a visible, embarrassing false assertion (unlike the standings-sort approximation, which just misorders rather than asserting something false). RESOLVED to a concrete, deliberately conservative algorithm after plan review flagged the original description as asserted-not-specified (see key_decisions): the eliminated/clinched tests only ever rely on facts already banked (other teams' current wins) or independent per-team best/worst cases, never on jointly-infeasible 'everyone else loses' scenarios -- by construction they can under-report (show 'possible' a bit longer than a fully rigorous analysis would) but can never over-report (never falsely assert eliminated/clinched)."
    mitigation: "T4a is now a standalone task with mandatory SYNTHETIC test validation (a hand-built small conference scenario, since live September 2026 data can't exercise these branches at all) -- this is the real regression test, not just a live-data sanity check. The algorithm's conservative-by-construction property is itself the safety mechanism against false assertions; its known tradeoff (occasional under-reporting) is documented, not hidden."
  - risk: "CFBD's postseason data may not cleanly separate 'regular bowl games' from 'CFP first round' by date/round, or may not expose a usable game-name field for past bowls."
    mitigation: "Substantially de-risked by platform research (see key_decisions' CFBD postseason data research): CFBD's /games response has a confirmed `playoff` object with `bowl_name`/`round_name`/`round_order`/`bracket_slot` for CFP games, plus a separate /playoffs/cfp/games endpoint with the same fields -- real structured data, not date inference. The remaining open item is narrower and empirical: whether `notes` reliably carries real names for non-CFP bowls specifically, which T2 must verify against live 2025 data and has an explicit documented fallback (generic label) if not."
