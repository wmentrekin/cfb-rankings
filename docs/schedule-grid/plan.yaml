  loop_count: 2
  notes:
    - "Pass 1 (reviewer) requested changes: (1) T1's original forbidden_scope excluded model/, but model/process_data.py's games query has no season_type filter, so the postseason backfill would silently leak into the rankings model, reversing a previously confirmed non-goal -- fixed by adding a new, ordered-first T1 task scoped narrowly to the guard. (2) Original plan only backfilled postseason once, leaving 2026 Bowl/CFP columns permanently stale -- fixed by adding a recurring weekly postseason fetch to T2. (3) View grain (season, team_id, week) risked collisions between regular and postseason week numbers -- fixed by keying on season_type/slot too, in T3. (4) Minor wording fixes applied: T4's index-builder is new/parallel logic not literal reuse; T9 acknowledges the sticky-header+sticky-column intersection is new work, not scaled-up reuse; T7's theme validation simplified (single dark theme, confirmed, not conditional)."
    - "Plan.yaml's prior open_questions were resolved directly by the user: B2 code work waits strictly for B1 merge (not staging); a design mockup (T8) is wanted before B2 implementation; page placement is now a tabbed toggle on the existing rankings page (tentative, to be locked via the T8 mockup)."
    - "Pass 2 (reviewer, focused on the newly-added postseason column model) requested changes: (1) the JSON contract's status enum was missing 'clinched' despite key_decisions describing it as a required third state -- fixed by adding it as its own status value, explicitly distinguished from 'tbd'. (2) T9 had no rendering spec at all for the clinching team's own 'vs TBD' cell -- fixed. (3) The clinch/elimination algorithm was asserted ('a real algorithm exists') without being specified, including an unacknowledged classic subtlety (other teams' remaining games against each other make naive 'everyone else loses' scenarios jointly infeasible) -- fixed by replacing the vague description with a concrete, deliberately conservative counting algorithm (documented in key_decisions) that only relies on already-banked facts or independent per-team best/worst cases, so it can under-report but never falsely assert eliminated/clinched; explicit fallback added for conferences not confirmed to use a top-2 format (blank, not guessed). (4) T4's validation for this piece could pass trivially since live September 2026 data never exercises the eliminated/clinched branches -- fixed by requiring a synthetic hand-built test scenario. Also split the oversized T4 into T4a (standings/status computation, isolated and unit-testable) and T4b (artifact assembly/publish, consumes T4a's output) per the reviewer's task-sizing finding, and added an explicit guardrail that T4a must never feed into model/ or rankings_games."
    - "Between pass 2 and pass 3: user requested platform research into what CFBD's API actually exposes for postseason/bowl games, to see if real bowl names/logos could be ingested now instead of deferred. Findings folded in: CFBD's /games response has a confirmed `notes` field and a structured `playoff` object (bowl_name/round_name/round_order/bracket_slot) for CFP games, plus a separate /playoffs/cfp/games endpoint with the same fields -- real, ingestable now, and a better source for CFP-round column bucketing than the originally-planned date inference. Bowl/sponsor logos are confirmed to not exist anywhere in CFBD's schema at all (permanent gap, not a timing one) -- team logos remain the only logo source. T2/T3/T4b updated accordingly; a small first schema change to the bronze `games` table (nullable columns) was added to T2 to persist this."
    - "User also renamed the postseason columns from 'Bowl Week 1-4' to 'CFP 1st Round + Other Bowls' / 'CFP Quarterfinals' / 'CFP Semifinals' / 'CFP National Championship' -- label-only change, applied throughout."
    - "Loop cap note: this is the 2nd correction cycle (pass 1 fixes, pass 2 fixes) -- at the workflow's stated max of 2. A pass-3 (full-plan) review is planned next per the user's explicit request. If pass 3 requests further substantive changes, the orchestrator will stop and bring findings to the user for direction rather than auto-looping a 3rd correction cycle."

