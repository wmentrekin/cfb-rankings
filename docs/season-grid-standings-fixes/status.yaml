objective: >
  Fix seven user-reported defects in the published 2025 season grid: three phantom/misplaced
  columns and an inert champion sort (all caused by CFBD flipping conference_game to false on
  conference championship games), a new standings ordering contract (champion, then CCG loser,
  then conference record with tiebreaks, with postseason results excluded from placement), a
  split-head-to-head tiebreak bug, and two frontend presentation refinements (tooltip overflow
  direction, bowl short-name form).

