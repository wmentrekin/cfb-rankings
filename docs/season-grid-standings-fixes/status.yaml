      `notes` is already exposed by the schedule_grid view (confirmed via pg_get_viewdef), so a
      notes-based championship-game signal needs no migration.
    evidence: "pg_get_viewdef('schedule_grid') lists `notes` in both the home and away branches."
  - id: "D2"
    decision: >
      Root cause of issues 1-3 is a single upstream data change, not three rendering bugs: CFBD
      now reports conferenceGame=false on conference championship games and populates
      notes='<Conference> Championship'. All nine 2025 CCGs carry the new shape; seasons
      2014-2024 carry the old one (notes NULL on every row).
    evidence: "Live queries against Supabase project oyqgmbgwohlnrxodvilt."
  - id: "D3"
    decision: >
      Issue 7 is an independent defect: _head_to_head_winner (artifacts/schedule.py:911) returns
      on the first matching row with no tally, so a split series is decided by row order.
    evidence: "Washington State and Oregon State met twice in 2025 and split 1-1."

