artifact: requirements
feature: "season-grid-standings-fixes"
mode: "bounded-feature"
status: ready
owner_skill: work

summary:
  problem: >
    Seven defects in the published 2025 Season Grid. Three phantom/misplaced columns and an inert
    champion sort share ONE root cause -- CFBD changed its data model so conference championship
    games now arrive with conference_game=false and notes='<Conference> Championship', which makes
    identify_conference_championship_games identify nothing for 2025. Two further defects are an
    ordering contract that does not yet exist (CCG-loser tier; postseason excluded from placement)
    and a split-head-to-head tiebreak decided by row iteration order. Two are presentation.
  motivation: >
    The 2025 grid is on an unmerged preview the user is verifying before it reaches the live site.
  requested_outcome: >
    All seven fixed, verified by the user on the preview build before merge.

goals:
  - "Identify conference championship games correctly under BOTH CFBD data shapes."
  - "Order each conference: champion, CCG loser, then conference record with tiebreaks."
  - "Exclude bowl/playoff results from standings PLACEMENT without changing displayed records."
  - "Make a split head-to-head series a wash instead of a row-order accident."
  - "Show bowl names with neither sponsor nor the word 'Bowl' in the cell; full name in the hover."
  - "Stop the last column's tooltip from extending the grid's scrollable width."

non_goals:
  - "Backfilling the missing 2025 Army-Navy game (a real data gap, separately tracked)."
  - "Re-ingesting seasons 2014-2024 into the new CFBD shape."
  - "Changing the DISPLAYED overall or conference record of any team."
  - "Re-verifying the clinch/eliminate (R_T/B_T) math against the new conference_game flag."
  - "Fixing the pre-existing em-dash/en-dash server/client mismatch (filed separately)."

constraints:
  technical:
    - "No database migration: schedule_grid already exposes `notes` (verified via pg_get_viewdef)."
    - "The frontend render logic is duplicated (ScheduleGrid.astro server-side, index.astro client-side). Any RENDER change must be hand-mirrored in both; CSS must stay is:global."
    - "Old-shape seasons (notes NULL on every row, 2014-2024) must behave exactly as they do today."
    - "Displayed record and conf_record fields must not change value."
  product:
    - "User-facing cell text loses the word 'Bowl'; the untruncated name stays reachable on hover and via aria-label."
  process:
    - "Feature branch + PR in both repos. Never commit to main."
    - "Independent code review before handoff. Agents never merge."
    - "Subagents must never touch the live DB or R2, and must not seek credentials."

assumptions:
  - id: "A1"
    text: "CFBD will keep emitting notes='<Conference> Championship' for future seasons. If it changes, a prefix mismatch logs a warning and falls through to the structural rule -- the safe direction."
  - id: "A2"
    text: >
      The 2025 `ratings` table stops at week 15 (verified: weeks 1-15 only, no postseason rows), so
      the rank used as a tiebreak reflects regular season + conference championships and excludes
      bowls/playoffs. If a future run ever rates postseason weeks, the rank tiebreak would silently
      begin including playoff results -- documented in code as a known assumption, not guarded.
  - id: "A3"
    text: "The 19 uncurated bowl root names added in T3 are established names, not inferences."

repository_sync:
  source: "docs/season-grid-standings-fixes/status.yaml"
  repositories_confirmed:
    - "/home/user/cfb-rankings (current)"
    - "/home/user/personal-site (comparison_only)"
  accepted_unverified_states: []

repo_context:
  relevant_paths:
    - "artifacts/schedule.py"
    - "artifacts/bowl_names.py"
    - "artifacts/schedule_standings.py"
    - "tests/test_conference_championship_records.py"
    - "tests/test_championship_diversion_scope.py"
    - "tests/test_postseason_slots.py"
    - "tests/test_conference_sort_and_pac12.py"
    - "personal-site: src/components/ScheduleGrid.astro"
    - "personal-site: src/pages/projects/cfb-rankings/index.astro"
  systems_in_scope: ["season schedule artifact builder", "season grid frontend"]
  prior_artifacts:
    - "personal-site PR #24 (open) -- frontend fixes land as commits on its branch"

research:
  repo_findings:
    - id: "F1"
      finding: >
        _exclude_championship_games_from_conf_records already guards on conference_game=true
        (artifacts/schedule.py:1079). Its own docstring calls this "cheap insurance ... if that
        upstream invariant is ever loosened without this function being revisited" -- which is
        exactly what T1 does. Verified directly: no double-subtraction is possible. Georgia stays
        7-1, Alabama stays 7-1.
    - id: "F2"
      finding: >
        A schedule_grid row CANNOT see its opponent's conference (`conference` is the row's own
        team only, per the view definition), so "same-conference pairing" would need a cross-row
        game_id join that does not exist in this module. It would also readmit the 2026 Pac-12
        flex-week games, documented in-code as conference_game=false same-conference pairings that
        are NOT title games. Notes matching is strictly better.
    - id: "F3"
      finding: >
        With the champion fix alone, the SEC orders Georgia, Ole Miss, Texas A&M, Alabama(4th).
        Alabama's placement pct is .833 vs .917 for Ole Miss and Texas A&M under ANY fair exclusion
        rule -- no percentage can produce the requested order. The explicit CCG-loser tier is
        load-bearing.
    - id: "F4"
      finding: >
        Every game contributes TWO team-perspective rows sharing one game_id. A naive tally of all
        matching rows would read a single meeting as a 2-0 sweep. The head-to-head fix must filter
        to one team's perspective before tallying.
    - id: "F5"
      finding: >
        Only 16 of 35 ordinary 2025 bowls are in _ROOT_NAMES; 19 pass through as full sponsor
        names. A minimal strip-only change would fix under half the season.
    - id: "F6"
      finding: >
        The tooltip is position:absolute, left:0, max-width:11rem inside a 6rem fixed-layout
        column, in a shell with overflow:auto. On the last column its rightward growth has no
        columns to absorb it, so it enlarges the shell's scrollWidth. A single
        `td:last-child ... {left:auto; right:0}` rule fixes both render paths, because the CSS is
        is:global and the client-rebuilt DOM uses identical class names -- the only change here
        that needs no hand-mirroring.
    - id: "F7"
      finding: >
        team_ranks already reaches build_schedule_payload and every entry already carries `rank`
        (artifacts/schedule.py:1280). 2025 ranks come from week 15 -- regular season + CCGs, no
        postseason. Ole Miss #6, Texas A&M #8.
  platform_findings: []

acceptance_criteria:
  - id: "AC1"
    text: "For 2025, all nine conference championship games are identified and diverted into the Conference Championship column. No week-15 column holding them, no phantom CCG column of bare statuses, no empty week-17 column."
  - id: "AC2"
    text: "Seasons with notes=NULL on every row (2014-2024) identify exactly the same games as they do today. Pinned by the existing structural-rule tests passing unmodified."
  - id: "AC3"
    text: "2025 SEC order is Georgia, Alabama, Ole Miss, Texas A&M, then the 6-2 teams. Georgia's and Alabama's DISPLAYED conf_record both remain 7-1 and their displayed overall records remain 12-2 and 11-4."
  - id: "AC4"
    text: "_head_to_head_winner returns None for a 1-1 split and for a 2-2 split, the winner for a sweep, the winner for a single meeting (counted once, not twice), and None for no meeting."
  - id: "AC5"
    text: "2025 Pac-12 order is Washington State, then Oregon State."
  - id: "AC6"
    text: "Every one of the 43 distinct 2025 postseason game names renders a cell string with no sponsor and no trailing 'Bowl'. 'College Football Playoff National Championship Presented by AT&T' renders 'National Championship', never 'National'. No name renders empty."
  - id: "AC7"
    text: "The full untruncated game name still reaches the hover and the aria-label in both render paths."
  - id: "AC8"
    text: "Hovering or focusing the last column's game name does not change the grid shell's scrollWidth. Interior columns are visually unchanged."
  - id: "AC9"
    text: "A regular-season row whose notes ends with 'Championship' but whose prefix does not resolve to that row's own conference logs a warning and falls through to the structural rule, identifying nothing from that row."

open_questions:
  - id: "Q1"
    text: "Should _ROOT_NAMES curation for the 19 uncurated bowls be in this PR or deferred?"
    resolution: "In this PR -- a half-applied rule is worse than none. Raised to the user at the checkpoint."

ready_for_planning: true
planning_blockers: []
