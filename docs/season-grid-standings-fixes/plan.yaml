  - "T4 runs last."

risks:
  - id: "R1"
    risk: "Bypassing the member-count and bucket-isolation gates on a notes match removes the safeguards that stopped the 2025 two-team Pac-12 from being crowned."
    mitigation: "Those gates guard an INFERENTIAL rule. A notes label is authoritative. The 2025 Pac-12 has no notes row at all, so it is unaffected -- pin that with a test."
  - id: "R2"
    risk: "The rank tiebreak would silently start including playoff results if a future run ever rates postseason weeks."
    mitigation: "Documented as assumption A2 in code. Not guarded -- guarding needs a season_type the ratings table does not carry."
  - id: "R3"
    risk: "Curating 19 bowl roots is the largest single surface here and is exactly the shape of error made twice already this session."
    mitigation: "T3 must emit the complete 43-name input->output table and a test pinning it, before the change is accepted."
  - id: "R4"
    risk: "Stripped names like 'Sun', 'Cure', 'Rate' and 'Texas' read oddly out of context."
    mitigation: "Explicitly what the user asked for; the full name stays in the hover. Surfaced at the checkpoint."

