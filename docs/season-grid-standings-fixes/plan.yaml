artifact: plan
feature: "season-grid-standings-fixes"
mode: "bounded-feature"
status: ready
owner_skill: work
based_on: "docs/season-grid-standings-fixes/requirements.yaml"

objective: >
  Fix the seven 2025 Season Grid defects: restore championship-game identification under CFBD's
  new data shape, introduce the champion/CCG-loser/record ordering contract with postseason
  excluded from placement, make a split head-to-head a wash, shorten bowl names, and stop the last
  column's tooltip from widening the grid.

approach:
  summary: >
    Five bounded tasks. T1 and T2 both edit artifacts/schedule.py and are therefore STRICTLY
    SEQUENTIAL on one branch -- T2 consumes the identification output T1 produces. T3 (bowl_names)
    and T5 (personal-site CSS) touch disjoint files and run in parallel with them. T4 is the test
    pass. No worktrees: only one task pair is parallelizable and they are single-file each, so the
    coordination cost exceeds the benefit.
  key_decisions:
    - id: "K1"
      decision: >
        Notes matching is an ADDITIONAL higher-priority signal, not a replacement. A row matches
        when season_type=='regular', notes ends with 'Championship', and the stripped prefix
        resolves (via an alias map) to that row's OWN conference. On a match the conference_game
        gate, the member-count gate and the bucket-isolation rule are all bypassed, because the
        label is authoritative where those structural heuristics are only inferential. The
        Army-Navy carve-out and qualifying-conference gate still apply.
    - id: "K2"
      decision: >
        A notes value ending in 'Championship' whose prefix does NOT resolve to the row's
        conference logs a warning and is ignored, falling through to the structural rule. This is
        how a future CFBD naming change (e.g. the Pac-12, whose CCG string nobody has seen)
        becomes a visible log line instead of a silent miss.
    - id: "K3"
      decision: >
        Alias map lives in schedule.py beside the function that uses it -- it is an identification
        concern, not a standings-format one. Contents: {'American': 'American Athletic',
        'MAC': 'Mid-American'}. The other seven 2025 conferences match by plain equality.
    - id: "K4"
      decision: >
        Add _resolve_conference_championship_outcomes returning (champions, losers); keep
        _resolve_conference_champions as a thin wrapper over it. This avoids breaking
        test_resolve_conference_champions_warns_on_a_shared_game_id_collision, which calls it
        directly and asserts a plain dict.
    - id: "K5"
      decision: >
        Keep _is_champion and add _is_ccg_loser as separate entry flags; derive an internal _tier
        (2/1/0) from both with .get(..., False) defaults. Hand-built entries in existing tests set
        only _is_champion and keep sorting exactly as before. The grouping/equality predicate for
        the head-to-head swap keys on _tier instead of _is_champion -- both tiers are singleton per
        conference by construction, so the swap can never touch them.
    - id: "K6"
      decision: >
        _placement_pct excludes BOTH season_type=='postseason' rows AND rows whose game_id is in
        champ_game_ids. Displayed `record` is untouched. Does not modify compute_team_records.
    - id: "K7"
      decision: >
        Final tiebreak is the team's own model rank (already on every entry as `rank`), ascending,
        with a large sentinel for null so unranked teams fall last, then team name. USER-CHOSEN.
        Valid because 2025 ratings stop at week 15 -- no postseason weeks exist -- so the rank
        excludes bowls and playoffs. Assumption A2 documents the fragility.
    - id: "K8"
      decision: >
        _head_to_head_winner filters to team_a's OWN perspective rows before tallying, so a single
        meeting counts once rather than twice. Returns None on any tie including 0-0.
    - id: "K9"
      decision: >
        The 'Bowl' strip applies only to a resolved _ROOT_NAMES match, never to an unmatched
        pass-through and never to an _OVERRIDES result. _ROOT_NAMES is expanded to cover the 19
        uncurated 2025 bowls in the same pass, because a rule applied to under half a season is
        worse than no rule. A guard rejects any strip that would produce an empty string.
    - id: "K10"
      decision: >
        Issue 5 is one CSS rule keyed on td:last-child, not a render-time modifier class. This is
        the only change in the feature that does NOT need hand-mirroring into index.astro, because
        the tooltip CSS is is:global and defined once.

contracts:
  interfaces:
    - "identify_conference_championship_games(rows, season, qualifying_conferences=None) -> Dict[conference, game_id]  # signature unchanged"
    - "_resolve_conference_championship_outcomes(champ_games_by_conf, rows, season) -> Tuple[Dict[conf, team], Dict[conf, team]]  # new"
    - "_resolve_conference_champions(...) -> Dict[conf, team]  # unchanged, now a wrapper"
    - "_head_to_head_winner(rows, season, team_a, team_b) -> Optional[str]  # signature unchanged, semantics fixed"
    - "short_bowl_name(name: Optional[str]) -> Optional[str]  # signature unchanged, output shortened"
  schemas:
    - "No DB migration. schedule_grid already exposes notes."
    - "Published payload: entry gains no new public field. _is_ccg_loser/_tier/_placement_pct are scratch keys stripped before publish, exactly like _is_champion."
  config_changes: []

