artifact: status
feature: "supabase-free-tier-audit"
mode: "bounded-feature"
stage: "execution"
owner_skill: work

objective: >
  Investigate why both cfb-rankings and nba-asset-lineage (each with an
  existing 3-day db-keepalive.yml) still received Supabase "insufficient
  activity, may pause within 7 days" warnings, explain the 5-7 connections
  shown on the dashboard, and add free-tier backups (neither project had
  any). Promoted from investigation to bounded-feature after the user
  approved two specific fixes at the checkpoint: daily keepalive cadence and
  a weekly Supabase CLI dump uploaded as a GitHub Actions artifact.

summary:
  current_focus: "Both fixes implemented on work/supabase-free-tier-audit; opening PR."
  last_completed: "db-keepalive.yml cron changed from every-3-days to daily; new db-backup.yml added (weekly supabase db dump via session pooler, uploaded as a 90-day-retention artifact)."
  current_blocker: ""

