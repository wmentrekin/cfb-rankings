blockers: []
decisions:
  - "Root cause of the pause warning despite a working 3-day keepalive: Supabase's own docs say activity 'each day' over the week is what keeps a project from being flagged, not just any ping within 7 days -- so cadence was tightened to daily rather than changing the query/connection method."
  - "5-7 connections on the dashboard confirmed as normal baseline platform overhead (Storage/PostgREST/health-checker persistent connections per Supabase docs), not leaked app connections -- audited every create_engine/connect call site in this repo and all already use context managers + engine.dispose()."
  - "Backup dump uses the session pooler (port 5432) instead of the transaction pooler (6543) that db-keepalive already uses, because pg_dump-based tools (which `supabase db dump` wraps) need session-level features that transaction-mode pooling doesn't support."
  - "Backups stored as GitHub Actions artifacts (90-day retention) per user's choice at the checkpoint -- no new secrets, accounts, or infra needed; reuses the existing discrete DB_HOST/DB_NAME/DB_USER/DB_PASSWORD secrets with the port overridden to 5432 for this workflow only."

