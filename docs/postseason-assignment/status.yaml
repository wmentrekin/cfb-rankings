loops:
  planning_review:
    count: 2
    max: 2
  execution_verification:
    count: 0
    max: 2

checkpoint:
  pre_execution_required: true
  pre_execution_status: pending
  options:
    - proceed
    - revise_plan
    - narrow_scope
    - stop

blockers:
  - "WebSearch quota: subagents reported 200/200 mid-task; the main session still searches, so quota appears per-agent — fresh agents spawned with a 25-search budget each"
  - "outbound page fetches blocked by the environment network policy"
decisions:
  - "Outbound page fetches are blocked in this sandbox (verified with curl); external facts are search-snippet corroborated and tagged provisional until the owner supplies primary texts."
  - "Notre Dame top-12 guarantee is a real 2026 rule (2024 MOU); the owner's encoding is the default."
  - "Mode is investigation with requirements.yaml + a draft plan.yaml, because the user asked for research and planning only; promote to large-initiative when build work starts."
  - "Assignment engine is a pure function of an end-state; the 'what state to feed it' question (if-ended-today vs simulated) is deferred and out of scope for the engine itself."
  - "Subagents are read-only, never execute against the live database or R2, and never seek credentials."

