artifact: requirements
feature: "clinch-h2h-and-ccg-ingest"
mode: "bounded-feature"
status: ready
summary:
  problem: >
    The 2026 Season Grid shows Pac-12 week 13 as TBD although the flex matchups are announced, shows
    Wake Forest and San Diego State as still "possible" although both have clinched title-game
    berths, and has no title-game rows although CFBD already lists three of them.
  requested_outcome: >
    Pac-12 week 13 games on the grid (not counted in conference record); clinched berths shown for
    Miami, Wake Forest, Boise State, San Diego State, Jacksonville State, Liberty, Georgia; a title
    game appears once it exists in the API.
goals:
  - "G1 ingest 2026 week 13 (4 new Pac-12 flex games) and week 14 (3 title games), republish, rebuild site"
  - "G2 head-to-head clinch rule in compute_conference_championship_status"
  - "G3 when top_n teams of a pool are clinched, every other team in the pool is eliminated"
  - "G4 weekly run ingests later regular-season weeks so new/rescheduled games arrive without a manual backfill"
non_goals:
  - "a hand-maintained clinched-teams list"
  - "multi-team tiebreak scenarios or any simulation of remaining games"
  - "personal-site changes (2025 grid sizing is a separate follow-up)"
  - "fixing a same-weekend reschedule of a target-week game (the Ole Miss-Oklahoma case)"
constraints:
  technical:
    - "clinch must never over-report: the new rule only fires when the tie it resolves is provably a two-team tie"
    - "pure functions, plain dicts; no new dependencies"
    - "the extra ingest must not gate or delay-fail the run: best effort, logged"
  process:
    - "feature branch + PR, independent review, agents never merge; subagents never touch the live DB or R2"
research:
  repo_findings:
    - "FLEX_WEEK_TBD_CONFIG already anticipates the flex week; tbd cells self-clear once a real row exists"
    - "identify_conference_championship_games resolves a title game from notes ending in 'Championship' (authoritative path)"
    - "clinch math counts wins only: T clinched iff #{i: B_i >= L_T} <= top_n-1; no tiebreaker is modelled"
    - "every configured conference's first two-team tiebreak step is head_to_head (conference_tiebreakers.json)"
    - "weekly run ingests only the target week, so week 13/14 rows never arrive before they are played"
  platform_findings:
    - "CFBD week 13: 69 games, 4 new, all Pac-12 flex, conference_game=False (Boise St @ Colorado St, San Diego St @ Washington St, Texas St @ Utah St, Oregon St @ Fresno St)"
    - "CFBD week 14: 3 new games with notes 'Conference USA Championship' (Jacksonville St @ Liberty), 'Pac-12 Championship' (San Diego St @ Boise St), 'ACC Championship' (Wake Forest @ Miami), conference_game=False"
    - "live standings (read-only query): current math already clinches Miami, Liberty, Jacksonville St, Boise St, Georgia. Wake Forest (7-1, 1 left) and San Diego St (5-2, done) are 'possible' only because Louisville (7-2, done) and Texas St (5-2, done) can tie them; Wake beat Louisville and SDSU beat Texas St"
acceptance_criteria:
  - "AC1 fixture mirroring the live ACC and Pac-12 standings: Wake Forest and San Diego State clinched; Louisville and Texas State eliminated"
  - "AC2 rule does NOT fire when a third team could finish on the same win total, when the head-to-head was lost/not played/split, when the rival can pass (B_i > L_T), or when the two teams' total conference game counts differ"
  - "AC3 every existing test still passes; statuses for 2025 fixtures unchanged"
  - "AC4 a failed upcoming-weeks fetch leaves the run green and publishes normally"
  - "AC5 after the data steps the published 2026 grid shows the four flex games and three title games"
open_questions:
  - "OQ1 should the 2025 grid sizing be handled next in personal-site, and on main or on the design-system branch?"
ready_for_planning: true
