# Contract: durable execution plan created by $work when the selected mode needs explicit planning

artifact: plan
feature: "season-grid-touchups"
mode: "large-initiative"
status: draft
owner_skill: work
based_on: "docs/season-grid-touchups/requirements.yaml"

objective: >
  Act on 12 items of live-use feedback across two repos, sequenced so each step
  is verifiable before the next builds on it: a user-performed Cloudflare
  dashboard change (so previews render real data), then a backend PR fixing
  artifact/week correctness, then a frontend PR for density, layout, and labels.

approach:
  summary: >
    Three steps, in order. STEP 0 is a user action, not a PR -- discovery
    established that personal-site has no in-repo deploy config, so Preview-scoped
    R2 env vars can only be set in the Cloudflare dashboard. STEP 1 (B1) is a
    cfb-rankings PR fixing the week boundary, the phantom empty column, the
    mid-season championship prediction, and the column labels. A pipeline run
    must land between B1's merge and B2's review, since the frontend renders
    whatever the artifact says. STEP 2 (B2) is a personal-site PR for the visual
    work: fixed control layout, per-tab season dropdowns, a much denser table,
    the new cell format, neutral-site handling, and status label mapping.
  key_decisions:
    - >
      DIAGNOSIS DRIVING B1 (from discovery, evidence in requirements.yaml): the
      empty "Week 15" and the missing "Week 14" have DIFFERENT causes. Week 15 is
      the diversion bug -- the Army-Navy game is the only 2026 row in that bucket,
      build_canonical_columns() creates the column from it, then _classify_row_slot()
      diverts that same row into the dedicated Army-Navy slot, leaving a column no
      team can fill. Week 14 is NOT a bug -- there are zero games in the Dec 1-11
      window because 2026's conference-championship matchups don't exist yet, so
      nothing maps to bucket 14.
    - >
      CONSEQUENCE: the user's requested renames resolve both complaints without
      inventing anything. The Conference Championship slot is already a fixed
      column that always exists, so labeling it "Week 14 (CCG)" fills the gap the
      user perceived as a missing week. The Army-Navy column IS week 15, so
      labeling it "Week 15" and dropping the phantom empty column resolves that
      side. Verified the labels match the week math: with the shifted boundary a
      Dec 5 championship game buckets to 14 and Dec 12 Army-Navy buckets to 15.
    - >
      CONFERENCE-CHAMPIONSHIP IDENTIFICATION must switch from a "latest conference
      game" heuristic to a POSITIVE signal. The current rule has no notion of
      whether a championship game exists; with none present it falls back to
      rivalry week, where six ACC games share an identical start_date, and the
      alphabetical tie-break yields the bogus "Wake Forest vs Duke" the user saw.
      New rule: a conference-championship game is the LONE conference game
      occupying a week bucket by itself, strictly later than the bucket holding
      that conference's regular slate. Six games tied in one bucket is emphatically
      not "lone", so an in-progress season correctly identifies nothing. Must still
      identify every real title game on completed 2024/2025 data -- that is the
      regression bar.
    - >
      get_cfb_week() BOUNDARY shifts one day so weeks run Tue->Mon and Monday games
      group with the preceding weekend. User chose global scope. De-risked: the
      rating model reads CFBD's own games.week column (WHERE week <= N), so model
      inputs do not change -- this affects the auto-computed pipeline week and
      Season Grid bucketing only. Verified no collateral movement on the dates that
      matter: Sept 7 Monday moves 2->1 (the FSU/SMU fix), Army-Navy stays 15, a
      Dec 5 CCG stays 14.
    - >
      LABEL OWNERSHIP SPLIT. Column labels (the `label` field: "Week 14 (CCG)",
      "Week 15", "Bowls") live in the ARTIFACT -- one source of truth, and the
      frontend already renders `label` directly. Status DISPLAY strings live in the
      FRONTEND, because the same status value renders differently per column:
      status='possible' reads "Still in the Hunt" in the championship column but
      "Not Yet Eligible" in the Bowls column. So the frontend maps (status, slot)
      -> display text; the artifact's status enum is unchanged.
    - >
      DROPPED: the "possible vs {conditional_opponent}" rendering. The user's four
      specified championship states don't include it and it was only ever a
      projection. The artifact may keep emitting conditional_opponent; the frontend
      stops rendering it.
    - >
      Real championship games still render for conferences NOT in the qualifying
      top-2-format list (e.g. Sun Belt) once genuinely determined -- only the
      COMPUTED statuses stay gated to confirmed-format conferences. Otherwise Sun
      Belt teams would show blank even after their title game is played.
    - >
      PROCESS: every PR gets an independent reviewer pass before handoff, and the
      tester runs where anything is executable. Findings post as real PR review
      comments. The previous pass ran four reviews on the plan and zero on the
      code; that imbalance is the direct cause of the bugs this pass is fixing.

contracts:
  interfaces:
    - >
      Artifact JSON shape is UNCHANGED except column `label` values. Fields
      (season, generated_at_utc, conferences[].name/teams[].{team, logo_url,
      record, conf_record, weeks[]}) and the status enum
      (win/loss/bye/upcoming/tbd/possible/eliminated/clinched/eligible/ineligible)
      all stay as-is, so the frontend needs no shape migration.
    - >
      Column label changes: "Conference Championship" -> "Week 14 (CCG)";
      "Army-Navy Game Week" -> "Week 15"; "CFP 1st Round + Other Bowls" -> "Bowls".
      slot_id values stay stable (conf-championship, army-navy, cfp-r1-bowls) so
      nothing keyed on slot_id breaks.
    - >
      Frontend (status, slot_id) -> display text map: possible+conf-championship ->
      "Still in the Hunt"; clinched -> "Clinched"; eliminated -> "Eliminated";
      possible+cfp-r1-bowls -> "Not Yet Eligible"; eligible -> "Eligible";
      ineligible -> "Ineligible".
  schemas: []
  config_changes:
    - "No repo config change for the Cloudflare preview fix -- dashboard-only, user action (STEP 0)."

real_data_targets:
  production_site: "https://personal-site-6ja.pages.dev/"
  schedule_artifact: "https://personal-site-6ja.pages.dev/data/cfb/schedule/2026/latest.json"
  note: >
    The live production build bundles the fetched artifacts under /data/cfb/, so
    the current artifact can be read without R2 credentials. Use it to validate
    B1's output shape against what the frontend actually receives, and as B2's
    fixture for density/cell-format work. Preview deployments will serve the same
    paths once B0 is done.

branching:
  strategy: "branch-per-repo, same name in each"
  branch_name: "work/season-grid-touchups"
  worktrees: []
  note: >
    Both branches already created (before any artifact was written). Deliberate,
    user-directed deviation from the workflow's "one integration PR per feature":
    two PRs, one per repo, sequenced rather than combined, so the backend is
    verifiable before the frontend depends on it.

execution_batches:
  - id: "B0"
    goal: "User-performed Cloudflare dashboard change so PR previews render real data"
    tasks:
      - id: "T0"
        repo: "n/a -- Cloudflare dashboard"
        title: "Add the four R2 env vars to the Preview environment scope"
        objective: >
          USER ACTION, not an agent task. Pages project -> Settings -> Environment
          variables -> Preview -> add R2_ACCOUNT_ID, R2_ACCESS_KEY_ID_READONLY,
          R2_SECRET_ACCESS_KEY_READONLY, R2_BUCKET_NAME (same values as Production;
          mark the two credentials encrypted), then push a commit to a PR branch or
          hit Retry deployment to trigger a fresh preview build. Recommend first
          confirming forked-PR builds are disabled under Settings -> Builds &
          deployments, since Cloudflare exposes Preview-scoped vars to fork builds.
          Caveat: if the Production values were saved encrypted they cannot be read
          back -- either retrieve the originals or mint a fresh read-only R2 token.
        assigned_domain: "user"
        owned_scope: []
        forbidden_scope: []
        dependencies: []
        parallelizable: true
        expected_validation:
          - "A preview deployment's /projects/cfb-rankings renders real Rankings and Season Grid data instead of the empty states"

  - id: "B1"
    goal: "cfb-rankings: artifact and week correctness"
    tasks:
      - id: "T1"
        repo: "wmentrekin/cfb-rankings"
        title: "Shift get_cfb_week()'s week boundary one day so Monday games group with the preceding weekend"
        objective: >
          Change utils.get_cfb_week()'s season-start anchor so weeks run Tue->Mon
          rather than Mon->Sun. Global change per the user's explicit decision.
          Do NOT change the function's signature or its 0..16 clamp. Add a comment
          explaining the boundary and why (CFB weeks span Tue-Mon in practice:
          Week 0 is Saturday-only, Week 1 ran Thu-Mon, later weeks run Tue/Thu-Sat).
        assigned_domain: "data-engineer"
        owned_scope:
          - "utils.py (get_cfb_week only)"
        forbidden_scope:
          - "main.py's week handling, model/, artifacts/ -- callers stay as-is"
        dependencies: []
        parallelizable: false
        expected_validation:
          - "get_cfb_week(2026-09-07) returns 1, not 2 (the FSU/SMU Monday game)"
          - "get_cfb_week(2026-08-29) still returns 0 (Week 0 Saturday)"
          - "get_cfb_week(2026-12-12) still returns 15 (Army-Navy) and a 2026-12-05 date returns 14 -- the labels B1/T4 applies depend on this"
          - "Spot-check across 2024/2025 real game dates that no game moves into a week that contradicts its raw CFBD week grouping in a way that would surprise a reader"
      - id: "T1b"
        repo: "wmentrekin/cfb-rankings"
        title: "Derive the pipeline's week from the last COMPLETED week rather than the week containing today"
        objective: >
          User decision: include this ("lets include it it doesnt hurt"). Today
          main.py labels a run with get_cfb_week(today), which is correct only
          because the cron happens to fire on a Sunday -- a day that falls inside
          the week whose games just finished. Any run that slips past a week
          boundary (the exact situation PR #8 hand-pinned with --week 1) mislabels
          the rankings. Replace the date-only derivation with a data-driven one:
          the target week is the greatest CFBD `week` in the season for which every
          scheduled game has already started (plus a completion buffer), falling
          back to get_cfb_week(today) if the season has no games yet. The explicit
          --week override must continue to win over both. Keep this change confined
          to how main.py CHOOSES a week -- do not alter what the model does with it
          (it still queries rankings_games WHERE week <= N on CFBD's raw week).
        assigned_domain: "data-engineer"
        owned_scope:
          - "main.py (week derivation only)"
          - "utils.py (a new helper if one is cleaner than inlining in main.py -- must not change get_cfb_week's own behavior beyond T1)"
        forbidden_scope:
          - "model/ -- the week is consumed unchanged"
          - "The --week CLI flag's precedence, which stays highest"
          - "weekly-update.yml -- PR #8's date-pin stays until this ships and is proven; removing it is a separate follow-up"
        dependencies: ["T1"]
        parallelizable: false
        expected_validation:
          - "Simulating 2026-09-08 (the delayed Tuesday run) yields week 1 WITHOUT the --week override -- i.e. this fix makes PR #8's hand-pin unnecessary"
          - "Simulating a normal Sunday run mid-season yields the same week the current code would have produced (no behavior change on the happy path) -- check several 2024/2025 Sundays"
          - "An explicit --week still overrides both paths"
          - "A run before any game has been played falls back cleanly rather than crashing or returning a negative/None week"

      - id: "T2"
        repo: "wmentrekin/cfb-rankings"
        title: "Stop creating week columns whose only games are diverted into dedicated slots"
        objective: >
          Fix the phantom empty column: build_canonical_columns() must not emit a
          week-N column when every row in that bucket is diverted elsewhere by
          _classify_row_slot() (the Army-Navy game, and any identified
          conference-championship game). Derive the column list from rows that
          actually land in a week slot, rather than from all regular-season rows.
        assigned_domain: "data-engineer"
        owned_scope:
          - "artifacts/schedule.py (build_canonical_columns and, if needed, the ordering of identification vs column derivation)"
        forbidden_scope:
          - "The artifact's JSON shape; slot_id values; schedule_grid view"
        dependencies: ["T1"]
        parallelizable: false
        expected_validation:
          - "For 2026, no week-15 column is emitted (its only row is Army-Navy, which is diverted), and the Army-Navy column still carries that game"
          - "For 2025 (a completed season with real postseason data), no week column becomes empty-for-every-team, and no week that legitimately has games disappears"
          - "Every team still has exactly one cell per canonical column"
      - id: "T3"
        repo: "wmentrekin/cfb-rankings"
        title: "Replace the conference-championship heuristic with a positive signal"
        objective: >
          identify_conference_championship_games() must stop asserting a matchup
          when none is determined. Replace "latest conference game" with: the lone
          conference game occupying a week bucket by itself, strictly later than the
          bucket containing that conference's regular slate. When a bucket holds
          more than one of the conference's games (rivalry week), identify nothing.
          Keep the Army/Navy exclusion already present. Real games must still render
          for non-qualifying-format conferences (e.g. Sun Belt) once determined --
          only the COMPUTED statuses stay gated to the confirmed-format list.
        assigned_domain: "data-engineer"
        owned_scope:
          - "artifacts/schedule.py (identify_conference_championship_games and its call sites)"
        forbidden_scope:
          - "artifacts/schedule_standings.py's clinch/eliminate algorithm -- unchanged"
        dependencies: ["T1"]
        parallelizable: false
        expected_validation:
          - "REGRESSION BAR: on completed 2024 AND 2025 data, every real conference title game is still identified for every qualifying conference (this is the check the previous pass passed 16/16 -- it must not regress)"
          - "On in-progress 2026 data, ZERO championship games are identified -- specifically, the six ACC games tied at 2026-11-28 05:00 must yield nothing, not a tie-broken pick"
          - "No 'multiple distinct games tied' warning fires for 2026 anymore, because the code no longer tie-breaks at all in that situation"
      - id: "T4"
        repo: "wmentrekin/cfb-rankings"
        title: "Rename the postseason column labels"
        objective: >
          Change the emitted `label` values only, keeping slot_id stable:
          "Conference Championship" -> "Week 14 (CCG)"; "Army-Navy Game Week" ->
          "Week 15"; "CFP 1st Round + Other Bowls" -> "Bowls".
        assigned_domain: "data-engineer"
        owned_scope:
          - "artifacts/schedule.py (the CONF_CHAMPIONSHIP_SLOT / ARMY_NAVY_SLOT / CFP_SLOTS label constants)"
        forbidden_scope:
          - "slot_id values -- they must not change, the frontend keys off them"
        dependencies: []
        parallelizable: true
        expected_validation:
          - "Emitted labels read Week 0..Week 13, Week 14 (CCG), Week 15, Bowls, CFP Quarterfinals, CFP Semifinals, CFP National Championship"
          - "slot_id values unchanged (conf-championship, army-navy, cfp-r1-bowls, ...)"
      - id: "T5"
        repo: "wmentrekin/cfb-rankings"
        title: "Open the backend PR"
        objective: "Open the PR for B1 against main; record number/URL in status.yaml and implementation-report.yaml."
        assigned_domain: "generalist-developer"
        owned_scope: []
        forbidden_scope: []
        dependencies: ["T1", "T1b", "T2", "T3", "T4"]
        parallelizable: false
        expected_validation:
          - "PR opened against main with a description tracing each change to the user's feedback item"
      - id: "T6"
        repo: "wmentrekin/cfb-rankings"
        title: "VERIFICATION: independent review + test of B1"
        objective: >
          MANDATORY, not optional -- this is the stage the previous pass skipped.
          Spawn the reviewer agent against B1's diff and the tester agent against
          its executable checks. Post findings as real PR review comments in
          addition to chat. Fill in implementation-report.yaml's review_summary and
          test_summary with actual content.
        assigned_domain: "reviewer + tester"
        owned_scope: []
        forbidden_scope:
          - "Merging -- agents never merge"
        dependencies: ["T5"]
        parallelizable: false
        expected_validation:
          - "reviewer findings posted to the PR; test_summary and review_summary genuinely populated"
          - "Any confirmed finding either fixed on the same branch (within the 2-cycle loop cap) or explicitly recorded as accepted"

  - id: "B2"
    goal: "personal-site: density, layout, and labels"
    tasks:
      - id: "T7"
        repo: "wmentrekin/personal-site"
        title: "Fix control layout so the toggle and selectors hold fixed positions"
        objective: >
          The tab toggle currently shifts horizontally when switching tabs, because
          the week selector to its right disappears on Season Grid. Restructure the
          panel header: toggle pinned top-right of the card, season and week
          selectors on their own line below the card title and above the table,
          left-aligned. Hiding the week selector must not move anything else.
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/pages/projects/cfb-rankings/index.astro (panel-head markup + styles)"
        forbidden_scope:
          - "src/components/RankingsTable.astro"
        dependencies: []
        parallelizable: true
        expected_validation:
          - "Toggling tabs moves neither the toggle nor the season selector by a single pixel"
      - id: "T8"
        repo: "wmentrekin/personal-site"
        title: "Per-tab season dropdowns defaulting to each tab's most recent"
        objective: >
          Today the season list is the UNION of rankings and schedule seasons with a
          rankings-driven default, so Season Grid offers 2025 (which has no schedule
          artifact) and defaults to it. Each tab must offer only the seasons ITS
          artifact has, and default to that tab's most recent. Switching tabs
          repopulates the shared control accordingly.
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/pages/projects/cfb-rankings/index.astro (season list derivation + selector script)"
        forbidden_scope:
          - "src/components/RankingsTable.astro"
        dependencies: []
        parallelizable: true
        expected_validation:
          - "On Season Grid the dropdown lists only seasons with a schedule artifact (currently 2026 alone) and defaults to the newest"
          - "On Rankings it lists only seasons with rankings data and defaults to the newest"
          - "Switching tabs never leaves a season selected that the active tab has no data for"
      - id: "T9"
        repo: "wmentrekin/personal-site"
        title: "Density pass: fit >18 rows and 6-8 week columns on a laptop"
        objective: >
          Compress the grid substantially. Target: at least 18 team rows and 6-8
          week columns visible simultaneously at ~1440x900, and materially better on
          mobile. Team column keeps logo + name + record but compressed (user's
          explicit choice over name-only). Thinner rows, narrower columns, smaller
          type/spacing throughout. Revisit the 70vh max-height, which currently caps
          visible rows.
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/components/ScheduleGrid.astro (markup + styles)"
          - "src/pages/projects/cfb-rankings/index.astro (only if the client-side render mirror needs matching changes)"
        forbidden_scope:
          - "src/components/RankingsTable.astro"
        dependencies: []
        parallelizable: false
        expected_validation:
          - "Measured at ~1440x900: >=18 rows and 6-8 week columns visible at once"
          - "Sticky header, sticky first column, and the corner cell still work with no bleed-through"
          - "Mobile is materially denser than before; note the achieved row/column counts rather than claiming a target that wasn't met"
      - id: "T10"
        repo: "wmentrekin/personal-site"
        title: "New cell format, neutral-site fix, and status label mapping"
        objective: >
          Three changes to cell rendering. (1) FORMAT: a played cell reads
          "@ {opponent logo} W 45-6" -- prefix, then logo, then badge and score, with
          NO opponent name text; unplayed reads prefix + logo. A team with no logo
          (FCS opponents) falls back to its name, which must still fit the narrower
          column. (2) NEUTRAL SITE: both participants read "vs", never "@" -- today
          the nominal away team shows "@". (3) LABELS: map (status, slot_id) to
          display text -- possible+conf-championship -> "Still in the Hunt",
          clinched -> "Clinched", eliminated -> "Eliminated",
          possible+cfp-r1-bowls -> "Not Yet Eligible", eligible -> "Eligible",
          ineligible -> "Ineligible". Stop rendering conditional_opponent.
          Both the .astro component and its client-side mirror in index.astro must
          change together -- they are a known 1:1 duplication.
        assigned_domain: "frontend-engineer"
        owned_scope:
          - "src/components/ScheduleGrid.astro"
          - "src/pages/projects/cfb-rankings/index.astro (the renderScheduleGrid mirror)"
        forbidden_scope:
          - "src/components/RankingsTable.astro"
        dependencies: []
        parallelizable: false
        expected_validation:
          - "A played game renders '@ {logo} W 45-6' with no opponent name"
          - "A known neutral-site game reads 'vs' on BOTH teams' rows (e.g. Louisville's Nashville game, which currently shows '@')"
          - "A logo-less FCS opponent falls back to a name that fits the column"
          - "Championship column reads Still in the Hunt / Clinched / Eliminated; Bowls column reads Not Yet Eligible / Eligible / Ineligible"
          - "The server-rendered component and the client-side mirror produce identical markup -- verify by switching season and confirming cells look unchanged"
      - id: "T11"
        repo: "wmentrekin/personal-site"
        title: "Open the frontend PR"
        objective: "Open the PR for B2; record number/URL in status.yaml and implementation-report.yaml."
        assigned_domain: "generalist-developer"
        owned_scope: []
        forbidden_scope: []
        dependencies: ["T7", "T8", "T9", "T10"]
        parallelizable: false
        expected_validation:
          - "PR opened; description notes it depends on B1 having merged and a pipeline run having landed"
      - id: "T12"
        repo: "wmentrekin/personal-site"
        title: "VERIFICATION: independent review + test of B2"
        objective: >
          MANDATORY. Reviewer against B2's diff, tester against the build and
          rendered output. Findings posted as PR review comments. review_summary and
          test_summary genuinely filled in.
        assigned_domain: "reviewer + tester"
        owned_scope: []
        forbidden_scope:
          - "Merging"
        dependencies: ["T11"]
        parallelizable: false
        expected_validation:
          - "reviewer findings posted to the PR; both summaries populated"

ordering_notes:
  - "B0 (user's Cloudflare change) is independent and can happen at any time, but ideally before B2's review so the frontend PR's preview shows real data -- that is the whole point of doing it first."
  - "Within B1: T1 (week boundary) before T1b (pipeline week derivation), T2 (column derivation), and T3 (championship identification) -- all three depend on which bucket a game lands in. T4 (labels) is independent and parallelizable."
  - "T1b touches main.py only; T2/T3 touch artifacts/schedule.py only, so T1b can run in parallel with them once T1 lands."
  - "A PIPELINE RUN must land between B1's merge and B2's review. The frontend renders whatever the artifact says, so B2's week columns and labels only become verifiable after weekly-update.yml republishes. Either wait for the Sunday cron or trigger workflow_dispatch."
  - "B2's tasks are largely independent of each other; T9 (density) and T10 (cell format) both touch ScheduleGrid.astro so they should not run as parallel agents against the same file."
  - "Every PR ends with its verification task (T6, T12) BEFORE handoff to the user. Not optional."

risks:
  - risk: "The new championship-identification rule could fail to identify a real title game on some completed season, silently regressing what currently works."
    mitigation: "T3's stated regression bar is explicit: every real title game on 2024 AND 2025 must still be identified for every qualifying conference. Test both seasons, not just the in-progress case the fix targets."
  - risk: "Changing get_cfb_week() globally affects the pipeline's auto-computed week for every future run, not just the grid."
    mitigation: "Verified the model reads CFBD's own week column, so rating inputs are unaffected. T1's validation pins the specific dates that matter (Sept 7 -> 1, Aug 29 -> 0, Dec 12 -> 15, Dec 5 -> 14). Note PR #8 already pinned the imminent Week 1 run explicitly, so that run is insulated from this change either way."
  - risk: "Density work is judged by eye, and the previous pass's mockup review at a different scale with fake data is exactly what missed this."
    mitigation: "T9's validation states measured counts at a specific viewport, and requires reporting the ACHIEVED numbers rather than asserting the target was met. Prefer verifying against the real artifact via a preview deploy once B0 is done."
  - risk: "ScheduleGrid.astro's logic is duplicated 1:1 in index.astro's client-side mirror; changing one and not the other produces cells that change appearance when the user switches season."
    mitigation: "T10 names both files in owned_scope and requires verifying they match by switching season. T9 likewise flags the mirror."
  - risk: "T1b changes how EVERY future pipeline run picks its week, and a wrong pick publishes wrong-labeled rankings to R2 -- the exact class of incident that already happened once this pass."
    mitigation: "T1b's validation requires proving no behavior change on the happy path (several normal 2024/2025 Sundays produce the same week as today's code) before accepting the new path. PR #8's date-pin stays in weekly-update.yml as a belt-and-braces guard for the imminent run; removing it is a separate follow-up after T1b is proven live."

open_questions:
  - "RESOLVED: the 'last completed week' pipeline fix IS in scope -- user said 'lets include it it doesnt hurt'. Added as B1/T1b."
  - "RESOLVED: after B1 merges the user will re-run the pipeline to regenerate every 2025 week's rankings and the current-season grid, so B2 gets real refreshed data to verify against. Sequencing: that re-run happens after tonight's 2026 Week 1 run lands."
  - "NOT ASKED, recorded as an assumption: PR #8's Sept-8 date-pin in weekly-update.yml is left in place by T1b rather than removed in the same PR. Removing it is a one-line follow-up once T1b is proven in a real run."

review:
  status: draft
  loop_count: 0
  notes: []

checkpoint:
  required_before_execution: true
  status: pending
