review_summary:
  status: complete
  reviewer: "delegated subagent, independent of the implementation"
  posted_to_pr: true
  key_findings:
    - severity: blocker
      finding: >
        resolve_target_week() parsed start_dates OUTSIDE its try/except, so a NULL or
        tz-aware start_date would crash main() before setup_logging(). Because
        weekly-update.yml runs main.py with `|| true`, that is a GREEN workflow that
        publishes nothing and still fires the deploy hook.
      resolution: >
        FIXED. Parsing moved into a guarded _naive_utc() helper that returns None for
        NaT/NULL and normalizes tz-aware values to naive UTC; the whole resolution call is
        additionally wrapped.
    - severity: should-fix
      finding: "datetime.now() is naive LOCAL time compared against UTC start_date -- correct only because GH runners are UTC."
      resolution: "FIXED. Uses datetime.now(timezone.utc).replace(tzinfo=None)."
    - severity: should-fix
      finding: >
        Walk-back was uncapped and treated a week with zero games as vacuously complete --
        reachable in Dec 2026, where bucket 16 has no regular games, so a late-December run
        would republish stale ratings as a new week.
      resolution: >
        FIXED. A week must now have games AND no unstarted games to qualify, and the scan is
        capped at MAX_WALK_BACK_WEEKS=2. Both cases have tests.
    - severity: should-fix
      finding: >
        The get_cfb_week fix was HALF-COMPLETE: bucketing used the UTC date, so a Monday 8pm
        ET kickoff (00:00 UTC Tuesday) still landed in the following week -- exactly the games
        the boundary change exists to capture. The repo already documents the real case
        (TCU/North Carolina, Labor Day 2025).
      resolution: >
        FIXED, and this was the most valuable finding. New utils.football_day() rolls the day
        over 4 hours after midnight UTC. The window is 4h, not 6h, because CFBD stores an
        unscheduled kickoff as midnight ET (05:00 UTC) and 2026 weeks 11-13 each open with one
        -- a 6-hour window pulled those placeholders onto the previous Monday and dragged whole
        weeks back. Caught by an existing test failing, and both cases now have tests.
    - severity: should-fix
      finding: "Championship diversion was gated on QUALIFYING_CHAMPIONSHIP_CONFERENCES, so a Sun Belt or Pac-12 title game would mint a near-empty week column beside the championship column -- the same phantom-column class being fixed."
      resolution: "FIXED. Identification now defaults to every conference in the data; the computed statuses stay gated in schedule_standings."
    - severity: should-fix
      finding: "Label derivation could emit two columns reading the same week number."
      resolution: "FIXED. Colliding derived numbers now suffix both labels."
    - severity: should-fix
      finding: "A ~50-line comment block still described the removed heuristic in full and contradicted the code beneath it."
      resolution: "FIXED. Rewritten to describe the positive-signal rule, its Army-Navy carve-out, and its accepted limitation."
    - severity: nit
      finding: "Dead sys.path bootstrap in the repair script; a tautological test; champ_game_ids or set() idiom; no CI runs tests/."
      resolution: >
        Dead bootstrap removed; the tautological test replaced with one that exercises the
        floor. CI wiring for tests/ is NOT done and is recorded as an open issue.
    - severity: accepted-limitation
      finding: "The new championship rule misses a real title game if a make-up game shares its bucket."
      resolution: >
        ACCEPTED, not fixed, and now documented in the code. Rendering a real game in the wrong
        column is the conservative direction; asserting an undetermined matchup is the failure
        this rule exists to prevent.

