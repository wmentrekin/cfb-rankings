open_issues:
  - >
    A non-qualifying conference's real title game (Sun Belt, Pac-12) is not diverted, so it
    mints a near-empty week column beside the Conference Championship column -- the same
    phantom-column class this pass fixes. Widening identification to all conferences was
    tried and REVERTED (it widened the make-up-game false-positive surface and admitted FCS
    conferences, on the one code path that runs every publish). The fix likely belongs in
    column derivation instead: drop a week bucket whose only occupant is a diverted title
    game. December problem, not a tonight problem.
  - >
    The 'has games' requirement in resolve_week_from_starts assumes the forward schedule is
    loaded when week selection runs. It runs BEFORE load_games_to_db, which fetches one week
    at a time, so for a season never bulk-loaded up front, week k+1 is empty -> step back ->
    publish k -> forever. Not reachable for 2026 (793 future rows already loaded); aimed at
    next season.
  - >
    The excluded 2025 schedule artifact is still fetched into public/ and served at its URL --
    hidden from the selector, not from the internet. The durable fix is deleting
    schedule/2025/latest.json from R2 so the index stops listing it; no R2 credentials exist
    in this sandbox.
  - >
    Nothing trips when the UNVERIFIED_SCHEDULE_SEASONS condition clears -- the exclusion must
    be removed by hand once 2025 is regenerated and checked.
  - >
    With 2025 excluded the Season Grid selector has one option, so a change event can never
    fire and the client-side render mirror is unreachable in production. It is still exercised
    by the Rankings tab and was verified by temporarily un-excluding 2025.
  - "B0 (Cloudflare Preview env vars) is still not done -- PR previews will show empty states until the user makes that dashboard change."
  - "No CI runs tests/. Worth a follow-up PR adding a workflow."
  - "PR #8's Sept-8 date-pin in weekly-update.yml is now redundant but deliberately left in place; removing it is a follow-up once T1b is proven in a live run."
  - "The one-off cron `0 7 8 9 *` recurs every Sept 8 while its --week 1 branch is hard-matched to 2026 only."
  - "docs/season-grid-touchups/ must be git rm -r'd before merge per branch-and-pr-workflow.md."
  - "The published 2025 Season Grid artifact is WRONG (it shows Georgia Tech 10-3, which is not their real 2025 record). The user had already scoped a 2025 backfill to a separate pass; this confirms it is needed rather than optional."
  - "Eleven FBS teams carry no logo in the published artifact despite all 138 having a logos-dark/32 URL in the teams table -- a stale teams snapshot at generation time. Regeneration resolves it; no code change made."

