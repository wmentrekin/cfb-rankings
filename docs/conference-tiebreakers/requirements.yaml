artifact: requirements
feature: "conference-tiebreakers"
mode: "large-initiative"
status: ready
owner_skill: work

summary:
  problem: >
    Conference standings are ordered by a flat sort key -- conference win percentage, then win
    differential, then our model rank -- with a head-to-head swap that only fires on groups of
    exactly two. No conference publishes anything resembling that. The real rules are ordered,
    recursive, per-conference procedures, and they govern the standings continuously, not just
    the selection of championship-game participants.
  motivation: >
    The visible symptom was ten teams flagged as contending for a 2025 championship game that
    had already been played. The underlying issue is larger: the row order on every conference
    table, every week, does not follow the rules that actually determine it.
  requested_outcome: >
    Each conference's published procedure, expressed as data, driving the standings order all
    season. Overall record demoted to a fallback that applies only where the chain cannot answer.

goals:
  - "Order every conference's standings by that conference's own published tiebreaker procedure."
  - "Apply the procedure continuously, at every point in the season, not only at championship selection."
  - "Make overall record a fallback that fires only when the chain yields nothing."
  - "Represent the rules as reviewable configuration that someone who can read the source PDFs can correct without touching code."
  - "Record, per team, which step decided its position, so the ordering is explainable."

non_goals:
  - "Reproducing a proprietary metric (SportSource, SP+, ESPN SOR, KPI) or CFP committee rankings."
  - "Simulating a coin toss or commissioner's draw."
  - "Changing any DISPLAYED record. Only the ORDER changes."
  - "Championship-participant status math, beyond it falling out of a correct ordering."
  - "Re-verifying the ten research reports from inside this environment. It is not possible here."

constraints:
  technical:
    - "Primary rule documents are unreachable: the egress gateway returns 403 CONNECT for every conference host and news outlet. Verified by curl, not merely by the WebFetch tool."
    - "No public college-football tiebreaker engine and no machine-readable rule dataset exists to borrow. CFBD has no standings or tiebreaker endpoint."
    - "Several published steps are circular by construction ('record against the next-highest-placed team'). Termination must be guaranteed by construction, not by hoping."
    - "Displayed record and conf_record values must not change."
  product:
    - "Where a rule cites an external ranking, our own model rating substitutes for it -- a declared house rule, and it must be visible as ours rather than presented as the conference's answer."
    - "Ratings are continuous, so a rating step never ties; every coin-toss and draw step below one is unreachable."
  process:
    - "Feature branch and PR. Never commit to main. Independent review before handoff. Agents never merge."
    - "Every new test mutation-tested, with the result reported."
    - "Subagents never touch the live database or R2; they receive fixtures."

assumptions:
  - id: "A1"
    text: >
      The ten researched step orders are PROVISIONAL. Two were demonstrably wrong until real
      ties were recomputed against them, both placing the uncomputable step earlier than it sits.
      The config must carry per-conference provenance so unverified entries are visibly unverified.
  - id: "A2"
    text: >
      A per-step sample-size gate reproduces the user's early-season intent. The NFL requires a
      minimum of four common games out of sixteen -- 25% of the slate -- and skips the step when
      unmet. College plays eight or nine conference games, so the proportional equivalent is two.
  - id: "A3"
    text: >
      Reading a frozen prior ordering for 'record vs placed teams' is a faithful enough reading
      of the published rule. No conference specifies how to resolve the circularity, so any
      implementation picks a convention; this one is stated rather than implied.

repository_sync:
  source: "docs/conference-tiebreakers/status.yaml"
  repositories_confirmed:
    - "/home/user/cfb-rankings (current)"
  accepted_unverified_states: []

repo_context:
  relevant_paths:
    - "artifacts/schedule.py  (_sort_conference_teams and its helpers)"
    - "artifacts/schedule_standings.py  (record tallies)"
    - "tests/test_conference_sort_and_pac12.py"
    - "tests/test_conference_championship_records.py"
    - "NEW: a conference tiebreaker rule configuration"
    - "NEW: the tiebreaker engine module"
  prior_artifacts:
    - "PR #18 -- record-magnitude interim fix; its _conf_net is superseded here."
    - "Research artifact: https://claude.ai/code/artifact/a7724efc-9718-4fb6-bdf3-9c9ecfb9344c"

research:
  repo_findings:
    - id: "F1"
      finding: >
        Four real 2025 ties were recomputed from live data and three are reproduced exactly by
        computable steps: the ACC five-way by opponents' combined conference win% (Duke 32-32,
        .500, best of the group); the MAC three-way by common opponents (Miami (OH) 3-0); the
        American three-way by head-to-head (North Texas beat Navy). These are the acceptance
        fixtures.
    - id: "F2"
      finding: >
        The Mountain West four-way is NOT reachable by any record-based measure. UNLV played in
        the title game with the worst head-to-head record of the four (0-2) and bottom-tied
        strength of schedule. Only the external composite explains it. This is the honest limit
        of the approach and must be represented, not papered over.
    - id: "F3"
      finding: >
        min_sample=2 on common opponents is empirically justified, not arbitrary: the ACC's
        five-way had a common set of exactly one team (Syracuse, beaten by all five), so a gate
        of 2 correctly SKIPS that step and lets the strength-of-schedule step decide -- which is
        what actually happened. A gate of 1 would stall on a worthless one-game sample.
  platform_findings:
    - id: "F4"
      finding: >
        nflverse/nflseedR encodes the NFL restart rule explicitly: after peeling off a team,
        restart at step 1 of the two-club format (or step 2 of the three-club format when four
        become three). It caps depth with an enum and never attempts subjective steps.
    - id: "F5"
      finding: >
        SuzuSuzu-HaruHaru/league-standings makes head-to-head scope a declarative per-competition
        config choice (before/after), sidestepping circularity by declaring resolution order
        rather than computing around it.

acceptance_criteria:
  - id: "AC1"
    text: "2025 ACC: the five 6-2 teams order with Duke first, decided by opponents' combined conference win%, and resolved_by names that step."
  - id: "AC2"
    text: "2025 MAC: among the three 6-2 teams, Miami (OH) is first, decided by common opponents."
  - id: "AC3"
    text: "2025 American: among the three 7-1 teams, Navy is placed below North Texas by head-to-head."
  - id: "AC4"
    text: "2025 Mountain West: the four-way tie is NOT silently resolved by a record measure. It falls to the rating substitution and resolved_by says so."
  - id: "AC5"
    text: "Early season: teams tied on conference record with no head-to-head and fewer than min_sample common opponents are ordered by overall record, and resolved_by names the fallback. A 2-0 team sorts above a 1-0 team."
  - id: "AC6"
    text: "No team's displayed record or conf_record changes anywhere in the payload."
  - id: "AC7"
    text: "A conference with no configured rules falls back to the current behaviour rather than raising or producing an arbitrary order."
  - id: "AC8"
    text: "Ordering is deterministic and terminates for every input, including a fully tied conference where no step separates anyone."
  - id: "AC9"
    text: "Each conference's config carries provenance, and a config entry marked unverified is distinguishable from one verified against a real tie."

open_questions:
  - id: "Q1"
    text: "Does the user supply primary rule text before execution, or does execution proceed on provisional research with the config marked unverified?"
    owner: "user"
  - id: "Q2"
    text: "Is min_sample=2 for common opponents accepted as the default?"
    owner: "user"
    recommendation: "Yes -- it is what makes the real 2025 ACC tie resolve correctly."
  - id: "Q3"
    text: "Merge PR #18 first and rebase, or stack this on it?"
    owner: "user"
    recommendation: "Merge #18 first. It fixes a live defect and is finished; this is large and blocked."
  - id: "Q4"
    text: "Should resolved_by be exposed in the published payload and rendered on the site?"
    owner: "user"
    recommendation: "Expose it in the payload now; rendering is a separate frontend decision."

ready_for_planning: true
planning_blockers: []
