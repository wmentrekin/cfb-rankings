decisions:
  - id: "D11"
    decision: >
      Four measures were added for the Group of 6, each shared with parameters rather than
      written per conference -- confirming the shared-primitive thesis rather than denting it.
    rationale: >
      conditional_external_ranking (the CFP cascade) serves three conferences; overall_win_pct
      serves three in three different variants; divisional_record and the division-scoped modes
      of two existing primitives serve one. The Group of 6 needed more new MEASURES than the
      Power 4 did, but not one line of conference-specific logic: every difference landed as a
      parameter, and the MAC and Pac-12 needed nothing new at all.
  - id: "D12"
    decision: >
      The rating substitution costs more in the CFP cascade than anywhere else, and a top-25
      cutoff is the proxy chosen to preserve it.
    rationale: >
      The CFP poll ranks 25 teams, so "was ranked going into the final weekend" is a real filter
      in the Mountain West, Sun Belt and American procedures. Our rating ranks everyone, so
      without a cutoff every tied team counts as ranked, the final-weekend condition never binds,
      and the whole cascade silently degrades to a plain rating comparison. ranked_cutoff=25
      mirrors the poll's size. It is a proxy and not the thing itself -- our top 25 is not the
      committee's -- and it is the single largest interpretive liberty in the ten transcriptions.
  - id: "D13"
    decision: >
      The Sun Belt's multi-team step 1 is gated on a complete round robin even though its own
      text does not say so.
    rationale: >
      Nine documents either state the gate or state no multi-team intra-group step at all; the
      Sun Belt states the measure bare. The gate is applied in the safe direction, because an
      ungated intra-group ranking on a partially-played group is exactly what would have wrongly
      placed UNLV last in the real 2025 Mountain West tie, and with seven-team divisions whose
      members all play one another it should be a no-op in practice. Recorded in that rule set's
      notes as an addition to the source, with the condition that would reverse it.
  - id: "D9"
    decision: >
      A conference with no configured rules keeps the PRE-ENGINE ordering, rather than falling
      through to the engine's own fallback.
    rationale: >
      The engine's fallback is overall record then rating then name, which has no head-to-head
      step -- so routing an unconfigured conference through it would LOSE the two-team
      head-to-head swap those six conferences have today. AC7 asks for an explicit fallback to
      current behaviour, and this is it: merging T4 changes nothing for the American, Mountain
      West, MAC, Sun Belt, Conference USA or Pac-12 until their rules arrive. A test asserts
      that an unconfigured conference does NOT resolve a three-way tie by intra-group record,
      so the guess this feature exists to avoid cannot creep back in through the default.
  - id: "D10"
    decision: "_conf_net needed no deletion; it never landed on main."
    rationale: >
      Plan K9 called for removing it, but it existed only on the closed PR #18's branch. The
      surviving half of that work, ordering a larger record above an equal-percentage smaller
      one, is implemented instead inside the engine's fallback, where it now applies to every
      conference rather than to one sort key.
  - id: "D7"
    decision: >
      A step's partition is read as an ORDERING between groups, not as a selection event -- the
      one reframing that lets participant-selection rules drive full-season standings.
    rationale: >
      Every published procedure answers "which one or two teams go to the title game" and talks
      about teams being selected or eliminated. This project needs a total order over the whole
      group, all season. Reading "selected" as "placed above everyone remaining" and "eliminated"
      as "placed below everyone still in contention, and still ordered among its own band" makes
      the published chains usable verbatim. It also makes the Big Ten's "shall not be pulled back
      into the tiebreaker" structural rather than a flag to check: recursion happens strictly
      within a group, so a team can never cross above one an earlier step placed higher.
  - id: "D8"
    decision: "sweep_in_out requires a result against EVERY other tied team, not every one it played."
    rationale: >
      The first implementation promoted a team that beat all the tied teams it happened to play.
      The texts say "defeated EACH OF THE OTHER Tied Teams" (ACC) and "beat ALL THE OTHER tied
      teams" (SEC), and the looser reading inverts a real result: in the 2025 ACC five-way,
      Georgia Tech played one of the other four and won, Duke played one and lost, so the step
      would have resolved a five-team tie on a single game and placed Duke last. Duke actually
      won that tie four steps later on its opponents' combined conference record. Caught by a
      driver test written against the real outcome, not by review.
  - id: "D1"
    decision: "Rules live as configuration data, not code."
    rationale: >
      The step ORDER differs genuinely between conferences, the content cannot be verified from
      here, and two of ten research reports were already wrong. A config file with provenance
      marks is correctable by someone who can read the source PDFs; hard-coded logic is not.
  - id: "D2"
    decision: "The information threshold is a per-step sample-size gate, not a season-phase switch."
    rationale: >
      Follows the NFL's own rule text, where the common-games step requires a minimum of four
      common games and is skipped when unmet. Achieves what the user asked for -- overall record
      deciding early-season cases -- without inventing a calendar rule no conference publishes.
  - id: "D3"
    decision: "record_vs_placed reads the last STABLE ordering, never the in-progress one."
    rationale: >
      "Record against the next-highest-placed team" is circular by construction. Prior art
      (league-standings) resolves this by making resolution scope an explicit config choice
      rather than solving the loop. Reading a frozen prior ordering guarantees termination.
  - id: "D4"
    decision: "Recommend merging PR #18 before this branch proceeds, rather than stacking."
    rationale: >
      #18 fixes a live visible defect and is complete. This feature supersedes only its
      _conf_net term. Stacking would couple a small finished fix to a large blocked one.
    outcome: >
      SUPERSEDED. The user closed #18 and folded it in; _placement_net is to be lifted from the
      preserved branch at b2a3ada as part of the T4 fallback chain.
  - id: "D5"
    decision: "The rule config is JSON, not YAML, despite plan K1's wording."
    rationale: >
      All five GitHub Actions workflows run `uv sync --frozen`, and PyYAML is not a declared
      dependency. Adding one means regenerating uv.lock, which is a real cost for zero benefit:
      JSON is the same declarative shape with a stdlib parser. The loss is comments, which the
      schema replaces with explicit `notes` and per-step `cites` fields -- arguably better,
      since a citation in a required field is reviewable and a comment is not.
  - id: "D6"
    decision: >
      Shared primitives, per-conference ordering -- answering the user's question directly:
      conferences DO share operations, and the differences are order and parameters, not logic.
    rationale: >
      head-to-head, common opponents, record vs best-placed opponent and cumulative opponent
      conference win% appear in three of the four Power 4 procedures with the same meaning and
      different sequence numbers. Each is implemented ONCE in STEP_REGISTRY; a conference is an
      ordered list of registry keys plus parameters. Adding one of the six outstanding
      conferences is therefore expected to be a config edit with no new code -- and if it is
      not, that is a schema escalation, not an invitation to special-case a conference.

