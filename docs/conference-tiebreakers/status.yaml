  pre_execution_required: true
  pre_execution_status: answered_hold
  options:
    - proceed
    - revise_plan
    - narrow_scope
    - stop

blockers:
  - id: "B1"
    blocker: >
      Primary rule documents cannot be read from this environment. Verified at the network
      layer, not just the tool layer: curl to theamerican.org and en.wikipedia.org both get
      "CONNECT tunnel failed, response 403" from the egress gateway, while
      raw.githubusercontent.com returns 200. The policy is a development-infrastructure
      allowlist. No retry or alternate route is legitimate.
    consequence: >
      Rule content cannot be authored from research. It must be supplied by the user and stored
      as reviewable configuration with per-conference provenance.
    owner: "user"

decisions:
  - id: "D1"
    decision: "Rules live as configuration data, not code."
    rationale: >
      The step ORDER differs genuinely between conferences, the content cannot be verified from
      here, and two of ten research reports were already wrong. A config file with provenance
      marks is correctable by someone who can read the source PDFs; hard-coded logic is not.
  - id: "D2"
    decision: "The information threshold is a per-step sample-size gate, not a season-phase switch."
    rationale: >
      Follows the NFL's own rule text, where the common-games step requires a minimum of four
      common games and is skipped when unmet. Achieves what the user asked for -- overall record
      deciding early-season cases -- without inventing a calendar rule no conference publishes.
  - id: "D3"
    decision: "record_vs_placed reads the last STABLE ordering, never the in-progress one."
    rationale: >
      "Record against the next-highest-placed team" is circular by construction. Prior art
      (league-standings) resolves this by making resolution scope an explicit config choice
      rather than solving the loop. Reading a frozen prior ordering guarantees termination.
  - id: "D4"
    decision: "Recommend merging PR #18 before this branch proceeds, rather than stacking."
    rationale: >
      #18 fixes a live visible defect and is complete. This feature supersedes only its
      _conf_net term. Stacking would couple a small finished fix to a large blocked one.

