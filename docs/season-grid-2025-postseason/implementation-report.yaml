pr:
  number: 14
  url: "https://github.com/wmentrekin/cfb-rankings/pull/14"

changes:
  files:
    - "scripts/publish_season_schedule_artifact.py (new)"
    - ".github/workflows/publish-schedule-artifact.yml (new)"
    - "tests/test_season_schedule_publish.py (new)"
    - "tests/test_postseason_slots.py (new)"
  modules: ["scripts", "tests", "workflows"]
  docs_updated: []

local_validation:
  checks_run:
    - "python -m pytest tests/ -q: 81 before, 118 after (37 new, 0 regressions)."
    - "Workflow YAML parses; dispatch inputs and step order confirmed."
    - "All 37 new tests mutation-checked by the implementing agent."
    - >-
      Orchestrator hardening before commit: dispatch inputs moved out of the run body into
      environment variables. ${{ }} is substituted before bash sees the line, so an input like
      `2025"; curl ...` would have run as its own command.
  failures: []
  skipped:
    - "Nothing was executed against the live database or R2 during implementation, by design."

review_summary:
  status: "code review cycle 1 complete; fixes in progress"
  key_findings:
    - >-
      VERIFIED GOOD by execution: dry-run uploads nothing (the only R2 writes are inside
      publish_schedule_artifact and refresh_schedule_index; the script imports neither, and there
      is no import-time boto3 or engine construction); the injection hole is closed with zero
      ${{ }} remaining in any run body; secrets match weekly-update.yml exactly; scope is clean at
      1173 insertions and zero deletions. build_schedule_payload was independently proven
      deterministic across 50 row shuffles and a reversed teams_meta.
    - >-
      BLOCKER: nothing in the publish path can distinguish a success from a skip.
      publish_schedule_artifact never raises and returns cleanly on all six bail-outs; the script
      ignores the return and prints "Done"; and logging is never configured, so the confirmation
      line is dropped at the default WARNING level. Bad R2 credentials would yield a green job, a
      convincing payload artifact, and the stale object still in the bucket. Same failure class as
      PR #13's OVERRIDE_FAILURE work.
    - >-
      BLOCKER: AC3c's premise was wrong. Diffing the dry-run payload against the real-run payload
      compares two LOCAL builds; neither is read back from R2. It cannot detect a failed upload, a
      wrong key, or a partial write. Being fixed as an actual round trip via get_object.
    - "BLOCKER: --season -1 builds an empty payload and reports success, exiting 0."
    - >-
      BLOCKER: the summary's postseason slot ids are a constant -- build_canonical_columns emits
      all four CFP slots for any non-empty season, so it reads as evidence of a populated
      postseason when it is nothing of the kind.
    - >-
      BLOCKER: [ \"$DRY_RUN\" = \"true\" ] fails OPEN. Anything not exactly \"true\" publishes.
      Being replaced by a --publish opt-in matching repair_unplayed_game_winners.py's --apply.
    - >-
      NIT: a characterization test pinning a sponsored bowl string sits under the STABLE CONTRACT
      banner, so phase 2's sponsor strip would fail it as if it were a regression -- the exact
      confusion the split exists to prevent.

test_summary:
  status: "unit tests green; production verification not yet possible"
  checks_run: ["python -m pytest tests/ -q -> 118 passed"]
  failures: []
  gaps:
