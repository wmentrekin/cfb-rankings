early_findings:
  - id: "F1"
    finding: >-
      Bowl names are in games.notes, not playoff_bowl_name. All 35 non-playoff 2025 bowls carry
      their sponsor name there ("Union Home Mortgage Gasparilla Bowl", "Bucked Up LA Bowl").
      playoff_bowl_name is populated only for the 11 CFP games, where its value is the far less
      useful "College Football Playoff First Round Game".
  - id: "F2"
    finding: >-
      playoff_round_order is NULL for all 11 of 2025's CFP games, though playoff_round_name and
      playoff_bracket_slot are set. Migration 0002 added the column and
      scripts/backfill_2025_postseason.py exists, so this needs checking before postseason column
      ordering can rely on it.
  - id: "F3"
    finding: >-
      2025 postseason is complete: 46 games, all 46 with a winner. 11 are CFP (4 first round,
      4 quarterfinals, 2 semifinals, 1 final), 35 are ordinary bowls.
  - id: "F4"
    finding: >-
      The `ratings` table has Georgia Tech at 9-3 after week 15, not the 10-3 personal-site's
      exclusion comment cites. The Season Grid computes its own records from schedule_grid via
      artifacts/schedule_standings.py, so the discrepancy is probably in that path, not in ratings.
      Needs confirmation.

