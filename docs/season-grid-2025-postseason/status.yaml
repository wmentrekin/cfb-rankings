    Indiana 16-0 with the title win 27-21. Both match the rows read from the database earlier.
  reconciliation: "39 + 4 + 2 + 1 = 46 postseason games, matching the database count exactly"
  phase_2_evidence:
    - >-
      The Bowls column carries 36 distinct game names, 9 to 41 characters, in a 6rem column --
      Xbox Bowl and Rate Bowl at 9, Radiance Technologies Independence Bowl at 39, College
      Football Playoff First Round Game at 41.
    - >-
      The pre-bowl rank effect is stronger than expected in the abstract: Miami played in the
      national championship game and carries rank 17. Indiana 1, Ole Miss 6, Georgia Tech 37.

early_findings:
  - id: "F1"
    finding: >-
      CORRECTED. The first version of this finding was wrong: it was written from a partial query
      that surfaced only First Round rows, and the error propagated into a research handoff.
      Across all 11 CFP games, playoff_bowl_name is: "College Football Playoff First Round Game"
      for the 4 first-round games, the REAL bowl for the quarterfinals (Rose, Sugar, Cotton,
      Orange) and semifinals (Fiesta, Peach), and the full sponsored title for the championship.
      The 35 ordinary bowls have playoff_bowl_name NULL and their sponsor name in notes.
      _game_name_for_row is `playoff_bowl_name or notes`, so naming is largely correct today --
      only the four first-round labels and the very long championship label are awkward.
  - id: "F2"
    finding: >-
      RESOLVED as a non-issue. playoff_round_order is NULL for all 11 CFP games, but nothing reads
      it. _bucket_cfp_slot matches substrings of playoff_round_name against four hardcoded slots,
      and 2025's names (First Round / Quarterfinal / Semifinal / National Championship) all bucket
      correctly. No backfill needed.
  - id: "F5"
    finding: >-
      There is NO postseason-specific CSS anywhere in personal-site -- not one selector targets a
      bowl, playoff or championship cell. Every postseason column is a plain 6rem week column with
      class sg-th. The four CFP first-round games also share the "cfp-r1-bowls" column with all 35
      ordinary bowls, so a playoff game currently renders identically to any minor bowl.
  - id: "F6"
    finding: >-
      playoff_bracket_slot (FR1-FR4, QF1-QF4, SF1-SF2, CH) is fully populated for 2025 and
      entirely unused by any code. It is the natural key for bracket ordering.
  - id: "F7"
    finding: >-
      _bucket_cfp_slot and _game_name_for_row have no test coverage at all, and no test asserts
      compute_team_records counts postseason games toward a record.
  - id: "F8"
    finding: >-
      The stale artifact is confirmed: personal-site's on-disk schedule/2025/latest.json was
      generated 2026-09-06 -- before PRs #11 and #12 -- and does say Georgia Tech 10-3. The live
      schedule_grid gives 9-4 over the same 13 distinct game ids, so one game's status differs
      rather than a row being double counted.
  - id: "F3"
    finding: >-
      2025 postseason is complete: 46 games, all 46 with a winner. 11 are CFP (4 first round,
      4 quarterfinals, 2 semifinals, 1 final), 35 are ordinary bowls.
  - id: "F4"
    finding: >-
      The `ratings` table has Georgia Tech at 9-3 after week 15, not the 10-3 personal-site's
      exclusion comment cites. The Season Grid computes its own records from schedule_grid via
      artifacts/schedule_standings.py, so the discrepancy is probably in that path, not in ratings.
      Needs confirmation.

model_routing:
  provider: "Claude Code / Anthropic"
  provider_map_verified_at: "2026-09-07"
  substitutions: []
  unresolved_limitations:
    - >-
      Subagents inherit the main conversation's extended-thinking setting, so per-agent reasoning
      level is advisory even though model selection is enforced. plan.yaml's routing_enforced:true
      overstates this; corrected in implementation-report.yaml rather than left as an unsupported
      enforcement claim.

next_action: >-
  Wait for the Supabase connector. Then run docs-staged records.sql, feed the rows to
  scratchpad/verify_records.py against the dry-run payload, and if AC3 passes dispatch
  publish-schedule-artifact.yml with season=2025 dry_run=false. The script's R2 read-back and the
  workflow's confirmation-marker step prove the publish landed. Only then open the personal-site
  un-gate PR.
next_recommended_command: "$work"
user_input_needed: false
