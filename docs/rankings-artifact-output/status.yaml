decisions_execution:
  - "R2 credentials appeared in .env mid-execution (user finished provisioning while data-engineer-1 was running). Its 'R2 unconfigured' validation call inadvertently became a real write: rankings/2025/week-03.json, rankings/2025/latest.json, rankings/latest.json (21181 bytes each, confirmed correct via read-only list_objects_v2 and a spot-check against raw DB data). Content is correct, not garbage -- left in place rather than reverted, since B3's backfill will naturally supersede the 'latest' pointers once it completes weeks 1-15 in order."
  - "GitHub repo secrets R2_ACCOUNT_ID/R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY/R2_BUCKET_NAME set on wmentrekin/cfb-rankings via gh CLI, values read directly from user's local .env, never printed to chat/logs."
  - "personal-site's eventual read access to R2 (public bucket vs custom domain vs private+read-only-token) is explicitly deferred to the migration feature -- no changes made to personal-site or Cloudflare Pages config this pass."
decisions:
  - "Classified as bounded-feature: new pipeline step + new module + CI wiring + backfill script + new cloud dependency, cohesive single unit of work."
  - "Storage decided directly with user (not via discovery agent): Cloudflare R2. Bucket/API token provisioning is a manual step the user must do themselves (dashboard or wrangler login) -- not something an agent can do autonomously. Plan must separate 'code that assumes R2 credentials exist' from 'actually validating a live upload', with a checkpoint for the user to provision credentials before live validation."
  - "Explicit non-goal for this pass: no changes to personal-site or frontend/streamlit_app.py. This is additive-only to cfb-rankings' own pipeline."
  - "repo-researcher-2 finding: personal-site's stub schema is {season, week, generated_at_utc, rankings:[{rank, team, record, rating, delta}]} -- no conference field anywhere in code/props, only a single unstructured roadmap prose bullet mentions 'conference and postseason views' as aspirational, not a committed contract. RankingsTable.astro is generic (headers/rows props, no domain typing), so schema changes on the cfb-rankings side won't be blocked by that component. No historical-file naming convention exists yet in personal-site (only one latest-rankings.json). Since we are not touching personal-site this pass, this is purely informative -- conference can still be added to our artifact schema per the user's stated preference, personal-site just isn't the source of that requirement."
  - "repo-researcher-1 finding: Streamlit's exact rank/delta logic confirmed -- rank = sort by rating desc, reset_index, rank = index+1 (no explicit tie-break, pandas stable sort on Supabase's return order). delta = prev_rank - current_rank (positive = moved UP). First appearance / missing prev week (incl. week-1 with no data) yields delta=0, not null. 'Previous week' is strictly week-1 in the same season, no fallback search for an earlier populated week. Two open design decisions the new artifact module must make explicitly since existing code has no real precedent: (1) tie-break for identical ratings -- add a deterministic secondary sort key (e.g. team name) instead of Streamlit's arbitrary DB-order tiebreak, for backfill reproducibility; (2) whether to preserve Streamlit's fragile strict-week-minus-1 previous-week lookup or improve it (e.g. most-recent-prior-populated-week)."
  - "repo-researcher-1 finding: dominant DB pattern confirmed (load_dotenv -> postgresql+psycopg2 URL from DB_USER/DB_PASSWORD/DB_HOST/DB_PORT/DB_NAME env vars + sslmode=require -> sqlalchemy create_engine -> pd.read_sql_query for reads / Table+on_conflict_do_update for writes -> engine.dispose()). No existing code reads `ratings` back out via this pattern (only Streamlit reads ratings, via the separate Supabase-client pattern) -- new module needs its own read function, modeled on model/process_data.py's get_games_by_year_week style. New pipeline-only deps (e.g. boto3) must go in pyproject.toml's [project.optional-dependencies].pipeline extra (not base dependencies) to be picked up by `uv sync --frozen --extra pipeline` in CI. teams.conference column confirmed: lowercase `conference`, sourced directly from CFBD API's team.get('conference'), no rename. Re-confirmed: zero export/upload code (json.dump/to_json/to_csv/boto3/s3/r2) exists anywhere outside this feature's own planning docs. No existing top-level package for 'generate/publish artifact' concern -- would be a new module."

