decisions:
  - id: "D4"
    decision: >-
      A first-round bye renders seed-aware, "Bye (No. 1)" -- CONDITIONAL on a seed being
      sourceable. See risk R1: if CFBD does not expose one, fall back to a plain "CFP Bye"
      rather than deriving a seed from a pattern observed in a single season.
  - id: "D3"
    decision: >-
      A CFP game is marked with a text badge in the cell rather than only a colour accent, so it
      needs no legend to be understood.
  - id: "D2"
    decision: >-
      Cells keep a SHORT one-line label with the full official name on hover/focus. Not
      score-only: hover does not exist on touch and title attributes are not keyboard reachable,
      so a score-only cell would leave phone and screen-reader users with no way to tell which
      bowl a game was. This makes sponsor-stripping load-bearing rather than cosmetic -- the
      stripped name IS the short label.
  - id: "D1"
    decision: >-
      Owner feedback item 2 and item 4 are one coupled change. Verified: the 2025 ACC title game
      (Virginia 20 - Duke 27, week 15, neutral, conference_game=true) currently counts, leaving
      both teams 7-2. Excluding it gives Duke 6-2 and Virginia 7-1 -- exactly the numbers the
      owner quoted -- which is what creates the case where the champion has the worse record and
      the champion-first sort is needed to resolve it.

risks:
  - id: "R1"
    risk: >-
      Seeds are not in the database. games carries playoff_round_name, playoff_round_order,
      playoff_bracket_slot and playoff_bowl_name -- no seed. Route 1 is a CFBD field we do not
      currently ingest, which cannot be checked from this sandbox because the API key is a
      GitHub secret. Route 2 would derive it from quarterfinal bracket slots: 2025's bye teams
      sit in QF1-QF4 as Indiana, Texas Tech, Ohio State, Georgia, and Indiana being the overall
      number one is consistent with slot order encoding seed -- but that is a single season's
      agreement, and a confidently wrong seed on a public page is worse than no seed.
    mitigation: "Attempt route 1; fall back to a plain CFP Bye. Do not ship a derived seed on one season's evidence."

early_findings:
  - id: "F1"
    finding: >-
      A naive "neutral site + late week + conference_game" heuristic does NOT identify
      championship games correctly. Against 2025 it returns two Big Ten candidates (week 14
      Michigan State-Maryland alongside the real week 15 Indiana-Ohio State) and misses the
      American, Mountain West, Sun Belt and Pac-12 titles entirely, since those are not
      necessarily neutral-site. The repo already has identify_conference_championship_games,
      which mints the conf-championship column and has test coverage -- items 2 and 4 must build
      on it rather than invent a second, weaker rule.
  - id: "F2"
    finding: >-
      Three of the owner's four items are cfb-rankings standings/artifact changes, not styling.
      Only the hover treatment lives in personal-site.

open_questions:
  - id: "Q4"
    question: >-
      Can a CFP seed be sourced at all? See R1 -- this is the one decision whose feasibility is
      not established, and it has a defined fallback rather than a guess.
    blocking: false

