artifact: requirements
feature: "season-grid-postseason-format"
mode: "large-initiative"
status: draft
owner_skill: work

summary:
  problem: >-
    Seeing 2025 rendered surfaced four defects. Long bowl and playoff labels wrap to four or five
    lines inside a fixed 6rem cell, so row heights vary wildly down the table. Conference
    championship games count toward conference records, which is not how conference standings
    work -- the standings decide who plays in the title game, not the reverse. Conference
    champions are not surfaced at all in the within-conference order. And a team that earned a
    first-round CFP bye renders as merely "Eligible" in the Bowls column, which reads as a team
    that did not make the playoff at all.
  requested_outcome: >-
    Uniform row heights with the full name still reachable, conference records that exclude the
    title game, champions ordered first within their conference, and byes that say so.

goals:
  - "Cells carry a short one-line label; the full official name stays reachable on hover and focus."
  - "Conference records exclude the identified conference championship game."
  - "The winner of a conference championship game sorts first within its conference, whatever its record."
  - "A first-round CFP bye renders as a distinct state, not as bowl eligibility."
  - "A CFP game is visually distinguishable from an ordinary bowl inside the shared Bowls column."

non_goals:
  - "Changing which games land in which postseason column. The four CFP slots stay as they are."
  - "Rating postseason games, or changing the pre-bowl rank behaviour. Separately deferred by the owner."
  - "Splitting CFP first round into its own column. The owner chose to keep it merged."
  - "Promoting a 'clinched' but not-yet-played team to first. Only an actual championship-game winner is a champion."

constraints:
  technical:
    - >-
      identify_conference_championship_games (artifacts/schedule.py:250-382) is the only sound
      basis for identifying a title game. It requires the game to be the LONE conference game in
      the latest week bucket, separated from a bucket holding two or more, with the conference in
      a curated format list and having at least four members. A neutral-site/late-week filter is
      not equivalent -- against 2025 it returns two Big Ten candidates and misses the American,
      Mountain West, Sun Belt and Pac-12 titles entirely.
    - >-
      It returns Dict[conference, game_id] and is called once, at artifacts/schedule.py:914,
      AFTER compute_standings at :911. Its result never reaches compute_team_records, whose
      signature is (rows, season). schedule_standings.py cannot import schedule.py -- the
      dependency runs the other way -- so exclusion needs either a new parameter threaded through
      compute_standings, or a post-hoc fixup in schedule.py.
    - >-
      _sort_conference_teams (artifacts/schedule.py:830-831) sorts on
      (-conf_pct, -conf_played, -overall_pct, team) plus a head-to-head swap for groups of exactly
      two tied teams. Nothing in an entry carries championship information today. Existing tests
      build entries by hand, so any new key must default rather than become required.
    - >-
      The cfp-r1-bowls slot NEVER falls through to a bye (artifacts/schedule.py:754-759): it
      unconditionally emits the bowl-eligibility placeholder. This is why a bye currently reads
      "Eligible". Documented as deferred scope in docs/schedule-grid/implementation-report.yaml:119.
    - >-
      The only available bye signal is structural: a real row in cfp-quarterfinals with no real
      row in cfp-r1-bowls. _build_team_slot_rows already indexes exactly this.
    - >-
      Any new status value must be added to STATUS_TEXT_BY_SLOT in BOTH
      personal-site/src/components/ScheduleGrid.astro and the hand-mirrored client script in
      src/pages/projects/cfb-rankings/index.astro, or it renders as blank muted text. Nothing
      enforces that the two stay in sync.
    - >-
      No cfb-rankings test asserts a cell's exhaustive key set, so a new field can be added
      without any test noticing the frontend was not updated to match.
  product:
    - "Hover alone is insufficient: it does not exist on touch and title attributes are not keyboard reachable."

assumptions:
  - id: "A1"
    assumption: >-
      Excluding the title game from conference records is correct, not merely preferred. Verified
      against 2025: the ACC final (Virginia 20 - Duke 27, week 15, neutral, conference_game=true)
      currently leaves both at 7-2; excluding it gives Duke 6-2 and Virginia 7-1, exactly the
      numbers the owner quoted.
    confidence: verified
  - id: "A2"
    assumption: >-
      A flat set of championship game_ids is sufficient for exclusion; conference scoping is not
      needed. A conference game is between two members of one conference, so a team can only ever
      meet its OWN conference's identified title game.
    confidence: high

acceptance_criteria:
  - id: "AC1"
    criterion: "Duke reads 6-2 in conference and Virginia 7-1 for 2025, and Duke sorts above Virginia in the ACC."
  - id: "AC2"
    criterion: >-
      Every conference with an identified championship game has its champion sorted first among the
      teams it is grouped with. For a flat conference that is the whole conference. For a
      divisional conference it is that team's own division -- the owner chose division-local
      ordering over reordering or hoisting, so a Sun Belt West champion still renders below the
      East block. Worded this way deliberately, so the criterion is checkable rather than
      aspirational.
  - id: "AC3"
    criterion: "A conference with no identified championship game, and an in-progress season, both sort exactly as they do today."
  - id: "AC4"
    criterion: "Independents are unaffected -- they have no conference record and no championship."
  - id: "AC5"
    criterion: "Indiana's 2025 Bowls cell reads as a first-round bye, not 'Eligible'; a team that missed the playoff still reads as it does today."
  - id: "AC6"
    criterion: "Every postseason cell renders one line of label; no row is taller than its neighbours because of a long name."
  - id: "AC7"
    criterion: "The full official name is reachable without a mouse -- present on hover AND on keyboard focus."
  - id: "AC8"
    criterion: "A CFP game is distinguishable from an ordinary bowl in the Bowls column without reading the label."
  - id: "AC9"
    criterion: "Server-rendered and client-rebuilt grids remain identical, including every new status and field."
  - id: "AC10"
    criterion: "The cfb-rankings suite stays green, and the previously uncharacterised conference-record behaviour gains tests."

open_questions:
  - id: "Q4"
    question: "Whether a CFP seed can be sourced at all, deciding 'Bye (No. 1)' versus a plain 'CFP Bye'."
    blocking: false

ready_for_planning: true
