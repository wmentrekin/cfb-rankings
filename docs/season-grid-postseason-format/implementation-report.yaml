  failures: []

review_summary:
  status: "plan review cycle 1 and code review cycle 1 both complete; all findings closed"
  key_findings:
    - >-
      PLAN REVIEW found two correctness bugs in the plan itself. Threading the championship
      exclusion into compute_team_records would have marked both title-game participants
      "Eliminated" during championship week, every season, because compute_standings feeds the
      same records dict to the clinch/eliminate math and identification does not gate on whether
      the game has been played. And the champion sort as scoped could not have satisfied its own
      criterion for a divisional conference, since the sort runs per division and blocks are
      concatenated afterwards.
    - >-
      CODE REVIEW found the bowl-name rule shipped WRONG names against the real slate -- "City
      Bowl" for Music City, "Forces Bowl" for Armed Forces, "Beach Bowl" for Myrtle Beach, which
      has no sponsor to strip. My instruction caused it and my seven examples, all single-token
      roots, hid it.
    - >-
      CODE REVIEW found three mutations that left the suite entirely green: reverting the
      round_order fix, widening the exclusion gate to "upcoming" (producing three wins and minus
      one loss), and the untested extraction path. All now fail.
    - >-
      CODE REVIEW found the merge-order hazard: emitting the seed columns against a database
      lacking them raises CompileError at compile time, which main.py logged as "they may already
      be loaded" -- silently killing all ingest while the run continued on stale games and
      published them.

open_issues:
  - id: "O1"
    issue: >-
      Migration 0006 was added mid-execution and belongs to no task's owned_scope. It exists
      because schedule_grid is a view with an explicit column list, so migration 0005's columns
      could never have reached the artifact -- every bye would have degraded to the plain label
      forever, indistinguishable from the intended fallback.
    status: "shipped, plan not amended -- recorded here instead"
  - id: "O2"
    issue: "The main.py schema-failure separation is likewise unplanned, taken because the hazard was live on this very PR."
    status: shipped
  - id: "O3"
    issue: >-
      B3 ran in parallel with the cfb-rankings fix cycle, so the frontend was built against a
      contract that changed under it (the bye label moved from game_name to cfp_seed). Cost one
      resync round. Sequencing error, mine.
    status: fixed
  - id: "O4"
    issue: >-
      Pre-existing and out of scope: an em dash server-side versus an en dash client-side on the
      plain bye-week placeholder, 944 occurrences. Filed separately.
    status: "filed, not fixed"

handoff:
